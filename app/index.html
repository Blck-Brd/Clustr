            onEditTripWindow,
            startInDrawMode = false,
            isMobile = false
        }) => {
            const [level, setLevel] = useState('trips');
            const [tab, setTab] = useState('timeline');
            const [drawMode, setDrawMode] = useState(Boolean(startInDrawMode));
            const [clusterRange, setClusterRange] = useState(null);
            const [selectedKeys, setSelectedKeys] = useState(() => new Set());
            const [tileSelection, setTileSelection] = useState(() => new Set());
            const [dragState, setDragState] = useState(null);
            const [name, setName] = useState('');
            const [location, setLocation] = useState('');
            const [targetFolder, setTargetFolder] = useState('');
            const [nameDirty, setNameDirty] = useState(false);
            const [locationDirty, setLocationDirty] = useState(false);
            const [hover, setHover] = useState(null);
            const [showHeatmapHelp, setShowHeatmapHelp] = useState(false);
            const timelineRef = useRef(null);
            const mapRef = useRef(null);
            const [viewportWidth, setViewportWidth] = useState(() => (typeof window !== 'undefined' ? window.innerWidth : 1024));

            useEffect(() => {
                const onResize = () => setViewportWidth(window.innerWidth);
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);

            const groups = useMemo(() => {
                const map = new Map();
                photos.forEach((photo) => {
                    if (isScreenshotCategory(photo.aiData?.category)) return;
                    const eventName = photo.aiData?.event_name;
                    const key = level === 'trips'
                        ? (photo.aiData?.tripId || photo.aiData?.clusterId || (eventName ? `event:${eventName}` : null))
                        : (photo.aiData?.clusterId || (eventName ? `event:${eventName}` : null));
                    if (!key) return;
                    let group = map.get(key);
                    if (!group) {
                        group = {
                            key,
                            photos: [],
                            first: photo.date,
                            last: photo.date,
                            names: new Map(),
                            locations: new Map(),
                            kinds: new Map(),
                            dayCounts: new Map(),
                            dayPhotos: new Map(),
                            tripStart: photo.aiData?.tripStart || null,
                            tripEnd: photo.aiData?.tripEnd || null,
                            eventKind: photo.aiData?.eventKind || 'misc'
                        };
                        map.set(key, group);
                    }
                    group.photos.push(photo);
                    if (photo.date < group.first) group.first = photo.date;
                    if (photo.date > group.last) group.last = photo.date;
                    if (photo.aiData?.tripStart && (!group.tripStart || photo.aiData.tripStart < group.tripStart)) group.tripStart = photo.aiData.tripStart;
                    if (photo.aiData?.tripEnd && (!group.tripEnd || photo.aiData.tripEnd > group.tripEnd)) group.tripEnd = photo.aiData.tripEnd;
                    if (photo.aiData?.eventKind) group.eventKind = photo.aiData.eventKind;
                    const photoName = photo.aiData?.event_name || '';
                    if (photoName) group.names.set(photoName, (group.names.get(photoName) || 0) + 1);
                    const photoLocation = photo.hardData?.location;
                    if (photoLocation && photoLocation !== 'Neznámé místo') group.locations.set(photoLocation, (group.locations.get(photoLocation) || 0) + 1);
                    const kind = getPhotoKind(photo);
                    group.kinds.set(kind, (group.kinds.get(kind) || 0) + 1);
                    const day = dateKey(photo.date);
                    if (day) {
                        group.dayCounts.set(day, (group.dayCounts.get(day) || 0) + 1);
                        if (!group.dayPhotos.has(day)) group.dayPhotos.set(day, []);
                        group.dayPhotos.get(day).push(photo);
                    }
                });

                return [...map.values()]
                    .map((group) => {
                        const nameEntry = [...group.names.entries()].sort((a, b) => b[1] - a[1])[0];
                        const locationEntry = [...group.locations.entries()].sort((a, b) => b[1] - a[1])[0];
                        const kindEntry = [...group.kinds.entries()].sort((a, b) => b[1] - a[1])[0];
                        return {
                            ...group,
                            name: nameEntry ? nameEntry[0] : t('Bez názvu', 'Unnamed'),
                            location: locationEntry ? locationEntry[0] : '',
                            kind: kindEntry ? kindEntry[0] : 'misc',
                            color: colorForKey(group.key)
                        };
                    })
                    .sort((a, b) => a.first - b.first);
            }, [photos, level, t]);

            const reviewStats = useMemo(() => ({
                total: photos.length,
                clustered: photos.filter((photo) => photo.aiData?.clusterId || photo.aiData?.tripId || photo.aiData?.event_name).length,
                clutter: photos.filter((photo) => isScreenshotCategory(photo.aiData?.category)).length
            }), [photos]);

            const folderOptions = useMemo(() => {
                const names = new Set();
                photos.forEach((photo) => {
                    if (isScreenshotCategory(photo.aiData?.category)) return;
                    const eventName = cleanEventName(photo.aiData?.event_name || '');
                    if (!eventName) return;
                    const parts = eventName.split('/').filter(Boolean);
                    for (let i = 1; i <= parts.length; i += 1) {
                        names.add(parts.slice(0, i).join('/'));
                    }
                });
                return [...names].sort(naturalCompare);
            }, [photos]);

            // Flatten the folder tree depth-first so the picker shows real hierarchy.
            const folderTreeOptions = useMemo(() => {
                const root = { children: new Map() };
                folderOptions.forEach((path) => {
                    let node = root;
                    let fullPath = '';
                    path.split('/').filter(Boolean).forEach((part) => {
                        fullPath = fullPath ? `${fullPath}/${part}` : part;
                        if (!node.children.has(part)) {
                            node.children.set(part, { name: part, fullPath, depth: fullPath.split('/').length - 1, children: new Map() });
                        }
                        node = node.children.get(part);
                    });
                });
                const flat = [];
                const walk = (node) => {
                    [...node.children.values()]
                        .sort((a, b) => naturalCompare(a.name, b.name))
                        .forEach((child) => {
                            flat.push(child);
                            walk(child);
                        });
                };
                walk(root);
                return flat;
            }, [folderOptions]);

            useEffect(() => {
                if (targetFolder && !folderOptions.includes(targetFolder)) setTargetFolder('');
            }, [folderOptions, targetFolder]);

            const bounds = useMemo(() => {
                if (groups.length === 0) return null;
                let minDate = Infinity;
                let maxDate = -Infinity;
                groups.forEach((group) => {
                    const first = new Date(group.first).setHours(0, 0, 0, 0);
                    const last = new Date(group.last).setHours(0, 0, 0, 0);
                    if (Number.isFinite(first)) minDate = Math.min(minDate, first);
                    if (Number.isFinite(last)) maxDate = Math.max(maxDate, last);
                });
                if (!Number.isFinite(minDate) || !Number.isFinite(maxDate)) return null;
                const dayMs = 86400000;
                return { minDate, maxDate, spanDays: Math.max(1, Math.round((maxDate - minDate) / dayMs) + 1) };
            }, [groups]);

            const geoPoints = useMemo(() => groups.flatMap((group) => group.photos
                .filter((photo) => photo.hardData?.coords && Number.isFinite(photo.hardData.coords.lat) && Number.isFinite(photo.hardData.coords.lon))
                .map((photo) => ({
                    lat: photo.hardData.coords.lat,
                    lon: photo.hardData.coords.lon,
                    groupKey: group.key,
                    color: group.color
                }))), [groups]);

            const geoBounds = useMemo(() => {
                if (geoPoints.length === 0) return null;
                let minLat = Infinity;
                let maxLat = -Infinity;
                let minLon = Infinity;
                let maxLon = -Infinity;
                geoPoints.forEach((point) => {
                    minLat = Math.min(minLat, point.lat);
                    maxLat = Math.max(maxLat, point.lat);
                    minLon = Math.min(minLon, point.lon);
                    maxLon = Math.max(maxLon, point.lon);
                });
                if (!Number.isFinite(minLat) || !Number.isFinite(minLon)) return null;
                return { minLat, maxLat, minLon, maxLon };
            }, [geoPoints]);

            // Chrome caps canvas dimensions; keep the timeline under that limit for large libraries.
            const canvasDpr = window.devicePixelRatio || 1;
            const maxCssCanvasHeight = Math.floor(30000 / canvasDpr);
            const maxCanvasRows = Math.max(1, maxCssCanvasHeight - 32);
            const timelineGroups = groups.length > maxCanvasRows ? groups.slice(0, maxCanvasRows) : groups;
            const timelineRowHeight = timelineGroups.length > Math.max(1, Math.floor((maxCssCanvasHeight - 32) / 22))
                ? Math.max(1, Math.floor((maxCssCanvasHeight - 32) / timelineGroups.length))
                : 22;
            const timelineHeight = 8 + timelineGroups.length * timelineRowHeight + 24;
            const sidebarGroups = groups.slice(0, 500);
            const timelineLabelWidth = isMobile ? 112 : 190;
            const timelineCanvasWidth = isMobile ? Math.max(320, viewportWidth - 28) : 980;
            const mapCanvasWidth = isMobile ? Math.max(300, viewportWidth - 28) : 860;
            const mapCanvasHeight = isMobile ? 300 : 440;

            const clusterRangeOffsets = useMemo(() => {
                if (!bounds || !clusterRange?.start || !clusterRange?.end) return null;
                const loKey = clusterRange.start <= clusterRange.end ? clusterRange.start : clusterRange.end;
                const hiKey = clusterRange.start <= clusterRange.end ? clusterRange.end : clusterRange.start;
                const start = Math.round((new Date(`${loKey}T00:00:00`).getTime() - bounds.minDate) / 86400000);
                const end = Math.round((new Date(`${hiKey}T00:00:00`).getTime() - bounds.minDate) / 86400000);
                return {
                    start: Math.max(0, start),
                    end: Math.min(bounds.spanDays - 1, end)
                };
            }, [bounds, clusterRange]);

            const clusterRangeStartOffset = useMemo(() => {
                if (!bounds || !clusterRange?.start) return null;
                return Math.round((new Date(`${clusterRange.start}T00:00:00`).getTime() - bounds.minDate) / 86400000);
            }, [bounds, clusterRange]);

            const rangePhotoIds = useMemo(() => {
                const ids = new Set();
                if (!clusterRange?.start || !clusterRange?.end) return ids;
                const lo = clusterRange.start <= clusterRange.end ? clusterRange.start : clusterRange.end;
                const hi = clusterRange.start <= clusterRange.end ? clusterRange.end : clusterRange.start;
                photos.forEach((photo) => {
                    if (isScreenshotCategory(photo.aiData?.category)) return;
                    const day = dateKey(photo.date);
                    if (day && day >= lo && day <= hi) ids.add(photo.id);
                });
                return ids;
            }, [photos, clusterRange]);

            const selectedPhotoIds = useMemo(() => {
                const ids = new Set();
                groups.forEach((group) => {
                    if (selectedKeys.has(group.key)) {
                        group.photos.forEach((photo) => ids.add(photo.id));
                    }
                    group.dayPhotos.forEach((dayPhotos, day) => {
                        if (tileSelection.has(`${group.key}|${day}`)) {
                            dayPhotos.forEach((photo) => ids.add(photo.id));
                        }
                    });
                });
                rangePhotoIds.forEach((id) => ids.add(id));
                return ids;
            }, [groups, selectedKeys, tileSelection, rangePhotoIds]);
            const selectedPhotoSignature = useMemo(() => [...selectedPhotoIds].sort().join('|'), [selectedPhotoIds]);
            useEffect(() => {
                if (onHighlight) onHighlight(new Set(selectedPhotoIds));
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [selectedPhotoSignature]);
            useEffect(() => () => {
                if (onHighlight) onHighlight(new Set());
            }, []);

            useEffect(() => {
                const selected = groups.filter((group) => selectedKeys.has(group.key));
                if (selected.length === 1) {
                    if (!nameDirty) setName(selected[0].name);
                    if (!locationDirty) setLocation(selected[0].location || '');
                } else {
                    if (!nameDirty) setName('');
                    if (!locationDirty) setLocation('');
                }
            }, [selectedKeys, groups, nameDirty, locationDirty]);

            useEffect(() => {
                if (tab !== 'timeline' || !timelineRef.current || !bounds || groups.length === 0) return;
                if (!Number.isFinite(bounds.minDate) || !Number.isFinite(bounds.spanDays)) return;
                const canvas = timelineRef.current;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                try {
                const left = timelineLabelWidth;
                const right = 12;
                const top = 8;
                const rowHeight = timelineRowHeight;
                const width = timelineCanvasWidth;
                const height = timelineHeight;
                const dpr = window.devicePixelRatio || 1;

                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, width, height);

                const dayWidth = Math.max(2, (width - left - right) / bounds.spanDays);
                const days = [...new Set(timelineGroups.flatMap((group) => [...group.dayCounts.keys()]))].sort();
                ctx.font = '9px sans-serif';
                ctx.fillStyle = '#64748b';
                days.forEach((day, index) => {
                    if (index % Math.max(1, Math.floor(days.length / 10)) !== 0) return;
                    const x = left + Math.round((new Date(`${day}T00:00:00`).getTime() - bounds.minDate) / 86400000) * dayWidth;
                    ctx.save();
                    ctx.translate(x + 2, height - 6);
                    ctx.rotate(-Math.PI / 4);
                    ctx.fillText(day.slice(5), 0, 0);
                    ctx.restore();
                });

                timelineGroups.forEach((group, row) => {
                    const y = top + row * rowHeight;
                    const selected = selectedKeys.has(group.key);
                    ctx.fillStyle = selected ? 'rgba(249, 115, 22, 0.18)' : (row % 2 === 0 ? 'rgba(30, 41, 59, 0.55)' : 'rgba(15, 23, 42, 0.35)');
                    ctx.fillRect(0, y, width, rowHeight);
                    if (rowHeight >= 12) {
                        ctx.fillStyle = group.color;
                        ctx.font = '10px sans-serif';
                        const label = `${group.name} (${group.photos.length})`;
                        const maxLabelChars = isMobile ? 14 : 28;
                        ctx.fillText(label.length > maxLabelChars ? `${label.slice(0, maxLabelChars - 1)}…` : label, 6, y + 14);
                    }
                    group.dayCounts.forEach((count, day) => {
                        const offset = Math.round((new Date(`${day}T00:00:00`).getTime() - bounds.minDate) / 86400000);
                        const x = left + offset * dayWidth;
                        const ratio = Math.min(1, count / 20);
                        ctx.globalAlpha = 0.25 + ratio * 0.75;
                        ctx.fillStyle = group.color;
                        ctx.fillRect(x, y + 1, Math.max(1, dayWidth - 0.5), Math.max(1, rowHeight - 2));
                        ctx.globalAlpha = 1;
                        if (tileSelection.has(`${group.key}|${day}`)) {
                            ctx.strokeStyle = '#f8fafc';
                            ctx.lineWidth = 1.5;
                            ctx.strokeRect(x + 0.5, y + 1, Math.max(1, dayWidth - 1), Math.max(1, rowHeight - 2));
                        }
                    });
                });

                if (clusterRangeOffsets) {
                    const x = left + clusterRangeOffsets.start * dayWidth;
                    const w = (clusterRangeOffsets.end - clusterRangeOffsets.start + 1) * dayWidth;
                    ctx.fillStyle = 'rgba(34, 211, 238, 0.12)';
                    ctx.fillRect(x, top, w, height - top - 24);
                    ctx.strokeStyle = 'rgba(34, 211, 238, 0.85)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(x, top, w, height - top - 24);
                } else if (clusterRangeStartOffset !== null && clusterRangeStartOffset >= 0) {
                    const x = left + clusterRangeStartOffset * dayWidth + dayWidth / 2;
                    ctx.save();
                    ctx.strokeStyle = '#67e8f9';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(x, top);
                    ctx.lineTo(x, height - top - 24);
                    ctx.stroke();
                    ctx.restore();
                }

                if (dragState) {
                    const start = Math.max(0, Math.min(dragState.start, dragState.end));
                    const end = Math.min(bounds.spanDays - 1, Math.max(dragState.start, dragState.end));
                    ctx.strokeStyle = '#67e8f9';
                    ctx.lineWidth = 2;
                    if (dragState.global) {
                        ctx.strokeRect(left + start * dayWidth, top, (end - start + 1) * dayWidth, height - top - 24);
                    } else {
                        ctx.strokeRect(left + start * dayWidth, top + dragState.row * rowHeight, (end - start + 1) * dayWidth, rowHeight);
                    }
                }
                } catch (error) {
                    console.error('Timeline heatmap draw failed', error);
                }
            }, [tab, groups, bounds, selectedKeys, tileSelection, dragState, clusterRangeOffsets, clusterRangeStartOffset, timelineRowHeight, timelineHeight, timelineCanvasWidth, timelineLabelWidth, isMobile]);

            useEffect(() => {
                if (tab !== 'map' || !mapRef.current) return;
                const canvas = mapRef.current;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                try {
                const width = mapCanvasWidth;
                const height = mapCanvasHeight;
                const padding = 34;
                const dpr = window.devicePixelRatio || 1;

                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, width, height);
                if (!geoBounds) return;

                const lonSpan = Math.max(0.0001, geoBounds.maxLon - geoBounds.minLon);
                const latSpan = Math.max(0.0001, geoBounds.maxLat - geoBounds.minLat);
                const midLat = (geoBounds.minLat + geoBounds.maxLat) / 2;
                const lonScale = Math.cos((midLat * Math.PI) / 180);
                const spanX = lonSpan * lonScale;
                const spanY = latSpan;
                const scale = Math.min((width - 2 * padding) / spanX, (height - 2 * padding) / spanY);
                const offsetX = (width - spanX * scale) / 2;
                const offsetY = (height - spanY * scale) / 2;
                const project = (lat, lon) => [
                    offsetX + (lon - geoBounds.minLon) * lonScale * scale,
                    height - offsetY - (lat - geoBounds.minLat) * scale
                ];

                ctx.strokeStyle = 'rgba(71, 85, 105, 0.35)';
                for (let i = 0; i <= 8; i += 1) {
                    const x = padding + ((width - 2 * padding) * i) / 8;
                    const y = padding + ((height - 2 * padding) * i) / 8;
                    ctx.beginPath(); ctx.moveTo(x, padding); ctx.lineTo(x, height - padding); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(width - padding, y); ctx.stroke();
                }

                geoPoints.forEach((point) => {
                    const [x, y] = project(point.lat, point.lon);
                    ctx.fillStyle = point.color;
                    ctx.globalAlpha = selectedKeys.has(point.groupKey) ? 0.95 : 0.45;
                    ctx.beginPath();
                    ctx.arc(x, y, selectedKeys.has(point.groupKey) ? 3.5 : 2, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px sans-serif';
                ctx.fillText(`${geoPoints.length} ${t('fotek s polohou', 'photos with location')}`, width - 150, 18);
                } catch (error) {
                    console.error('Map heatmap draw failed', error);
                }
            }, [tab, geoPoints, geoBounds, selectedKeys, t, mapCanvasWidth, mapCanvasHeight]);

            const toggleGroup = (key) => {
                setTileSelection(new Set());
                setSelectedKeys((previous) => {
                    const next = new Set(previous);
                    if (next.has(key)) next.delete(key);
                    else next.add(key);
                    return next;
                });
            };

            const timelineDayWidth = Math.max(2, (timelineCanvasWidth - timelineLabelWidth - 12) / Math.max(1, bounds?.spanDays || 1));
            const timelineOffsetAt = (event) => {
                const rect = timelineRef.current.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top - 8;
                const row = Math.floor(y / timelineRowHeight);
                const offset = Math.floor((x - timelineLabelWidth) / timelineDayWidth);
                return { row, offset, x };
            };
            const dayKeyAtOffset = (offset) => {
                if (!bounds) return '';
                const date = new Date(bounds.minDate);
                date.setDate(date.getDate() + offset);
                return dateKey(date);
            };

            const handleTimelineMouseDown = (event) => {
                if (!timelineRef.current || !bounds || timelineGroups.length === 0) return;
                const { row, offset, x } = timelineOffsetAt(event);
                if (x < timelineLabelWidth) {
                    if (row >= 0 && row < timelineGroups.length) toggleGroup(timelineGroups[row].key);
                    return;
                }
                if (offset < 0 || offset >= bounds.spanDays) return;
                if (drawMode) {
                    setSelectedKeys(new Set());
                    setTileSelection(new Set());
                    setDragState({ global: true, row: Math.max(0, row), start: offset, end: offset, moved: false });
                    event.preventDefault();
                    return;
                }
                if (row < 0 || row >= timelineGroups.length) return;
                setSelectedKeys(new Set());
                setDragState({ row, start: offset, end: offset });
                event.preventDefault();
            };

            const handleTimelineMouseMove = (event) => {
                if (!dragState || !bounds) return;
                const { offset } = timelineOffsetAt(event);
                const clamped = Math.max(0, Math.min(bounds.spanDays - 1, offset));
                const moved = dragState.moved || clamped !== dragState.start;
                if (clamped !== dragState.end || moved !== dragState.moved) {
                    setDragState({ ...dragState, end: clamped, moved });
                }
            };

            const handleTimelineMouseUp = () => {
                if (!dragState || !bounds) return;
                const start = Math.max(0, Math.min(dragState.start, dragState.end));
                const end = Math.min(bounds.spanDays - 1, Math.max(dragState.start, dragState.end));

                if (dragState.global) {
                    const clickedKey = dayKeyAtOffset(start);
                    if (dragState.moved) {
                        const startKey = dayKeyAtOffset(start);
                        const endKey = dayKeyAtOffset(end);
                        if (startKey && endKey) setClusterRange({ start: startKey, end: endKey });
                    } else if (clickedKey) {
                        setClusterRange((previous) => {
                            if (previous?.start && !previous?.end) {
                                return previous.start <= clickedKey
                                    ? { start: previous.start, end: clickedKey }
                                    : { start: clickedKey, end: previous.start };
                            }
                            return { start: clickedKey, end: '' };
                        });
                    }
                    setSelectedKeys(new Set());
                    setTileSelection(new Set());
                    setDragState(null);
                    return;
                }

                const group = timelineGroups[dragState.row];
                if (group) {
                    setTileSelection((previous) => {
                        const next = new Set(previous);
                        for (let offset = start; offset <= end; offset += 1) {
                            const dayDate = new Date(bounds.minDate);
                            dayDate.setDate(dayDate.getDate() + offset);
                            const day = dateKey(dayDate);
                            if (!day) continue;
                            const key = `${group.key}|${day}`;
                            if (start === end && next.has(key)) next.delete(key);
                            else next.add(key);
                        }
                        return next;
                    });
                }
                setDragState(null);
            };


            const handleMapClick = (event) => {
                if (!mapRef.current || geoPoints.length === 0 || !geoBounds) return;
                const rect = mapRef.current.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                const width = mapCanvasWidth;
                const height = mapCanvasHeight;
                const padding = 34;
                const lonSpan = Math.max(0.0001, geoBounds.maxLon - geoBounds.minLon);
                const latSpan = Math.max(0.0001, geoBounds.maxLat - geoBounds.minLat);
                const midLat = (geoBounds.minLat + geoBounds.maxLat) / 2;
                const lonScale = Math.cos((midLat * Math.PI) / 180);
                const spanX = lonSpan * lonScale;
                const spanY = latSpan;
                const scale = Math.min((width - 2 * padding) / spanX, (height - 2 * padding) / spanY);
                const offsetX = (width - spanX * scale) / 2;
                const offsetY = (height - spanY * scale) / 2;
                let best = null;
                geoPoints.forEach((point) => {
                    const px = offsetX + (point.lon - geoBounds.minLon) * lonScale * scale;
                    const py = height - offsetY - (point.lat - geoBounds.minLat) * scale;
                    const distance = Math.hypot(px - x, py - y);
                    if (distance < 10 && (!best || distance < best.distance)) best = { point, distance };
                });
                if (best) toggleGroup(best.point.groupKey);
            };

            const selectedGroups = groups.filter((group) => selectedKeys.has(group.key));
            const apply = () => {
                if (selectedKeys.size === 0) return;
                if (name.trim()) onApplyName([...selectedKeys], name.trim(), level);
                if (location.trim()) onApplyLocation([...selectedKeys], location.trim(), level);
            };

            const addToExistingFolder = () => {
                if (!targetFolder || selectedPhotoIds.size === 0) return;
                onAddToFolder([...selectedPhotoIds], targetFolder);
                setSelectedKeys(new Set());
                setTileSelection(new Set());
                setClusterRange(null);
            };

                        return;
                    }
                    const selectors = step.target.split(',').map((selector) => selector.trim());
                    let element = null;
                    for (const selector of selectors) {
                        element = document.querySelector(selector);
                        if (element) break;
                    }
                    if (!element) {
                        setRect(null);
                        return;
                    }
                    element.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
                    setRect(element.getBoundingClientRect());
                    settleTimer = window.setTimeout(() => {
                        setRect(element?.getBoundingClientRect() ?? null);
                    }, 320);
                };
                measure();
                const onScroll = () => {
                    window.clearTimeout(timer);
                    timer = window.setTimeout(measure, 80);
                };
                window.addEventListener('resize', measure);
                window.addEventListener('scroll', onScroll, true);
                return () => {
                    window.clearTimeout(timer);
                    window.clearTimeout(settleTimer);
                    window.removeEventListener('resize', measure);
                    window.removeEventListener('scroll', onScroll, true);
                };
            }, [index, step]);

            const targetHigh = !rect || rect.top + rect.height / 2 < window.innerHeight * 0.62;
            const cardTop = Boolean(rect) && !targetHigh;
            const isLast = index >= steps.length - 1;

            return (
                <div className="fixed inset-0 z-[200]" data-app-tour="true">
                    <div className="absolute inset-0" aria-hidden="true" />
                    {rect && (
                        <div
                            className="pointer-events-none fixed z-[201] rounded-2xl border-2 border-white/90 transition-all duration-300"
                            style={{
                                top: rect.top - 6,
                                left: rect.left - 6,
                                width: rect.width + 12,
                                height: rect.height + 12,
                                boxShadow: '0 0 0 9999px rgba(0, 0, 0, 0.62)'
                            }}
                        />
                    )}
                    <div className={`fixed inset-x-0 z-[202] px-4 ${cardTop ? 'top-8' : 'bottom-8'}`}>
                        <div className="mx-auto w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900/95 p-5 shadow-2xl backdrop-blur-xl text-slate-200">
                            <div className="flex items-start justify-between gap-3">
                                <div className="flex items-center gap-2">
                                    <span className="flex h-9 w-9 items-center justify-center rounded-full bg-cyan-950 text-cyan-300 text-lg">
                                        {targetHigh ? '▲' : '▼'}
                                    </span>
                                    <span className="text-[10px] font-semibold uppercase tracking-widest text-slate-500">
                                        {index + 1} / {steps.length}
                                    </span>
                                </div>
                                <button onClick={onClose} className="inline-flex items-center gap-1 rounded-full px-3 py-1.5 text-[11px] font-semibold text-slate-400 hover:bg-slate-800" data-tour-skip>
                                    × {step?.skipLabel || 'Skip'}
                                </button>
                            </div>
                            <h3 className="mt-3 text-xl font-bold text-orange-300">{step?.title}</h3>
                            <p className="mt-2 text-sm leading-relaxed text-slate-300">{step?.body}</p>
                            <div className="mt-4 flex items-center justify-between gap-2">
                                <button
                                    onClick={() => setIndex((current) => Math.max(0, current - 1))}
                                    disabled={index === 0}
                                    className="inline-flex items-center gap-1 rounded-full border border-slate-700 px-4 py-2.5 text-xs font-semibold text-slate-300 hover:bg-slate-800 disabled:opacity-30"
                                >{'◀'} {step?.backLabel || 'Back'}</button>
                                <div className="flex items-center gap-1.5">
                                    {steps.map((_, dot) => (
                                        <span key={dot} className={`h-1.5 rounded-full transition-all ${dot === index ? 'w-4 bg-cyan-400' : 'w-1.5 bg-slate-700'}`} />
                                    ))}
                                </div>
                                <button
                                    onClick={() => { if (isLast) onClose(); else setIndex((current) => Math.min(steps.length - 1, current + 1)); }}
                                    className="inline-flex items-center gap-1 rounded-full bg-cyan-600 px-4 py-2.5 text-xs font-semibold text-white hover:bg-cyan-500"
                                    data-tour-next
                                >{isLast ? (step?.doneLabel || 'Done') : (step?.nextLabel || 'Next')} {'▶'}</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((error) => {
                    console.warn('Service worker registration failed', error);
                });
            });
        }
    </script>
</body>
</html>
