            return groups.sort((a, b) => a[0].date - b[0].date);
        };

        // Away photos become trips; home photos become home sessions. Unknown-location
        // photos are attached by time or grouped separately.
        const clusterPhotosIntoTrips = (photos, homeLocation, settings = DEFAULT_TRIP_SETTINGS) => {
            const homeRef = inferHomeReference(photos, homeLocation);
            const densityEpisodes = segmentDenseEpisodes(photos, settings);
            const homeSessionPhotos = [];
            const nonHomeEpisodes = [];

            densityEpisodes.forEach((episodePhotos) => {
                const home = [];
                const away = [];
                const unknown = [];

                episodePhotos.forEach((photo) => {
                    const hasCoords = Boolean(photo.hardData?.coords);
                    const hasNamedLocation = Boolean(photo.hardData?.locationKey && photo.hardData.location && photo.hardData.location !== 'Neznámé místo');
                    if (!hasCoords && !hasNamedLocation) {
                        unknown.push(photo);
                        return;
                    }
                    if (homeRef && isHomePhoto(photo, homeRef, settings.homeRadiusKm)) home.push(photo);
                    else away.push(photo);
                });

                if (away.length > home.length) {
                    // Away evidence wins: keep every unknown photo in this density episode inside the trip.
                    nonHomeEpisodes.push([...away, ...unknown].sort((a, b) => a.date - b.date));
                    homeSessionPhotos.push(...home);
                } else if (home.length > 0) {
                    homeSessionPhotos.push(...home, ...unknown);
                    // A few away photos inside a home-heavy episode still belong to a trip,
                    // never dropped. They can be merged by the parent-trip gap below.
                    if (away.length > 0) nonHomeEpisodes.push([...away].sort((a, b) => a.date - b.date));
                } else {
                    nonHomeEpisodes.push([...unknown].sort((a, b) => a.date - b.date));
                }
            });

            // Merge nearby density episodes into one parent trip. Long events are allowed to
            // contain multiple internal clusters/stops, but they should share one parent folder.
            nonHomeEpisodes.sort((a, b) => a[0].date - b[0].date);
            const parentTrips = [];
            let currentParent = [];

            nonHomeEpisodes.forEach((episodePhotos) => {
                if (currentParent.length === 0) {
                    currentParent = [...episodePhotos];
                    return;
                }

                const last = currentParent[currentParent.length - 1];
                const first = episodePhotos[0];
                const end = episodePhotos[episodePhotos.length - 1];
                const gapHours = (first.date.getTime() - last.date.getTime()) / 3600000;
                const durationDays = (end.date.getTime() - currentParent[0].date.getTime()) / 86400000;

                if (gapHours <= settings.parentTripGapHours && durationDays <= settings.maxTripDays) {
                    currentParent = currentParent.concat(episodePhotos);
                } else {
                    parentTrips.push(currentParent);
                    currentParent = [...episodePhotos];
                }
            });
            if (currentParent.length > 0) parentTrips.push(currentParent);

            const trips = [];
            const extras = [];

            parentTrips.forEach((parentPhotos) => {
                const sorted = [...parentPhotos].sort((a, b) => a.date - b.date);
                const hasLocation = sorted.some((photo) => {
                    const hasCoords = Boolean(photo.hardData?.coords);
                    const hasNamedLocation = Boolean(photo.hardData?.locationKey && photo.hardData.location && photo.hardData.location !== 'Neznámé místo');
                    return hasCoords || hasNamedLocation;
                });
                const spanHours = (sorted[sorted.length - 1].date.getTime() - sorted[0].date.getTime()) / 3600000;
                const smallOuting = sorted.length < (settings.randomMinPhotos || 3) && spanHours <= 24;

                if (!smallOuting && (hasLocation || spanHours > 24 || sorted.length >= settings.tripMinPhotos)) {
                    trips.push(sorted);
                } else {
                    extras.push(sorted);
                }
            });

            const homeSessions = [];
            groupPhotosByTimeGaps(homeSessionPhotos, settings.homeSessionGapHours * 3600000).forEach((group) => {
                splitLongEpisode(group, settings.maxHomeSessionHours, 3600000).forEach((part) => homeSessions.push(part));
            });

            const sortByStart = (items) => items.sort((a, b) => a[0].date - b[0].date);
            return {
                homeRef,
                trips: sortByStart(trips),
                homeSessions: sortByStart(homeSessions),
                extras: sortByStart(extras)
            };
        };

        const computeAutoTripSettings = (photos, homeLocation) => {
            const homeRef = inferHomeReference(photos, homeLocation);
            let homeRadiusKm = DEFAULT_TRIP_SETTINGS.homeRadiusKm;

            if (homeRef?.coords) {
                const distances = photos
                    .filter((photo) => photo.hardData?.locationSource === 'home'
                        || (homeRef.name && normalizeLocationName(photo.hardData?.location) === normalizeLocationName(homeRef.name)))
                    .map((photo) => (photo.hardData?.coords ? distanceKm(homeRef.coords, photo.hardData.coords) : null))
                    .filter((distance) => distance !== null);

                const p90 = percentileValue(distances, 0.9);
                if (p90 !== null) homeRadiusKm = clampNumber(p90 * 1.5, 5, 30);
            }

            return buildTripSettings({ homeRadiusKm });

        const buildPlaceholderStopName = (index, location) => {

        // Produces the flat list of event groups used by Phase 2:
        // one group per home session, one group per stop inside each trip.
        const buildHierarchicalEvents = (photos, homeLocation, settings = DEFAULT_TRIP_SETTINGS, stopSettingsOverride = null) => {
            const episodes = clusterPhotosIntoTrips(photos, homeLocation, settings);
            const groups = [];
            let stopCount = 0;

            episodes.trips.forEach((tripPhotos, tripIndex) => {
                const tripName = `Trip ${tripIndex + 1}`;
                const tripId = `evt-trip-${tripPhotos[0].date.getTime()}-${tripIndex}`;
                const tripStart = tripPhotos[0].date.getTime();
                const tripEnd = tripPhotos[tripPhotos.length - 1].date.getTime();
                const stopSettings = stopSettingsOverride || computeAutoClusterSettings(tripPhotos);
                const locatedCount = tripPhotos.filter((photo) => {
                    const hasCoords = Boolean(photo.hardData?.coords);
                    const hasNamedLocation = Boolean(photo.hardData?.locationKey && photo.hardData.location && photo.hardData.location !== 'Neznámé místo');
                    return hasCoords || hasNamedLocation;
                }).length;
                const minLocatedForStops = Math.max(2, stopSettings?.minPoints || 3);
                const coordsCount = tripPhotos.filter((photo) => {
                    const coords = photo.hardData?.coords;
                    return coords && Number.isFinite(coords.lat) && Number.isFinite(coords.lon);
                }).length;
                const locationKeys = new Set(tripPhotos
                    .map((photo) => photo.hardData?.locationKey)
                    .filter((key) => key));
                // A manual location alone (no coordinates) means one place, not per-day stops.
                const singleNamedLocation = coordsCount === 0 && locationKeys.size <= 1;

                // Without enough located photos, one flat trip folder is the honest result.
                if (locatedCount < minLocatedForStops || singleNamedLocation) {
                    groups.push({
                        photos: tripPhotos,
                        eventName: tripName,
                        clusterId: tripId,
                        clusterNumber: 0,
                        eventKind: 'trip',
                        tripId,
                        tripNumber: tripIndex + 1,
                        stopNumber: 0,
                        tripStart,
                        tripEnd,
                        tripName

                const stops = clusterPhotosByDensity(tripPhotos, stopSettings);

                stops.forEach((stopPhotos, stopIndex) => {

                    const location = dominant?.location || stopPhotos[0]?.hardData?.location || 'Neznámé místo';
                    const stopName = buildPlaceholderStopName(stopIndex, location);
                    stopCount += 1;
                    groups.push({
                        photos: stopPhotos,
                        eventName: `${tripName}/${stopName}`,
                        clusterId: `${tripId}-stop-${stopIndex + 1}`,
                        clusterNumber: stopIndex + 1,
                        eventKind: 'trip-stop',
                        tripId,
                        tripNumber: tripIndex + 1,
                        stopNumber: stopIndex + 1,
                        tripStart,
                        tripEnd,
                        tripName
                    });
                });
            });

            episodes.homeSessions.forEach((sessionPhotos, index) => {
                const id = `evt-home-${sessionPhotos[0].date.getTime()}-${index}`;
                groups.push({
                    photos: sessionPhotos,
                    eventName: `Home ${index + 1}`,
                    clusterId: id,
                    clusterNumber: index + 1,
                    eventKind: 'home',
                    tripId: id,
                    tripNumber: 0,
                    stopNumber: 0
                });
            });

            if (episodes.extras.length > 0) {
                const randomPhotos = episodes.extras.flat().sort((a, b) => a.date - b.date);
                groups.push({
                    photos: randomPhotos,
                    eventName: RANDOM_FOLDER,
                    clusterId: 'random',
                    clusterNumber: 0,
                    eventKind: 'random',
                    tripId: 'random',
                    tripNumber: 0,
                    stopNumber: 0
                });
            }

            groups.sort((a, b) => a.photos[0].date - b.photos[0].date);
            return {
                groups,
                tripCount: episodes.trips.length,
                homeSessionCount: episodes.homeSessions.length,

        const PREVIEW_MAX_EDGE = 640;

        const loadPreviewImage = (url) => new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error('preview decode failed'));
            image.src = url;
        });

        const shrinkToObjectUrl = async (source, width, height) => {
            if (!width || !height) return null;
            const scale = Math.min(1, PREVIEW_MAX_EDGE / Math.max(width, height));
            const targetWidth = Math.max(1, Math.round(width * scale));
            const targetHeight = Math.max(1, Math.round(height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(source, 0, 0, targetWidth, targetHeight);
            const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
            return blob ? URL.createObjectURL(blob) : null;
        };

        // Typed blobs are required by Safari; exifr returns raw bytes, so we detect the type.
        const previewFromBlob = async (blob) => {
            const url = URL.createObjectURL(blob);
            try {
                const image = await loadPreviewImage(url);
                return await shrinkToObjectUrl(image, image.naturalWidth, image.naturalHeight);
            } catch (e) {
                return null;
            } finally {
                URL.revokeObjectURL(url);
            }
        };

        const previewFromHeic = async (file) => {
            if (typeof heic2any !== 'function') return null;
            try {
                const converted = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.8 });
                const blob = Array.isArray(converted) ? converted[0] : converted;
                return blob ? previewFromBlob(blob) : null;
            } catch (e) {
                return null;
            }
        };

        // exifr/UTIF run in a worker with a hard timeout, so a bad raw file can
        // never leave a tile spinning forever or block the UI.
        const previewFromWorker = (file) => new Promise((resolve) => {
            if (typeof Worker === 'undefined') {
                resolve(null);
                return;
            }
            let worker;
            try {
                worker = new Worker('preview-worker.js');
            } catch (e) {
                resolve(null);
                return;
            }
            let settled = false;
            let timer = null;
            const finish = (value) => {
                if (settled) return;
                settled = true;
                if (timer) clearTimeout(timer);
                try { worker.terminate(); } catch (e) {}
                resolve(value);
            };
            timer = setTimeout(() => finish(null), 8000);
            worker.onmessage = async (event) => {
                const data = event.data || {};
                if (data.type !== 'result' || settled) return;
                let url = null;
                for (const candidate of data.candidates || []) {
                    if (!candidate || !candidate.buffer) continue;
                    if (candidate.kind === 'bytes') {
                        url = await previewFromBlob(new Blob([candidate.buffer], { type: candidate.mime || 'image/jpeg' }));
                    } else if (candidate.kind === 'rgba' && candidate.width && candidate.height) {
                        const canvas = document.createElement('canvas');
                        canvas.width = candidate.width;
                        canvas.height = candidate.height;
                        canvas.getContext('2d').putImageData(
                            new ImageData(new Uint8ClampedArray(candidate.buffer), candidate.width, candidate.height), 0, 0
                        );
                        url = await shrinkToObjectUrl(canvas, candidate.width, candidate.height);
                    }
                    if (url) break;
                }
                finish(url);
            };
            worker.onerror = () => finish(null);
            worker.postMessage({ type: 'preview', id: 'preview', file });
        });

        const generatePreview = async (file) => {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'heic' || ext === 'heif') {
                const embedded = await previewFromWorker(file);
                return embedded || previewFromHeic(file);
            }
            if (['nef', 'cr2', 'dng', 'arw', 'raf', 'orf', 'tif', 'tiff'].includes(ext)) {
                return previewFromWorker(file);
            }
            return null;
        };

                    } catch(e) { console.error("Save error", e); }
                    setTimeout(() => setIsCloudSyncing(false), 800);

                return () => clearTimeout(timer);
            }, [geminiApiKey, cloudDb]);

            useEffect(() => {
                let cancelled = false;

                (async () => {
                    const stored = await readProject();
                    if (cancelled || !stored) return;

                    if (Array.isArray(stored.photos) && stored.photos.length > 0) {
                        setLocalMetadata(stored.photos);
                        setNeedsRelink(true);
                    }
                    if (Array.isArray(stored.timeline) && stored.timeline.length > 0) {
                        setTimelineData(stored.timeline);
                    }
                })();

                return () => { cancelled = true; };
            }, []);

            useEffect(() => {
                if (photos.length === 0) return;

                const timer = setTimeout(async () => {
                    setIsLocalSaving(true);
                    await writeProject({
                        version: 1,
                        updatedAt: Date.now(),
                        photos: serializePhotosForStorage(photos),
                        timeline: timelineData || []
                    });
                    setIsLocalSaving(false);

                return () => clearTimeout(timer);
            }, [photos, timelineData]);

            // Local dev convenience: if the dev server exposes Timeline.json, load it automatically.
            useEffect(() => {
                let cancelled = false;

                (async () => {
                    try {
                        if (localStorage.getItem('aiSorter.skipTimelineAutoLoad') === '1') {
                            localStorage.removeItem('aiSorter.skipTimelineAutoLoad');
                            return;
                        }
                    } catch (e) {}

                    try {
                        const response = await fetch('./Timeline.json', { cache: 'no-store' });
                        if (!response.ok) return;
                        const raw = await response.json();
                        const items = Array.isArray(raw) ? raw : (raw.timelineObjects || raw.semanticSegments || []);
                        const entries = normalizeTimelineData(items);
                        if (cancelled || entries.length === 0) return;
                        setTimelineData((previous) => (previous && previous.length > 0 ? previous : entries));
                    } catch (error) {
                        // 404/opaque responses are expected on deployments without the personal file.
                    }
                })();

                return () => { cancelled = true; };
            }, []);

            const processThumbnails = async (loadedFiles) => {
                const CONCURRENCY_LIMIT = 6; 
                const PREVIEW_TIMEOUT = 20000;
                const queue = [...loadedFiles];
                const withTimeout = (promise, ms) => new Promise((resolve, reject) => {
                    const timer = setTimeout(() => reject(new Error('preview timeout')), ms);
                    promise.then(
                        (value) => { clearTimeout(timer); resolve(value); },
                        (error) => { clearTimeout(timer); reject(error); }
                    );
                });
                
                const worker = async () => {
                    while (queue.length > 0) {
                        const p = queue.shift();
                        if (!p || !p.isRaw) continue;
                        
                        try {
                            const thumbUrl = await withTimeout(generatePreview(p.file), PREVIEW_TIMEOUT);
                            setPhotos(prev => prev.map(item => 
                                item.id === p.id ? { ...item, url: thumbUrl, thumbLoading: false } : item
                            ));
                        } catch (err) {
                            console.warn(`Náhled selhal pro ${p.name}`);
                            setPhotos(prev => prev.map(item => 
                                item.id === p.id ? { ...item, thumbLoading: false } : item
                            ));
                        }
                    }
                };

                const workers = Array(CONCURRENCY_LIMIT).fill(null).map(() => worker());
                await Promise.all(workers);
            };

            const handleFolder = (e) => {
                const allowedExts = ['jpg','jpeg','png','webp','heic','heif','nef','cr2','arw','dng','orf','raf', 'tif', 'tiff'];
                const files = Array.from(e.target.files).filter(f => {
                    const ext = f.name.split('.').pop().toLowerCase();
                    return f.type.startsWith('image/') || allowedExts.includes(ext);
                });
                const deduped = dedupeFilesBySignature(files);
                const uniqueFiles = deduped.files;
                
                const parsedMeta = [];
                if (Array.isArray(localMetadata)) parsedMeta.push(...localMetadata);
                if (cloudMetadata) {
                    const parsedCloud = safeJsonParse(cloudMetadata);
                    if (Array.isArray(parsedCloud)) parsedMeta.push(...parsedCloud);
                }

                const findMeta = (file) => parsedMeta.find((meta) =>
                    meta.name === file.name
                    && (!meta.size || meta.size === file.size)
                    && (!meta.lastModified || meta.lastModified === file.lastModified)
                ) || parsedMeta.find((meta) => meta.name === file.name);

                const loaded = uniqueFiles.map(f => {
                    const existing = findMeta(f);
                    const ext = f.name.split('.').pop().toLowerCase();
                    const isRaw = ['nef', 'cr2', 'arw', 'dng', 'raf', 'orf', 'heic', 'heif', 'tif', 'tiff'].includes(ext);
                    
                    return {
                        id: Math.random().toString(36).substr(2, 9),
                        file: f, 
                        name: f.name, 
                        path: f.webkitRelativePath || f.name,
                        url: isRaw ? null : URL.createObjectURL(f), 
                        isRaw: isRaw,
                        thumbLoading: isRaw,
                        date: existing ? new Date(existing.date) : new Date(f.lastModified), 
                        hardData: existing?.hardData || null, 
                        aiData: existing?.aiData || null
                    };
                }).sort((a, b) => b.date - a.date);
                
                setPhotos(prev => {
                    prev.forEach(p => {
                        if (p.url && p.url.startsWith('blob:')) URL.revokeObjectURL(p.url);
                    });
                    return loaded;
                });
                setActiveFilters([]);
                setSelectedPhotos(new Set());
                setHeatmapPhotoIds(new Set());
                setNeedsRelink(false);
                setLocalMetadata(null);
                setCloudMetadata(null);
                processThumbnails(loaded);

                if (deduped.duplicates > 0) {
                    setMessage({
                        title: t('Duplicity přeskočeny', 'Duplicates skipped'),
                        text: t(
                            `Načteno ${loaded.length} fotek. Přeskočeno ${deduped.duplicates} identických kopií (stejný název, velikost i čas).`,
                            `Loaded ${loaded.length} photos. Skipped ${deduped.duplicates} identical copies (same name, size and modified time).`
                        )
                    });
                }
            };

            const handleTimeline = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setIsTimelineLoading(true);
                const reader = new FileReader();
                reader.onload = (ev) => {
                    setTimeout(() => {
                        try {
                            const raw = safeJsonParse(ev.target.result);
                            if (!raw) {
                                setMessage({ title: "Chyba", text: "JSON neplatný nebo poškozený." });
                                return;
                            }
                            
                            const items = Array.isArray(raw) ? raw : (raw.timelineObjects || raw.semanticSegments || []);
                            const entries = normalizeTimelineData(items);

                            if (entries.length === 0) {
                                setMessage({ title: t("Chyba", "Error"), text: t("Timeline neobsahuje použitelná data.", "Timeline contains no usable data.") });
                                return;
                            }

                            setTimelineData(entries);

                            const counts = entries.reduce((accumulator, entry) => {
                                accumulator[entry.kind] = (accumulator[entry.kind] || 0) + 1;
                                return accumulator;
                            }, {});

                            const homeEntry = entries.find((entry) => entry.kind === 'visit' && entry.semanticType === 'HOME' && entry.coords);
                            if (homeEntry && !homeLocation) {
                                reverseGeocode(coordsForGeocode(homeEntry.coords)).then((name) => {
                                    if (name && name !== 'Neznámé místo') setHomeLocation(name);
                                }).catch(() => {});
                            }

                            setMessage({
                                title: "OK",
                                text: t(
                                    `Timeline nahráno: ${counts.visit || 0} míst, ${counts.activity || 0} aktivit, ${counts.path || 0} tras.`,
                                    `Timeline loaded: ${counts.visit || 0} places, ${counts.activity || 0} activities, ${counts.path || 0} paths.`
                                )
                            });
                        } catch(err) { 
                            setMessage({ title: "Chyba", text: "Chyba při zpracování Timeline dat." }); 
                        } finally {
                            setIsTimelineLoading(false);
                            if(e.target) e.target.value = ''; 
                        }
                    }, 50);
                };
                reader.readAsText(file);
            };

            // DRAG AND DROP - Podpora Windows-like tree
            const handleFolderDragStart = (e, folderPath) => {
                e.dataTransfer.setData('text/plain', `folder:${folderPath}`);
                e.stopPropagation();
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            const handleDropOnEvent = (e, targetEvent) => {
                e.preventDefault();
                e.stopPropagation();
                const dragData = e.dataTransfer.getData('text/plain');

                if (dragData && dragData.startsWith('folder:')) {
                    const sourceFolder = dragData.replace('folder:', '');
                    // Kontrola proti zacyklení
                    if (sourceFolder === targetEvent || targetEvent.startsWith(sourceFolder + '/')) {
                        setMessage({ title: "Chyba", text: "Nelze přesunout složku do sebe sama nebo do své podsložky." });
                        return;
                    }
                    const sourceFolderName = sourceFolder.split('/').pop();
                    const newFolderPath = targetEvent ? `${targetEvent}/${sourceFolderName}` : sourceFolderName;

                    let count = 0;
                    setPhotos(prev => prev.map(p => {
                        const ev = p.aiData?.event_name || '';
                        if (ev === sourceFolder || ev.startsWith(sourceFolder + '/')) {
                            count++;
                            const suffix = ev.substring(sourceFolder.length);
                            return { ...p, aiData: { ...p.aiData, event_name: newFolderPath + suffix } };
                        }
                        return p;
                    }));
                    
                    setCustomFolders(prev => prev.map(f => {
                        if (f === sourceFolder) return newFolderPath;
                        if (f.startsWith(sourceFolder + '/')) return newFolderPath + f.substring(sourceFolder.length);
                        return f;
                    }));

                    setActiveFilters(prev => prev.map(f => {
                        if (f.startsWith('event-')) {
                            const ev = f.replace('event-', '');
                            if (ev === sourceFolder || ev.startsWith(sourceFolder + '/')) {
                                const suffix = ev.substring(sourceFolder.length);
                                return `event-${newFolderPath}${suffix}`;
                            }
                        }
                        return f;
                    }));

                    setMessage({ title: "Přesunuto", text: `Složka přesunuta do ${newFolderPath} (${count} fotek).` });
                } else if (selectedPhotos.size > 0) {
                    const movedIds = new Set(selectedPhotos);
                    setPhotos(prev => {
                        const exactRep = prev.find((photo) => !movedIds.has(photo.id) && photo.aiData?.event_name === targetEvent);
                        const parentExists = !exactRep && prev.some((photo) => !movedIds.has(photo.id) && (photo.aiData?.event_name || '').startsWith(targetEvent + '/'));
                        const maxClusterNumber = prev.reduce((max, photo) => Math.max(max, photo.aiData?.clusterNumber || 0), 0) + 1;
                        const newId = `evt-moved-${Date.now()}`;

                        return prev.map((photo) => {
                            if (!movedIds.has(photo.id)) return photo;
                            const updated = { ...photo, aiData: { ...(photo.aiData || {}) } };
                            const currentName = updated.aiData.event_name || '';
                            const leaf = currentName.includes('/') ? currentName.split('/').pop() : currentName;

                            if (exactRep) {
                                // Joining an existing event adopts its real cluster/trip identity.
                                const target = exactRep.aiData || {};
                                updated.aiData.event_name = targetEvent;
                                updated.aiData.eventNameSource = 'manual';
                                updated.aiData.clusterId = target.clusterId || newId;
                                updated.aiData.tripId = target.tripId || target.clusterId || newId;
                                updated.aiData.eventKind = target.eventKind || 'misc';
                                updated.aiData.clusterNumber = target.clusterNumber || maxClusterNumber;
                                updated.aiData.tripNumber = target.tripNumber || 0;
                                updated.aiData.stopNumber = target.stopNumber || 0;
                                updated.aiData.tripStart = target.tripStart || null;
                                updated.aiData.tripEnd = target.tripEnd || null;
                            } else if (parentExists) {
                                const siblingName = leaf ? `${targetEvent}/${leaf}` : targetEvent;
                                const sibling = prev.find((item) => !movedIds.has(item.id) && item.aiData?.event_name === siblingName);
                                updated.aiData.event_name = siblingName;
                                updated.aiData.eventNameSource = 'manual';
                                if (sibling) {
                                    // Matching leaf inside the parent means the same event; share its id.
                                    const target = sibling.aiData || {};
                                    updated.aiData.clusterId = target.clusterId || newId;
                                    updated.aiData.tripId = target.tripId || target.clusterId || newId;
                                    updated.aiData.eventKind = target.eventKind || updated.aiData.eventKind || 'misc';
                                    updated.aiData.clusterNumber = target.clusterNumber || maxClusterNumber;
                                    updated.aiData.tripNumber = target.tripNumber || 0;
                                    updated.aiData.stopNumber = target.stopNumber || 0;
                                }
                            } else {
                                // New folder: the moved photos become one new standalone event.
                                updated.aiData.event_name = targetEvent;
                                updated.aiData.eventNameSource = 'manual';
                                updated.aiData.eventKind = 'misc';
                                updated.aiData.clusterId = newId;
                                updated.aiData.tripId = newId;
                                updated.aiData.clusterNumber = maxClusterNumber;
                                updated.aiData.tripNumber = 0;
                                updated.aiData.stopNumber = 0;
                                updated.aiData.tripStart = null;
                                updated.aiData.tripEnd = null;
                            }
                            return updated;
                        });
                    });
                    setSelectedPhotos(new Set());
                    setMessage({ title: "Přesunuto", text: `Úspěšně přesunuto ${movedIds.size} fotek do složky "${targetEvent}".` });
                }
            };

            const handleAddFolder = (parentPath = '') => {
                const name = prompt(parentPath ? `Název nové podsložky v '${parentPath}':` : "Název nové hlavní složky:");
                if (!name || !name.trim()) return;
                const safeName = name.trim().replace(/\//g, '-');
                const fullPath = parentPath ? `${parentPath}/${safeName}` : safeName;
                setCustomFolders(prev => [...new Set([...prev, fullPath])]);
            };

            const handleWrapFolder = (targetPath) => {
                const parentName = prompt(`Zadejte název nové nadřazené složky pro '${targetPath}':\n(Vytvoří složku a zanoří do ní aktuální obsah)`);
                if (!parentName || !parentName.trim()) return;
                const safeParent = parentName.trim().replace(/\//g, '-');
                
                setPhotos(prev => prev.map(p => {
                    const ev = p.aiData?.event_name || '';
                    if (ev === targetPath || ev.startsWith(targetPath + '/')) {
                        return { ...p, aiData: { ...p.aiData, event_name: `${safeParent}/${ev}` } };
                    }
                    return p;
                }));
                
                setCustomFolders(prev => prev.map(f => {
                    if (f === targetPath || f.startsWith(targetPath + '/')) return `${safeParent}/${f}`;
                    return f;
                }));
                
                setActiveFilters(prev => prev.map(f => {
                    if (f.startsWith('event-')) {
                        const ev = f.replace('event-', '');
                        if (ev === targetPath || ev.startsWith(targetPath + '/')) return `event-${safeParent}/${ev}`;
                    }
                    return f;
                }));
            };

            const ensureOllamaModel = async (modelName) => {
                try {
                    const res = await fetch('http://localhost:11434/api/tags');
                    if (!res.ok) throw new Error(`Ollama neodpovídá (HTTP ${res.status}).`);
                    const data = await res.json();
                    const names = Array.isArray(data?.models) ? data.models.map((m) => m.name).filter(Boolean) : [];
                    setOllamaModels(names);
                    const baseName = (name) => String(name).split(':')[0];
                    const available = names.some((name) => name === modelName || baseName(name) === baseName(modelName));
                    if (!available) {
                        throw new Error(`Model "${modelName}" není v Ollamě nainstalovaný.\n\nSpusťte v terminálu:\nollama pull ${modelName}`);
                    }
                    return null;
                } catch (e) {
                    if (e instanceof TypeError || /fetch/i.test(e.message)) {
                        return t(
                            'Ollama neodpovídá na http://localhost:11434.\n\n1. Spusťte Ollama.\n2. Povolte CORS: nastavte OLLAMA_ORIGINS=* a restartujte Ollama.',
                            'Ollama is not responding at http://localhost:11434.\n\n1. Start Ollama.\n2. Allow CORS: set OLLAMA_ORIGINS=* and restart Ollama.'
                        );
                    }
                    return e.message;
                }
            };

            const buildMetadataMap = async (items, sortedTimeline) => {
                const exifById = new Map();
                let workerPoolUsed = false;

                try {
                    const exifResults = await parseExifInWorkerPool(items, (done, total) => {
                        setProgress(t(`EXIF ${done}/${total}...`, `EXIF ${done}/${total}...`));
                    });
                    exifResults.forEach((value, key) => exifById.set(key, value));
                    workerPoolUsed = true;
                } catch (e) {
                    console.warn('EXIF worker pool unavailable, using main thread', e);
                }

                const metas = new Map();
                const geocodeRequests = new Map();
                let parsedCount = 0;

                for (const photo of items) {
                    let exif = exifById.get(photo.id);
                    // A missing/null worker result is retried on the main thread.
                    if (exif === undefined || exif === null) {
                        try {
                            exif = await exifr.parse(photo.file, true);
                        } catch (e) {
                            exif = null;
                        }
                    }

                    const meta = resolvePhotoMetadata(photo, exif, sortedTimeline, homeLocation);
                    if (meta.needsGeocode) {
                        const key = coordsForGeocode(meta.coords);
                        if (geocodeCache.has(key)) {
                            const cached = geocodeCache.get(key);
                            if (cached) {
                                meta.location = cached;
                                meta.locationSource = 'gps';
                                meta.needsGeocode = false;
                            }
                        }
                        if (meta.needsGeocode) {
                            if (!geocodeRequests.has(key)) geocodeRequests.set(key, { coords: meta.coords, ids: [] });
                            geocodeRequests.get(key).ids.push(photo.id);
                        }
                    }

                    metas.set(photo.id, meta);
                    parsedCount += 1;
                    if (!workerPoolUsed && parsedCount % 10 === 0) {
                        setProgress(t(`EXIF ${parsedCount}/${items.length}...`, `EXIF ${parsedCount}/${items.length}...`));
                    }
                }

                if (geocodeRequests.size > 0) {
                    const requests = [...geocodeRequests.entries()].map(([key, value]) => ({ key, coords: value.coords }));
                    let geocodeResults = null;

                    try {
                        geocodeResults = await geocodeCoordsInWorker(requests, (done, total) => {
                            setProgress(t(`Lokace ${done}/${total}...`, `Locations ${done}/${total}...`));
                        });
                    } catch (e) {
                        console.warn('Geocode worker unavailable, using main thread', e);
                    }

                    for (const [key, value] of geocodeRequests.entries()) {
                        let name = geocodeResults ? (geocodeResults.get(key) ?? null) : await reverseGeocode(key);
                        if (name && name !== 'Neznámé místo') {
                            geocodeCache.set(key, name);
                            value.ids.forEach((id) => {
                                const meta = metas.get(id);
                                if (meta && meta.needsGeocode) {
                                    meta.location = name;
                                    meta.locationSource = 'gps';
                                    meta.needsGeocode = false;
                                }
                            });
                        }
                    }
                }

                return metas;
            };

            const resetWorkspace = () => {
                if (!window.confirm(t(
                    'Smazat všechna lokální data (fotky, složky, Timeline i nastavení) a začít znovu?',
                    'Delete all local data (photos, folders, Timeline and settings) and start fresh?'
                ))) return;

                try { localStorage.removeItem(SETTINGS_KEY); } catch (e) {}
                try { localStorage.setItem('aiSorter.skipTimelineAutoLoad', '1'); } catch (e) {}
                geocodeCache.clear();

                if (cloudDb) {
                    try {
                        const { db, appId, uid, doc, setDoc } = cloudDb;
                        const payload = { metadata: null };
                        if (geminiApiKey) payload.geminiApiKey = geminiApiKey;
                        setDoc(doc(db, 'artifacts', appId, 'users', uid, 'workspace', 'current'), payload).catch(() => {});
                    } catch (e) {}
                }

                const reload = () => window.location.reload();
                try {
                    const request = indexedDB.deleteDatabase(PROJECT_DB);
                    request.onsuccess = reload;
                    request.onerror = reload;
                    request.onblocked = () => setTimeout(reload, 600);
                    setTimeout(reload, 1500);
                } catch (e) {
                    reload();
                }
            };

            const openTripModal = () => {
                const source = selectedPhotos.size > 0
                    ? photos.filter((photo) => selectedPhotos.has(photo.id))
                    : photos;
                const times = source
                    .map((photo) => (photo.date instanceof Date ? photo.date.getTime() : new Date(photo.date).getTime()))
                    .filter(Number.isFinite);
                const min = times.length ? new Date(Math.min(...times)) : new Date();
                const max = times.length ? new Date(Math.max(...times)) : new Date();
                const format = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                setTripModal({
                    isOpen: true,
                    start: format(min),
                    end: format(max),
                    name: '',
                    location: ''
                });
            };

            const applyManualTrip = () => {
                const start = new Date(`${tripModal.start}T00:00:00`).getTime();
                const end = new Date(`${tripModal.end}T23:59:59.999`).getTime();
                if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) {
                    setMessage({ title: t('Chyba', 'Error'), text: t('Neplatné datumové okno.', 'Invalid date window.') });
                    return;
                }

                const ids = new Set(
                    photos
                        .filter((photo) => !isScreenshotCategory(photo.aiData?.category))
                        .filter((photo) => photo.aiData?.category !== '🗑️ K vymazání')
                        .filter((photo) => {
                            const time = photo.date instanceof Date ? photo.date.getTime() : new Date(photo.date).getTime();
                            return Number.isFinite(time) && time >= start && time <= end;
                        })
                        .map((photo) => photo.id)
                );

                if (ids.size === 0) {
                    setMessage({ title: t('Chyba', 'Error'), text: t('V tomto okně nejsou žádné fotky.', 'No photos in this window.') });
                    return;
                }

                const tripNumber = Math.max(0, ...photos.map((photo) => photo.aiData?.tripNumber || 0)) + 1;
                const tripId = `evt-manual-trip-${Date.now()}`;
                const eventName = (tripModal.name || `Trip ${tripNumber}`).trim();
                const location = tripModal.location.trim();

                setPhotos((previous) => previous.map((photo) => {
                    if (!ids.has(photo.id)) return photo;
                    const updated = { ...photo, aiData: { ...photo.aiData } };
                    updated.aiData.tripId = tripId;
                    updated.aiData.tripNumber = tripNumber;
                    updated.aiData.clusterId = tripId;
                    updated.aiData.clusterNumber = 0;
                    updated.aiData.stopNumber = 0;
                    updated.aiData.tripStart = start;
                    updated.aiData.tripEnd = end;
                    updated.aiData.eventKind = 'trip';
                    updated.aiData.event_name = eventName;
                    updated.aiData.eventNameSource = 'manual';
                    updated.aiData.tripNameSource = 'manual';
                    updated.aiData.stopNameSource = 'manual';
                    updated.aiData.category = 'Událost';

                    if (location) {
                        const oldLocation = updated.hardData?.location;
                        updated.hardData = { ...(updated.hardData || {}) };
                        updated.hardData.location = location;
                        updated.hardData.locationKey = normalizeLocationName(location);
                        updated.hardData.locationSource = 'manual';
                        updated.hardData.coords = null;
                        let tags = (updated.aiData.tags || []).filter((tag) => tag !== oldLocation && tag !== 'Neznámé místo' && tag !== '#Neznámé místo');
                        tags.push(location);
                        updated.aiData.tags = [...new Set(tags)];
                    }

                    return updated;
                }));

                setTripModal({ isOpen: false, start: '', end: '', name: '', location: '' });
                setSelectedPhotos(new Set());
                setActiveFilters((prev) => prev.filter((filter) => !filter.startsWith('event-')));
                setMessage({
                    title: t('Cesta vytvořena', 'Trip created'),
                    text: t(`Vytvořena cesta „${eventName}“ pro ${ids.size} fotek.`, `Created trip "${eventName}" for ${ids.size} photos.`)
                });
            };

            const runPhase1 = async () => {
                if (photos.length === 0) return;
                setIsExtracting(true);
                setProgress(t('Načítám EXIF...', 'Reading EXIF...'));

                const sortedTimeline = prepareTimeline(timelineData);
                const updated = [...photos].sort((a, b) => a.date - b.date).map((p) => ({
                    ...p,
                    hardData: p.hardData ? { ...p.hardData } : { location: 'Neznámé místo', dateStr: p.date.toLocaleDateString('cs-CZ'), camera: 'Neznámý fotoaparát' },
                    aiData: p.aiData ? { ...p.aiData, tags: [...(p.aiData.tags || [])] } : { tags: [] }
                }));

                const metas = await buildMetadataMap(updated, sortedTimeline);

                for (let i = 0; i < updated.length; i++) {
                    const p = updated[i];
                    const meta = metas.get(p.id);
                    if (!meta) continue;
                    const previousLocation = p.hardData?.location;
                    const autoTags = buildAutoTags(meta.date, { location: meta.location, camera: meta.camera });

                    updated[i] = {
                        ...p,
                        date: meta.date,
                        hardData: {
                            ...p.hardData,
                            dateStr: meta.date.toLocaleDateString('cs-CZ'),
                            timeStr: meta.timeStr,
                            location: meta.location,
                            locationKey: meta.locationKey,
                            locationSource: meta.locationSource,
                            coords: meta.coords || null,
                            camera: meta.camera
                        },
                        aiData: { ...p.aiData, tags: mergePhotoTags(p.aiData.tags, autoTags, previousLocation) }
                    };

                    if (i % 25 === 0 || i === updated.length - 1) {
                        setPhotos([...updated]);
                    }
                }

                setPhotos([...updated]);
                setIsExtracting(false);
                setProgress('');
                setMessage({ title: t("EXIF aktualizován", "EXIF updated"), text: t("Čas, fotoaparát a lokace byly načteny. Pro seskupení spusťte fázi 2.", "Time, camera and location were loaded. Run phase 2 to group photos.") });
            };

            const runPhase2 = async (workflowOverride = null) => {
                const workflow = workflowOverride || groupingWorkflow;
                if (workflowOverride) setGroupingWorkflow(workflowOverride);
                if (photos.length === 0) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Nejprve nahrajte složku s fotkami.", "Please load a photo folder first.") });
                    return;
                }

                setIsGrouping(true);
                setProgress(t('Načítám EXIF a Timeline...', 'Reading EXIF and Timeline...'));

                try {
                    const sortedTimeline = prepareTimeline(timelineData);
                    const work = [...photos].sort((a, b) => a.date - b.date).map((p) => ({
                        ...p,
                        hardData: p.hardData ? { ...p.hardData } : { location: 'Neznámé místo', dateStr: p.date.toLocaleDateString('cs-CZ'), camera: 'Neznámý fotoaparát' },
                        aiData: p.aiData ? { ...p.aiData, tags: [...(p.aiData.tags || [])] } : { tags: [] }
                    }));

                    const metas = await buildMetadataMap(work, sortedTimeline);

                    for (let i = 0; i < work.length; i++) {
                        const photo = work[i];
                        const meta = metas.get(photo.id);
                        if (!meta) continue;
                        const previousLocation = photo.hardData?.location;
                        const autoTags = buildAutoTags(meta.date, { location: meta.location, camera: meta.camera });

                        work[i] = {
                            ...photo,
                            date: meta.date,
                            hardData: {
                                ...photo.hardData,
                                dateStr: meta.date.toLocaleDateString('cs-CZ'),
                                timeStr: meta.timeStr,
                                location: meta.location,
                                locationKey: meta.locationKey,
                                locationSource: meta.locationSource,
                                coords: meta.coords || null,
                                camera: meta.camera
                            },
                            aiData: { ...photo.aiData, tags: mergePhotoTags(photo.aiData.tags, autoTags, previousLocation) }
                        };

                        if (i % 25 === 0 || i === work.length - 1) {
                            setPhotos([...work]);
                        }
                    }

                    setProgress(t('Doplňuji chybějící lokace...', 'Filling missing locations...'));
                    interpolateMissingLocations(work);

                    const screenshots = work.filter(isLikelyScreenshot);
                    const normalPhotos = work.filter((photo) => !isLikelyScreenshot(photo));
                    // Manually named photos keep their event identity across re-runs, so a
                    // re-group can never put them into a second event.
                    const manualPhotos = normalPhotos.filter((photo) => photo.aiData?.eventNameSource === 'manual'
                        && photo.aiData?.event_name
                        && photo.aiData?.clusterId);
                    const manualIds = new Set(manualPhotos.map((photo) => photo.id));
                    const groupablePhotos = normalPhotos.filter((photo) => !manualIds.has(photo.id));

                    const isHeatmapWorkflow = workflow === 'heatmap';
                    const isTripsProfile = groupingProfile === 'trips';
                    let effectiveClusterSettings;
                    let eventGroups = [];
                    let tripInfo = null;

                    if (isHeatmapWorkflow) {
                        // Heatmap clustering starts from the density heatmap itself: each
                        // dense run becomes a separate cluster/folder, ready to edit.
                        effectiveClusterSettings = buildTripSettings({
                            ...manualTripSettings,
                            parentTripGapHours: 12
                        });
                        const manualStopSettings = clusteringMode === 'manual' ? buildClusterSettings(manualClusterSettings) : null;
                        setLastClusterSettings({ profile: 'trips', trip: effectiveClusterSettings, tripMode: 'heatmap', stopMode: clusteringMode });
                        setProgress(t(
                            'Seskupuji podle heatmapy...',
                            'Grouping by heatmap...'
                        ));
                        tripInfo = buildHierarchicalEvents(groupablePhotos, homeLocation, effectiveClusterSettings, manualStopSettings);
                        eventGroups = tripInfo.groups;
                    } else if (isTripsProfile) {
                        effectiveClusterSettings = tripSensitivityMode === 'auto'
                            ? computeAutoTripSettings(normalPhotos, homeLocation)
                            : buildTripSettings(manualTripSettings);
                        const manualStopSettings = clusteringMode === 'manual' ? buildClusterSettings(manualClusterSettings) : null;
                        setLastClusterSettings({ profile: 'trips', trip: effectiveClusterSettings, tripMode: tripSensitivityMode, stopMode: clusteringMode });
                        setProgress(t(
                            `Seskupuji cesty a domov (${effectiveClusterSettings.tripGapHours.toFixed(0)} h mezera / ${effectiveClusterSettings.homeRadiusKm.toFixed(0)} km domov)...`,
                            `Grouping trips and home (${effectiveClusterSettings.tripGapHours.toFixed(0)} h gap / ${effectiveClusterSettings.homeRadiusKm.toFixed(0)} km home)...`
                        ));
                        tripInfo = buildHierarchicalEvents(groupablePhotos, homeLocation, effectiveClusterSettings, manualStopSettings);
                        eventGroups = tripInfo.groups;
                    } else {
                        effectiveClusterSettings = clusteringMode === 'auto'
                            ? computeAutoClusterSettings(normalPhotos)
                            : buildClusterSettings(manualClusterSettings);
                        setLastClusterSettings({ ...effectiveClusterSettings, profile: 'places' });
                        setProgress(t(
                            `Seskupuji podle hustoty (${effectiveClusterSettings.epsTimeHours.toFixed(1)} h / ${effectiveClusterSettings.epsSpaceKm.toFixed(1)} km)...`,
                            `Grouping by density (${effectiveClusterSettings.epsTimeHours.toFixed(1)} h / ${effectiveClusterSettings.epsSpaceKm.toFixed(1)} km)...`
                        ));
                        const placeClusters = clusterPhotosByDensity(groupablePhotos, effectiveClusterSettings);
                        const randomPhotos = [];
                        eventGroups = [];
                        placeClusters.forEach((groupPhotos, index) => {
                            if (groupPhotos.length < (effectiveClusterSettings.randomMinPhotos || 3)) {
                                randomPhotos.push(...groupPhotos);
                                return;
                            }
                            eventGroups.push({
                                photos: groupPhotos,
                                eventName: null,
                                clusterId: `evt-place-${groupPhotos[0]?.date?.getTime() || Date.now()}-${index}`,
                                clusterNumber: index + 1,
                                eventKind: 'place',
                                tripId: null,
                                tripNumber: 0,
                                stopNumber: 0
                            });
                        });
                        if (randomPhotos.length > 0) {
                            eventGroups.push({
                                photos: randomPhotos.sort((a, b) => a.date - b.date),
                                eventName: RANDOM_FOLDER,
                                clusterId: 'random',
                                clusterNumber: 0,
                                eventKind: 'random',
                                tripId: 'random',
                                tripNumber: 0,
                                stopNumber: 0
                            });
                        }
                    }

                    if (manualPhotos.length > 0) {
                        const manualGroups = new Map();
                        manualPhotos.forEach((photo) => {
                            const key = photo.aiData?.clusterId || photo.aiData?.tripId || photo.id;
                            if (!manualGroups.has(key)) manualGroups.set(key, []);
                            manualGroups.get(key).push(photo);
                        });
                        manualGroups.forEach((photos, key) => {
                            const first = photos[0];
                            eventGroups.push({
                                photos: photos.sort((a, b) => a.date - b.date),
                                eventName: first.aiData?.event_name || '',
                                clusterId: first.aiData?.clusterId || key,
                                clusterNumber: first.aiData?.clusterNumber || 0,
                                eventKind: first.aiData?.eventKind || 'misc',
                                tripId: first.aiData?.tripId || first.aiData?.clusterId || key,
                                tripNumber: first.aiData?.tripNumber || 0,
                                stopNumber: first.aiData?.stopNumber || 0,
                                tripStart: first.aiData?.tripStart || null,
                                tripEnd: first.aiData?.tripEnd || null,
                                manual: true
                            });
                        });
                    }
                    eventGroups.sort((a, b) => (a.photos[0]?.date?.getTime() || 0) - (b.photos[0]?.date?.getTime() || 0));

                    eventGroups.forEach((group, index) => {
                        const groupPhotos = group.photos;
                        const isRandom = group.eventKind === 'random';
                        const dominant = (group.manual || isRandom) ? null : applyDominantClusterLocation(groupPhotos);
                        const location = dominant?.location || groupPhotos[0]?.hardData?.location || 'Neznámé místo';
                        const placeholder = buildGroupPlaceholderName(group, index, location);
                        const clusterId = group.clusterId || `evt-${groupPhotos[0]?.date?.getTime() || Date.now()}-${index}`;

                        groupPhotos.forEach((photo) => {
                            const autoTags = buildAutoTags(photo.date, photo.hardData);
                            photo.aiData.tags = mergePhotoTags(photo.aiData.tags, autoTags, null);

                            if (group.manual) {
                                photo.aiData.category = photo.aiData.category || 'Událost';
                                return;
                            }

                            photo.aiData.clusterId = clusterId;
                            photo.aiData.clusterNumber = group.clusterNumber || index + 1;
                            photo.aiData.eventKind = group.eventKind || 'place';
                            photo.aiData.tripId = group.tripId || null;
                            photo.aiData.tripNumber = group.tripNumber || 0;
                            photo.aiData.stopNumber = group.stopNumber || 0;
                            photo.aiData.tripStart = group.tripStart || null;
                            photo.aiData.tripEnd = group.tripEnd || null;
                            photo.aiData.category = isRandom ? RANDOM_CATEGORY : 'Událost';

                            if (photo.aiData.eventNameSource === 'manual') {
                                // Ručně pojmenované události zůstávají při re-seskupení nedotčené.
                                photo.aiData.eventNameSource = 'manual';
                                photo.aiData.tripNameSource = photo.aiData.tripNameSource || 'manual';
                                photo.aiData.stopNameSource = photo.aiData.stopNameSource || 'manual';
                            } else {
                                photo.aiData.event_name = placeholder;
                                photo.aiData.eventNameSource = 'placeholder';
                                photo.aiData.tripNameSource = 'placeholder';
                                photo.aiData.stopNameSource = 'placeholder';
                            }
                        });
                    });

                    screenshots.forEach((photo) => {
                        const autoTags = buildAutoTags(photo.date, photo.hardData);
                        photo.aiData.tags = mergePhotoTags(photo.aiData.tags, autoTags, null);
                        photo.aiData.clusterId = 'screenshots';
                        photo.aiData.clusterNumber = 0;
                        photo.aiData.eventKind = 'screenshot';
                        photo.aiData.tripId = null;
                        photo.aiData.category = SCREENSHOT_CATEGORY;
                        photo.aiData.event_name = SCREENSHOT_FOLDER;
                        photo.aiData.eventNameSource = 'placeholder';
                        photo.aiData.tripNameSource = 'placeholder';
                        photo.aiData.stopNameSource = 'placeholder';
                        photo.aiData.tags = [...new Set([...photo.aiData.tags, 'Screenshot'])];
                    });

                    setCustomFolders((prev) => prev.filter((folder) => !isPlaceholderEventName(folder.split('/').pop())));
                    setActiveFilters((prev) => prev.filter((filter) => !filter.startsWith('event-')));
                    setSelectedPhotos(new Set());
                    setHeatmapPhotoIds(new Set());
                    setPhotos([...work]);

                    const knownLocations = new Set(work.map((p) => p.hardData.location).filter((location) => location && location !== 'Neznámé místo'));
                    const modeLabel = clusteringMode === 'auto' ? t('Auto', 'Auto') : t('Ruční', 'Manual');
                    const randomNote = tripInfo?.randomCount > 0 ? t(' a Random', ' and Random') : '';
                    const summaryText = isHeatmapWorkflow
                        ? t(
                            `Heatmap clustering: vytvořeno ${tripInfo.tripCount} clusterů${randomNote} z ${normalPhotos.length} fotek. Upravte je nebo nakreslete další v dolním panelu (klik Start, klik Konec nebo tažení).`,
                            `Heatmap clustering: created ${tripInfo.tripCount} clusters${randomNote} from ${normalPhotos.length} photos. Edit them or draw more in the bottom panel (click start, click end, or drag).`
                        )
                        : isTripsProfile
                        ? t(
                            `Vytvořeno ${tripInfo.tripCount} cest, ${tripInfo.stopCount} zastávek a ${tripInfo.homeSessionCount} domácích focení${randomNote} z ${normalPhotos.length} fotek (${knownLocations.size} lokací). Režim ${modeLabel}: mezera ${effectiveClusterSettings.tripGapHours.toFixed(0)} h, domov ${effectiveClusterSettings.homeRadiusKm.toFixed(0)} km, sezení ${effectiveClusterSettings.homeSessionGapHours.toFixed(1)} h.`,
                            `Created ${tripInfo.tripCount} trips, ${tripInfo.stopCount} stops and ${tripInfo.homeSessionCount} home sessions${randomNote} from ${normalPhotos.length} photos (${knownLocations.size} locations). ${modeLabel} mode: ${effectiveClusterSettings.tripGapHours.toFixed(0)} h gap, ${effectiveClusterSettings.homeRadiusKm.toFixed(0)} km home, ${effectiveClusterSettings.homeSessionGapHours.toFixed(1)} h session.`
                        )
                        : t(
                            `Vytvořeno ${eventGroups.length} událostí z ${normalPhotos.length} fotek (${knownLocations.size} lokací). Režim ${modeLabel}: ${effectiveClusterSettings.epsTimeHours.toFixed(1)} h / ${effectiveClusterSettings.epsSpaceKm.toFixed(1)} km, min. ${effectiveClusterSettings.minPoints} fotky.`,
                            `Created ${eventGroups.length} events from ${normalPhotos.length} photos (${knownLocations.size} locations). ${modeLabel} mode: ${effectiveClusterSettings.epsTimeHours.toFixed(1)} h / ${effectiveClusterSettings.epsSpaceKm.toFixed(1)} km, min ${effectiveClusterSettings.minPoints} photos.`
                        );
                    setMessage({ title: isHeatmapWorkflow ? t('Heatmapa připravena', 'Heatmap ready') : t("Seskupeno", "Grouped"), text: summaryText });
                    if (isHeatmapWorkflow) setShowClusterReview(true);
                } catch (e) {
                    setMessage({ title: t("Chyba seskupení", "Grouping error"), text: e.message });
                }

                setIsGrouping(false);
                setProgress('');
            };

            const runPhase3 = async () => {
                if (photos.length === 0) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Nejprve nahrajte složku s fotkami.", "Please load a photo folder first.") });
                    return;
                }

                if (!photos.some((p) => p.aiData?.clusterId && p.aiData.clusterId !== 'screenshots')) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Nejprve spusťte fázi 2 (seskupení podle času a místa).", "Run phase 2 (grouping by time and location) first.") });
                    return;
                }

                const isGeminiModel = isGeminiSelection(textModel);
                const legacyGeminiModels = { 'gemini-3.8-pro': 'gemini-3.8-flash' };
                const resolvedModel = textModel === 'custom'
                    ? textModelCustom
                    : textModel === 'gemini-custom'
                        ? geminiModelCustom
                        : textModel;
                const modelToUse = (legacyGeminiModels[resolvedModel] || resolvedModel || '').trim();

                if (!modelToUse) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model nebo zadejte jeho název.", "Select a model or enter its name.") });
                    return;
                }
                if (isGeminiModel) {
                    if (!geminiApiKey) {
                        setMessage({ title: t("Chyba", "Error"), text: t("Pro Gemini je potřeba zadat API klíč.", "A Gemini API key is required.") });
                        return;
                    }
                } else {
                    const modelError = await ensureOllamaModel(modelToUse);
                    if (modelError) {
                        setMessage({ title: t("Chyba modelu", "Model error"), text: modelError });
                        return;
                    }
                }

                setIsAnalyzing(true);
                setAnalyzingProgress(0);
                setProgress(t('Připravuji události pro AI...', 'Preparing events for AI...'));

                const updated = photos.map((p) => ({
                    ...p,
                    hardData: p.hardData ? { ...p.hardData } : { dateStr: p.date.toLocaleDateString('cs-CZ'), location: 'Neznámé místo', camera: 'Neznámý fotoaparát' },
                    aiData: p.aiData ? { ...p.aiData, tags: [...(p.aiData.tags || [])] } : { tags: [] }
                }));

                try {
                    const namingTrips = namingLevel === 'trips';
                    const groups = new Map();

                    updated.forEach((photo) => {
                        const clusterId = photo.aiData?.clusterId;
                        if (!clusterId || clusterId === 'screenshots') return;
                        if (isScreenshotCategory(photo.aiData?.category)) return;
                        const groupKey = namingTrips ? (photo.aiData?.tripId || clusterId) : clusterId;
                        if (!groups.has(groupKey)) groups.set(groupKey, []);
                        groups.get(groupKey).push(photo);
                    });

                    const isManualForLevel = (photo) => {
                        if (namingTrips) {
                            return photo.aiData?.tripNameSource === 'manual'
                                || (photo.aiData?.tripNameSource === undefined && photo.aiData?.eventNameSource === 'manual');
                        }
                        if (photo.aiData?.eventKind === 'trip-stop') {
                            return photo.aiData?.stopNameSource === 'manual'
                                || (photo.aiData?.stopNameSource === undefined && photo.aiData?.eventNameSource === 'manual');
                        }
                        return photo.aiData?.tripNameSource === 'manual'
                            || (photo.aiData?.tripNameSource === undefined && photo.aiData?.eventNameSource === 'manual');
                    };

                    const clusters = [...groups.values()].filter((items) => items.some((photo) => !isManualForLevel(photo)));
                    if (clusters.length === 0) {
                        setMessage({ title: t("Nic k pojmenování", "Nothing to name"), text: t("Všechny události už mají ruční název.", "All events already have manual names.") });
                        setIsAnalyzing(false);
                        setAnalyzingProgress(0);
                        setProgress('');
                        return;
                    }

                    const clusterSummaries = clusters.map((cluster, index) => {
                        const locations = [...new Set(cluster.map((p) => p.hardData?.location).filter((location) => location && location !== 'Neznámé místo'))];
                        const tags = [...new Set(cluster.flatMap((p) => p.aiData?.tags || []))].filter((tag) => !AUTO_TAG_VALUES.has(tag));

                        return {
                            id: index.toString(),
                            pocet_fotek: cluster.length,
                            datum: `${cluster[0].hardData.dateStr} - ${cluster[cluster.length - 1].hardData.dateStr}`,
                            cas: `${cluster[0].hardData.timeStr || ''} - ${cluster[cluster.length - 1].hardData.timeStr || ''}`,
                            lokace: locations.slice(0, 3).join(', '),
                            tagy: tags.slice(0, 8).join(', ')
                        };
                    });

                    const homeContext = homeLocation ? `\n\nDŮLEŽITÉ: Uživatel má domov v lokaci: "${homeLocation}". Pokud je hlavní lokací fotek tento domov, NEPOUŽÍVEJ názvy jako "Výlet" nebo "Dovolená". Místo toho událost pojmenuj "Doma", "Běžný den" nebo "Oslava doma".` : '';

                    const askTextModel = async (promptText) => {
                        if (isGeminiModel) {
                            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiApiKey },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: promptText }] }],
                                    generationConfig: { response_mime_type: "application/json", maxOutputTokens: 8192 }
                                })
                            });
                            const result = await res.json().catch(() => ({}));
                            if (!res.ok || result.error) throw new Error(result?.error?.message || `Gemini HTTP ${res.status}`);

                            const candidate = result?.candidates?.[0];
                            const text = (candidate?.content?.parts || [])
                                .filter((part) => !part.thought)
                                .map((part) => part.text || '')
                                .join('')
                                .trim();
                            if (!text) {
                                const reason = candidate?.finishReason || result?.promptFeedback?.blockReason;
                                throw new Error(`Gemini nevrátil text${reason ? ` (${reason})` : ''}.`);
                            }
                            return text;
                        }

                        const res = await fetch('http://localhost:11434/api/generate', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                model: modelToUse, prompt: promptText, stream: false, format: 'json',
                                options: { temperature: 0.2, num_predict: 1024 }
                            })
                        });
                        const result = await res.json().catch(() => ({}));
                        if (!res.ok || result.error) throw new Error(result?.error || `Ollama HTTP ${res.status}`);
                        return result?.response || "";
                    };

                    const buildPrompt = (batch, ids = null) => {
                        const effectiveIds = ids || batch.map((_, index) => index);
                        const keys = effectiveIds.map((id) => `"${id}"`).join(', ');
                        const data = batch.map((summary, index) => ({ ...summary, id: String(effectiveIds[index]) }));
                        const example = effectiveIds.slice(0, 2).map((id, index) => `"${id}": "${index === 0 ? 'Dovolená Itálie' : 'Oslava narozenin'}"`).join(', ');

                        return `Jsi profesionální archivář. Vytvoř krátký a výstižný název pro každou složku s fotkami.${homeContext}
PRAVIDLA:
- Vrať POUZE validní JSON objekt, žádný text před ním ani po něm.
- Objekt musí mít přesně ${batch.length} klíčů: ${keys}.
- Hodnotou každého klíče je název složky v češtině, maximálně 6 slov.
- Pokud je známá lokace, použij ji v názvu (např. "Výlet Kutná Hora").
- Názvy musí být vzájemně různé.
- Nepoužívej obecné názvy jako "Archiv", "Událost" nebo "Fotky".

PŘÍKLAD ODPOVĚDI: {${example}}

DATA: ${JSON.stringify(data)}`;
                    };

                    const BATCH_SIZE = 20;
                    const finalNames = {};
                    for (let start = 0; start < clusterSummaries.length; start += BATCH_SIZE) {
                        const batch = clusterSummaries.slice(start, start + BATCH_SIZE);
                        setProgress(t(
                            `Pojmenovávám události ${start + 1}-${Math.min(start + batch.length, clusterSummaries.length)} z ${clusterSummaries.length}...`,
                            `Naming events ${start + 1}-${Math.min(start + batch.length, clusterSummaries.length)} of ${clusterSummaries.length}...`
                        ));

                        let names = {};
                        try {
                            names = normalizeNameMap(extractJson(await askTextModel(buildPrompt(batch))), batch.length);
                        } catch (e) {
                            console.warn('AI naming batch failed', e);
                        }

                        const missing = batch.map((_, index) => index).filter((index) => !names[String(index)]);
                        if (missing.length > 0) {
                            try {
                                const retryBatch = missing.map((index) => batch[index]);
                                const retryNames = normalizeNameMap(
                                    extractJson(await askTextModel(buildPrompt(retryBatch, missing))),
                                    batch.length,
                                    missing
                                );
                                names = { ...names, ...retryNames };
                            } catch (e) {
                                console.warn('AI naming retry failed', e);
                            }
                        }

                        batch.forEach((summary, localIndex) => {
                            const name = names[String(localIndex)];
                            if (name) finalNames[summary.id] = name;
                        });
                    }

                    if (Object.keys(finalNames).length === 0) {
                        throw new Error(t(
                            'AI nevrátila žádné použitelné názvy událostí. Zkuste jiný model nebo zkontrolujte, že Ollama běží.',
                            'The AI returned no usable event names. Try another model or make sure Ollama is running.'
                        ));
                    }

                    setAnalyzingProgress(80);
                    setProgress(t('Aplikuji názvy na fotky...', 'Applying names to photos...'));

                    const indexById = new Map(updated.map((photo, photoIndex) => [photo.id, photoIndex]));
                    let changesCount = 0;
                    let fallbackCount = 0;
                    const usedBaseNames = new Set();

                    clusters.forEach((cluster, index) => {
                        const aiName = finalNames[index.toString()];
                        if (!aiName) fallbackCount += 1;
                        let baseName = cleanEventName(aiName || buildFallbackEventName(cluster)) || 'Nezařazená událost';
                        baseName = cleanEventName(baseName.split('/').pop());

                        let uniqueName = baseName;
                        if (usedBaseNames.has(uniqueName)) {
                            let counter = 2;
                            while (usedBaseNames.has(`${baseName} (${counter})`)) counter += 1;
                            uniqueName = `${baseName} (${counter})`;
                        }
