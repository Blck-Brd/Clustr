                    setTimeout(() => {
                        try {
                            const raw = safeJsonParse(ev.target.result);
                            if (!raw) {
                                setMessage({ title: "Chyba", text: "JSON neplatný nebo poškozený." });
                                return;
                            }
                            
                            const items = Array.isArray(raw) ? raw : (raw.timelineObjects || raw.semanticSegments || []);
                            const entries = normalizeTimelineData(items);

                            if (entries.length === 0) {
                                setMessage({ title: t("Chyba", "Error"), text: t("Timeline neobsahuje použitelná data.", "Timeline contains no usable data.") });
                                return;
                            }

                            setTimelineData(entries);

                            const counts = entries.reduce((accumulator, entry) => {
                                accumulator[entry.kind] = (accumulator[entry.kind] || 0) + 1;
                                return accumulator;
                            }, {});

                            const homeEntry = entries.find((entry) => entry.kind === 'visit' && entry.semanticType === 'HOME' && entry.coords);
                            if (homeEntry && !homeLocation) {
                                reverseGeocode(coordsForGeocode(homeEntry.coords)).then((name) => {
                                    if (name && name !== 'Neznámé místo') setHomeLocation(name);
                                }).catch(() => {});
                            }

                            setMessage({
                                title: "OK",
                                text: t(
                                    `Timeline nahráno: ${counts.visit || 0} míst, ${counts.activity || 0} aktivit, ${counts.path || 0} tras.`,
                                    `Timeline loaded: ${counts.visit || 0} places, ${counts.activity || 0} activities, ${counts.path || 0} paths.`
                                )
                            });
                        } catch(err) { 
                            setMessage({ title: "Chyba", text: "Chyba při zpracování Timeline dat." }); 
                        } finally {
                            setIsTimelineLoading(false);
                            if(e.target) e.target.value = ''; 
                        }
                    }, 50);
                };
                reader.readAsText(file);
            };

            // DRAG AND DROP - Podpora Windows-like tree
            const handleFolderDragStart = (e, folderPath) => {
                e.dataTransfer.setData('text/plain', `folder:${folderPath}`);
                e.stopPropagation();
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            const handleDropOnEvent = (e, targetEvent) => {
                e.preventDefault();
                e.stopPropagation();
                const dragData = e.dataTransfer.getData('text/plain');

                if (dragData && dragData.startsWith('folder:')) {
                    const sourceFolder = dragData.replace('folder:', '');
                    // Kontrola proti zacyklení
                    if (sourceFolder === targetEvent || targetEvent.startsWith(sourceFolder + '/')) {
                        setMessage({ title: "Chyba", text: "Nelze přesunout složku do sebe sama nebo do své podsložky." });
                        return;
                    }
                    const sourceFolderName = sourceFolder.split('/').pop();
                    const newFolderPath = targetEvent ? `${targetEvent}/${sourceFolderName}` : sourceFolderName;

                    let count = 0;
                    setPhotos(prev => prev.map(p => {
                        const ev = p.aiData?.event_name || '';
                        if (ev === sourceFolder || ev.startsWith(sourceFolder + '/')) {
                            count++;
                            const suffix = ev.substring(sourceFolder.length);
                            return { ...p, aiData: { ...p.aiData, event_name: newFolderPath + suffix } };
                        }
                        return p;
                    }));
                    
                    setCustomFolders(prev => prev.map(f => {
                        if (f === sourceFolder) return newFolderPath;
                        if (f.startsWith(sourceFolder + '/')) return newFolderPath + f.substring(sourceFolder.length);
                        return f;
                    }));

                    setActiveFilters(prev => prev.map(f => {
                        if (f.startsWith('event-')) {
                            const ev = f.replace('event-', '');
                            if (ev === sourceFolder || ev.startsWith(sourceFolder + '/')) {
                                const suffix = ev.substring(sourceFolder.length);
                                return `event-${newFolderPath}${suffix}`;
                            }
                        }
                        return f;
                    }));

                    setMessage({ title: "Přesunuto", text: `Složka přesunuta do ${newFolderPath} (${count} fotek).` });
                } else if (selectedPhotos.size > 0) {
                    let count = selectedPhotos.size;
                    setPhotos(prev => prev.map(p => {
                        if (!selectedPhotos.has(p.id)) return p;
                        let updated = { ...p };
                        if (!updated.aiData) updated.aiData = {};
                        updated.aiData.event_name = targetEvent;
                        updated.aiData.eventNameSource = 'manual';
                        return updated;
                    }));
                    setSelectedPhotos(new Set());
                    setMessage({ title: "Přesunuto", text: `Úspěšně přesunuto ${count} fotek do složky "${targetEvent}".` });
                }
            };

            const handleAddFolder = (parentPath = '') => {
                const name = prompt(parentPath ? `Název nové podsložky v '${parentPath}':` : "Název nové hlavní složky:");
                if (!name || !name.trim()) return;
                const safeName = name.trim().replace(/\//g, '-');
                const fullPath = parentPath ? `${parentPath}/${safeName}` : safeName;
                setCustomFolders(prev => [...new Set([...prev, fullPath])]);
            };

            const handleWrapFolder = (targetPath) => {
                const parentName = prompt(`Zadejte název nové nadřazené složky pro '${targetPath}':\n(Vytvoří složku a zanoří do ní aktuální obsah)`);
                if (!parentName || !parentName.trim()) return;
                const safeParent = parentName.trim().replace(/\//g, '-');
                
                setPhotos(prev => prev.map(p => {
                    const ev = p.aiData?.event_name || '';
                    if (ev === targetPath || ev.startsWith(targetPath + '/')) {
                        return { ...p, aiData: { ...p.aiData, event_name: `${safeParent}/${ev}` } };
                    }
                    return p;
                }));
                
                setCustomFolders(prev => prev.map(f => {
                    if (f === targetPath || f.startsWith(targetPath + '/')) return `${safeParent}/${f}`;
                    return f;
                }));
                
                setActiveFilters(prev => prev.map(f => {
                    if (f.startsWith('event-')) {
                        const ev = f.replace('event-', '');
                        if (ev === targetPath || ev.startsWith(targetPath + '/')) return `event-${safeParent}/${ev}`;
                    }
                    return f;
                }));
            };

            const ensureOllamaModel = async (modelName) => {
                try {
                    const res = await fetch('http://localhost:11434/api/tags');
                    if (!res.ok) throw new Error(`Ollama neodpovídá (HTTP ${res.status}).`);
                    const data = await res.json();
                    const names = Array.isArray(data?.models) ? data.models.map((m) => m.name).filter(Boolean) : [];
                    setOllamaModels(names);
                    const baseName = (name) => String(name).split(':')[0];
                    const available = names.some((name) => name === modelName || baseName(name) === baseName(modelName));
                    if (!available) {
                        throw new Error(`Model "${modelName}" není v Ollamě nainstalovaný.\n\nSpusťte v terminálu:\nollama pull ${modelName}`);
                    }
                    return null;
                } catch (e) {
                    if (e instanceof TypeError || /fetch/i.test(e.message)) {
                        return t(
                            'Ollama neodpovídá na http://localhost:11434.\n\n1. Spusťte Ollama.\n2. Povolte CORS: nastavte OLLAMA_ORIGINS=* a restartujte Ollama.',
                            'Ollama is not responding at http://localhost:11434.\n\n1. Start Ollama.\n2. Allow CORS: set OLLAMA_ORIGINS=* and restart Ollama.'
                        );
                    }
                    return e.message;
                }
            };

            const runPhase1 = async () => {
                if (photos.length === 0) return;
                setIsExtracting(true);
                setProgress(t('Načítám EXIF...', 'Reading EXIF...'));

                const sortedTimeline = prepareTimeline(timelineData);
                const updated = [...photos].sort((a, b) => a.date - b.date).map((p) => ({
                    ...p,
                    hardData: p.hardData ? { ...p.hardData } : { location: 'Neznámé místo', dateStr: p.date.toLocaleDateString('cs-CZ'), camera: 'Neznámý fotoaparát' },
                    aiData: p.aiData ? { ...p.aiData, tags: [...(p.aiData.tags || [])] } : { tags: [] }
                }));

                for (let i = 0; i < updated.length; i++) {
                    const p = updated[i];
                    const previousLocation = p.hardData?.location;
                    const meta = await extractPhotoMetadata(p, sortedTimeline, homeLocation);
                    const autoTags = buildAutoTags(meta.date, { location: meta.location, camera: meta.camera });

                    updated[i] = {
                        ...p,
                        date: meta.date,
                        hardData: {
                            ...p.hardData,
                            dateStr: meta.date.toLocaleDateString('cs-CZ'),
                            timeStr: meta.timeStr,
                            location: meta.location,
                            locationKey: meta.locationKey,
                            locationSource: meta.locationSource,
                            coords: meta.coords || null,
                            camera: meta.camera
                        },
                        aiData: { ...p.aiData, tags: mergePhotoTags(p.aiData.tags, autoTags, previousLocation) }
                    };

                    if (i % 10 === 0 || i === updated.length - 1) {
                        setProgress(t(`EXIF a lokace ${i + 1}/${updated.length}...`, `EXIF and location ${i + 1}/${updated.length}...`));
                        setPhotos([...updated]);
                    }
                }

                setPhotos([...updated]);
                setIsExtracting(false);
                setProgress('');
                setMessage({ title: t("EXIF aktualizován", "EXIF updated"), text: t("Čas, fotoaparát a lokace byly načteny. Pro seskupení spusťte fázi 2.", "Time, camera and location were loaded. Run phase 2 to group photos.") });
            };

            const runPhase2 = async () => {
                if (photos.length === 0) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Nejprve nahrajte složku s fotkami.", "Please load a photo folder first.") });
                    return;
                }

                setIsGrouping(true);
                setProgress(t('Načítám EXIF a Timeline...', 'Reading EXIF and Timeline...'));

                try {
                    const sortedTimeline = prepareTimeline(timelineData);
                    const work = [...photos].sort((a, b) => a.date - b.date).map((p) => ({
                        ...p,
                        hardData: p.hardData ? { ...p.hardData } : { location: 'Neznámé místo', dateStr: p.date.toLocaleDateString('cs-CZ'), camera: 'Neznámý fotoaparát' },
                        aiData: p.aiData ? { ...p.aiData, tags: [...(p.aiData.tags || [])] } : { tags: [] }
                    }));

                    for (let i = 0; i < work.length; i++) {
                        const photo = work[i];
                        const previousLocation = photo.hardData?.location;
                        const meta = await extractPhotoMetadata(photo, sortedTimeline, homeLocation);
                        const autoTags = buildAutoTags(meta.date, { location: meta.location, camera: meta.camera });

                        work[i] = {
                            ...photo,
                            date: meta.date,
                            hardData: {
                                ...photo.hardData,
                                dateStr: meta.date.toLocaleDateString('cs-CZ'),
                                timeStr: meta.timeStr,
                                location: meta.location,
                                locationKey: meta.locationKey,
                                locationSource: meta.locationSource,
                                coords: meta.coords || null,
                                camera: meta.camera
                            },
                            aiData: { ...photo.aiData, tags: mergePhotoTags(photo.aiData.tags, autoTags, previousLocation) }
                        };

                        if (i % 25 === 0 || i === work.length - 1) {
                            setProgress(t(`EXIF a lokace ${i + 1}/${work.length}...`, `EXIF and location ${i + 1}/${work.length}...`));
                            setPhotos([...work]);
                        }
                    }

                    setProgress(t('Doplňuji chybějící lokace...', 'Filling missing locations...'));
                    interpolateMissingLocations(work);

                    const screenshots = work.filter(isLikelyScreenshot);
                    const normalPhotos = work.filter((photo) => !isLikelyScreenshot(photo));

                    setProgress(t('Seskupuji podle času a místa...', 'Grouping by time and location...'));
                    const clusters = clusterPhotosByTimeAndLocation(normalPhotos);

                    clusters.forEach((cluster, index) => {
                        const dominant = applyDominantClusterLocation(cluster);
                        const location = dominant?.location || cluster[0]?.hardData?.location || 'Neznámé místo';
                        const placeholder = buildPlaceholderEventName(index, location);
                        const clusterId = `evt-${cluster[0]?.date?.getTime() || Date.now()}-${index}`;

                        cluster.forEach((photo) => {
                            const autoTags = buildAutoTags(photo.date, photo.hardData);
                            photo.aiData.tags = mergePhotoTags(photo.aiData.tags, autoTags, null);
                            photo.aiData.clusterId = clusterId;
                            photo.aiData.clusterNumber = index + 1;
                            photo.aiData.category = 'Událost';

                            if (photo.aiData.eventNameSource === 'manual') {
                                // Ručně pojmenované události zůstávají při re-seskupení nedotčené.
                                photo.aiData.eventNameSource = 'manual';
                            } else {
                                photo.aiData.event_name = placeholder;
                                photo.aiData.eventNameSource = 'placeholder';
                            }
                        });
                    });

                    screenshots.forEach((photo) => {
                        const autoTags = buildAutoTags(photo.date, photo.hardData);
                        photo.aiData.tags = mergePhotoTags(photo.aiData.tags, autoTags, null);
                        photo.aiData.clusterId = 'screenshots';
                        photo.aiData.clusterNumber = 0;
                        photo.aiData.category = 'Snímky obrazovky / Různé';
                        photo.aiData.event_name = 'Snímky obrazovky';
                        photo.aiData.eventNameSource = 'placeholder';
                        photo.aiData.tags = [...new Set([...photo.aiData.tags, 'Screenshot'])];
                    });

                    setCustomFolders((prev) => prev.filter((folder) => !isPlaceholderEventName(folder.split('/').pop())));
                    setActiveFilters((prev) => prev.filter((filter) => !filter.startsWith('event-')));
                    setSelectedPhotos(new Set());
                    setPhotos([...work]);

                    const knownLocations = new Set(work.map((p) => p.hardData.location).filter((location) => location && location !== 'Neznámé místo'));
                    setMessage({
                        title: t("Seskupeno", "Grouped"),
                        text: t(
                            `Vytvořeno ${clusters.length} událostí z ${normalPhotos.length} fotek (${knownLocations.size} lokací). Každá fotka má čas, místo a dočasný název. Ve fázi 3 je může AI pojmenovat.`,
                            `Created ${clusters.length} events from ${normalPhotos.length} photos (${knownLocations.size} locations). Every photo has a time, location and temporary name. Phase 3 can name them with AI.`
                        )
                    });
                } catch (e) {
                    setMessage({ title: t("Chyba seskupení", "Grouping error"), text: e.message });
                }

                setIsGrouping(false);
                setProgress('');
            };

            const runPhase3 = async () => {
                if (photos.length === 0) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Nejprve nahrajte složku s fotkami.", "Please load a photo folder first.") });
                    return;
                }

                if (!photos.some((p) => p.aiData?.clusterId && p.aiData.clusterId !== 'screenshots')) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Nejprve spusťte fázi 2 (seskupení podle času a místa).", "Run phase 2 (grouping by time and location) first.") });
                    return;
                }

                const isGeminiModel = isGeminiSelection(textModel);
                const legacyGeminiModels = { 'gemini-3.8-pro': 'gemini-3.8-flash' };
                const resolvedModel = textModel === 'custom'
                    ? textModelCustom
                    : textModel === 'gemini-custom'
                        ? geminiModelCustom
                        : textModel;
                const modelToUse = (legacyGeminiModels[resolvedModel] || resolvedModel || '').trim();

                if (!modelToUse) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model nebo zadejte jeho název.", "Select a model or enter its name.") });
                    return;
                }
                if (isGeminiModel) {
                    if (!geminiApiKey) {
                        setMessage({ title: t("Chyba", "Error"), text: t("Pro Gemini je potřeba zadat API klíč.", "A Gemini API key is required.") });
                        return;
                    }
                } else {
                    const modelError = await ensureOllamaModel(modelToUse);
                    if (modelError) {
                        setMessage({ title: t("Chyba modelu", "Model error"), text: modelError });
                        return;
                    }
                }

                setIsAnalyzing(true);
                setAnalyzingProgress(0);
                setProgress(t('Připravuji události pro AI...', 'Preparing events for AI...'));

                const updated = photos.map((p) => ({
                    ...p,
                    hardData: p.hardData ? { ...p.hardData } : { dateStr: p.date.toLocaleDateString('cs-CZ'), location: 'Neznámé místo', camera: 'Neznámý fotoaparát' },
                    aiData: p.aiData ? { ...p.aiData, tags: [...(p.aiData.tags || [])] } : { tags: [] }
                }));

                try {
                    const groups = new Map();
                    updated.forEach((photo) => {
                        const clusterId = photo.aiData?.clusterId;
                        if (!clusterId || clusterId === 'screenshots') return;
                        if (photo.aiData?.category === 'Snímky obrazovky / Různé') return;
                        if (!groups.has(clusterId)) groups.set(clusterId, []);
                        groups.get(clusterId).push(photo);
                    });

                    const clusters = [...groups.values()].filter((items) => items.some((photo) => photo.aiData?.eventNameSource !== 'manual'));
                    if (clusters.length === 0) {
                        setMessage({ title: t("Nic k pojmenování", "Nothing to name"), text: t("Všechny události už mají ruční název.", "All events already have manual names.") });
                        setIsAnalyzing(false);
                        setAnalyzingProgress(0);
                        setProgress('');
                        return;
                    }

                    const clusterSummaries = clusters.map((cluster, index) => {
                        const locations = [...new Set(cluster.map((p) => p.hardData?.location).filter((location) => location && location !== 'Neznámé místo'))];
                        const tags = [...new Set(cluster.flatMap((p) => p.aiData?.tags || []))].filter((tag) => !AUTO_TAG_VALUES.has(tag));

                        return {
                            id: index.toString(),
                            pocet_fotek: cluster.length,
                            datum: `${cluster[0].hardData.dateStr} - ${cluster[cluster.length - 1].hardData.dateStr}`,
                            cas: `${cluster[0].hardData.timeStr || ''} - ${cluster[cluster.length - 1].hardData.timeStr || ''}`,
                            lokace: locations.slice(0, 3).join(', '),
                            tagy: tags.slice(0, 8).join(', ')
                        };
                    });

                    const homeContext = homeLocation ? `\n\nDŮLEŽITÉ: Uživatel má domov v lokaci: "${homeLocation}". Pokud je hlavní lokací fotek tento domov, NEPOUŽÍVEJ názvy jako "Výlet" nebo "Dovolená". Místo toho událost pojmenuj "Doma", "Běžný den" nebo "Oslava doma".` : '';

                    const askTextModel = async (promptText) => {
                        if (isGeminiModel) {
                            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiApiKey },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: promptText }] }],
                                    generationConfig: { response_mime_type: "application/json", maxOutputTokens: 8192 }
                                })
                            });
                            const result = await res.json().catch(() => ({}));
                            if (!res.ok || result.error) throw new Error(result?.error?.message || `Gemini HTTP ${res.status}`);

                            const candidate = result?.candidates?.[0];
                            const text = (candidate?.content?.parts || [])
                                .filter((part) => !part.thought)
                                .map((part) => part.text || '')
                                .join('')
                                .trim();
                            if (!text) {
                                const reason = candidate?.finishReason || result?.promptFeedback?.blockReason;
                                throw new Error(`Gemini nevrátil text${reason ? ` (${reason})` : ''}.`);
                            }
                            return text;
                        }

                        const res = await fetch('http://localhost:11434/api/generate', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                model: modelToUse, prompt: promptText, stream: false, format: 'json',
                                options: { temperature: 0.2, num_predict: 1024 }
                            })
                        });
                        const result = await res.json().catch(() => ({}));
                        if (!res.ok || result.error) throw new Error(result?.error || `Ollama HTTP ${res.status}`);
                        return result?.response || "";
                    };

                    const buildPrompt = (batch, ids = null) => {
                        const effectiveIds = ids || batch.map((_, index) => index);
                        const keys = effectiveIds.map((id) => `"${id}"`).join(', ');
                        const data = batch.map((summary, index) => ({ ...summary, id: String(effectiveIds[index]) }));
                        const example = effectiveIds.slice(0, 2).map((id, index) => `"${id}": "${index === 0 ? 'Dovolená Itálie' : 'Oslava narozenin'}"`).join(', ');

                        return `Jsi profesionální archivář. Vytvoř krátký a výstižný název pro každou složku s fotkami.${homeContext}
PRAVIDLA:
- Vrať POUZE validní JSON objekt, žádný text před ním ani po něm.
- Objekt musí mít přesně ${batch.length} klíčů: ${keys}.
- Hodnotou každého klíče je název složky v češtině, maximálně 6 slov.
- Pokud je známá lokace, použij ji v názvu (např. "Výlet Kutná Hora").
- Názvy musí být vzájemně různé.
- Nepoužívej obecné názvy jako "Archiv", "Událost" nebo "Fotky".

PŘÍKLAD ODPOVĚDI: {${example}}

DATA: ${JSON.stringify(data)}`;
                    };

                    const BATCH_SIZE = 20;
                    const finalNames = {};
                    for (let start = 0; start < clusterSummaries.length; start += BATCH_SIZE) {
                        const batch = clusterSummaries.slice(start, start + BATCH_SIZE);
                        setProgress(t(
                            `Pojmenovávám události ${start + 1}-${Math.min(start + batch.length, clusterSummaries.length)} z ${clusterSummaries.length}...`,
                            `Naming events ${start + 1}-${Math.min(start + batch.length, clusterSummaries.length)} of ${clusterSummaries.length}...`
                        ));

                        let names = {};
                        try {
                            names = normalizeNameMap(extractJson(await askTextModel(buildPrompt(batch))), batch.length);
                        } catch (e) {
                            console.warn('AI naming batch failed', e);
                        }

                        const missing = batch.map((_, index) => index).filter((index) => !names[String(index)]);
                        if (missing.length > 0) {
                            try {
                                const retryBatch = missing.map((index) => batch[index]);
                                const retryNames = normalizeNameMap(
                                    extractJson(await askTextModel(buildPrompt(retryBatch, missing))),
                                    batch.length,
                                    missing
                                );
                                names = { ...names, ...retryNames };
                            } catch (e) {
                                console.warn('AI naming retry failed', e);
                            }
                        }

                        batch.forEach((summary, localIndex) => {
                            const name = names[String(localIndex)];
                            if (name) finalNames[summary.id] = name;
                        });
                    }

                    if (Object.keys(finalNames).length === 0) {
                        throw new Error(t(
                            'AI nevrátila žádné použitelné názvy událostí. Zkuste jiný model nebo zkontrolujte, že Ollama běží.',
                            'The AI returned no usable event names. Try another model or make sure Ollama is running.'
                        ));
                    }

                    setAnalyzingProgress(80);
                    setProgress(t('Aplikuji názvy na fotky...', 'Applying names to photos...'));

                    const indexById = new Map(updated.map((photo, photoIndex) => [photo.id, photoIndex]));
                    let changesCount = 0;
                    let fallbackCount = 0;
                    const usedBaseNames = new Set();

                    clusters.forEach((cluster, index) => {
                        const aiName = finalNames[index.toString()];
                        if (!aiName) fallbackCount += 1;
                        let baseName = cleanEventName(aiName || buildFallbackEventName(cluster)) || 'Nezařazená událost';
                        baseName = cleanEventName(baseName.split('/').pop());

                        let uniqueName = baseName;
                        if (usedBaseNames.has(uniqueName)) {
                            let counter = 2;
                            while (usedBaseNames.has(`${baseName} (${counter})`)) counter += 1;
                            uniqueName = `${baseName} (${counter})`;
                        }
                        usedBaseNames.add(uniqueName);

                        cluster.forEach((photo) => {
                            if (photo.aiData?.eventNameSource === 'manual') return;
                            const idx = indexById.get(photo.id) ?? -1;
                            if (idx === -1) return;
                            const currentName = updated[idx].aiData?.event_name || '';
                            const parentParts = currentName.split('/').slice(0, -1).map(cleanEventName).filter(Boolean);
                            const eventName = [...parentParts, uniqueName].join('/');
                            updated[idx].aiData = {
                                ...updated[idx].aiData,
                                event_name: eventName,
                                eventNameSource: aiName ? 'ai' : 'placeholder',
                                category: 'Událost'
                            };
                            changesCount += 1;
                        });
                    });

                    setAnalyzingProgress(100);
                    setPhotos([...updated]);
                    const fallbackNote = fallbackCount > 0
                        ? t(` ${fallbackCount} událostí dostalo náhradní název podle místa a data.`, ` ${fallbackCount} events received fallback names based on location and date.`)
                        : '';
                    setMessage({
                        title: t("Události pojmenovány", "Events named"),
                        text: t(
                            `AI pojmenovala ${clusters.length - fallbackCount} událostí. Aktualizováno ${changesCount} fotek.${fallbackNote}`,
                            `AI named ${clusters.length - fallbackCount} events. Updated ${changesCount} photos.${fallbackNote}`
                        )
                    });
                } catch (e) {
                    setMessage({ title: t("Chyba AI", "AI Error"), text: e.message });
                }

                setIsAnalyzing(false);
                setAnalyzingProgress(0);
                setProgress('');
            };

            const runPhase4 = async () => {
                if (photos.length === 0) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Nejprve nahrajte složku s fotkami.", "Please load a photo folder first.") });
                    return;
                }

                const modelToUse = visionModel === 'custom' ? visionModelCustom.trim() : visionModel;
                if (!modelToUse) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model pro vizi.", "Select a vision model.") });
                    return;
                }

                const modelError = await ensureOllamaModel(modelToUse);
                if (modelError) {
                    setMessage({ title: t("Chyba modelu", "Model error"), text: modelError });
                    return;
                }

                setIsMoondreaming(true);
                setProgress(t('Analyzuji fotky...', 'Analyzing photos...'));

                const updated = photos.map((p) => ({
                    ...p,
                    aiData: p.aiData ? { ...p.aiData, tags: [...(p.aiData.tags || [])] } : { tags: [] }
                }));

                const prompt = "Describe this image briefly. Mention the main objects, colors and setting.";

                let processed = 0;
                let failed = 0;
                let skipped = 0;
                let lastError = null;

                for (let i = 0; i < updated.length; i++) {
                    const p = updated[i];
                    if (!p.url || p.aiData?.category === '🗑️ K vymazání') {
                        skipped += 1;
                        continue;
                    }

                    setProgress(t(`Analyzuji ${i + 1}/${updated.length}...`, `Analyzing ${i + 1}/${updated.length}...`));

                    try {
                        const tags = await requestVisionTags(p.url, modelToUse, prompt);
                        updated[i].aiData = {
                            ...updated[i].aiData,
                            tags: [...new Set([...(updated[i].aiData?.tags || []), ...tags])]
                        };
                        processed += 1;
                    } catch (e) {
                        failed += 1;
                        console.warn(`Vision tagging failed for ${p.name}:`, e);
                    }

                    if (i % 5 === 0) setPhotos([...updated]);
                }

                setPhotos([...updated]);
                setIsMoondreaming(false);
                setProgress('');
                setMessage({
                    title: t("Vizuální tagy", "Visual Tags"),
                    text: t(
                        `Otagováno ${processed} fotek. Selhalo ${failed}, přeskočeno ${skipped}.`,
                        `Tagged ${processed} photos. Failed ${failed}, skipped ${skipped}.`
                    )
                });
            };

            const runSingleMoondream = async (e, photoId) => {
                e.stopPropagation();

                const modelToUse = visionModel === 'custom' ? visionModelCustom.trim() : visionModel;
                if (!modelToUse) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model pro vizi.", "Select a vision model.") });
                    return;
                }

                const p = photos.find((x) => x.id === photoId);
                if (!p || !p.url) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Pro tuto fotku není dostupný náhled. Zkuste nejprve načíst složku nebo použít jiný formát.", "No preview is available for this photo. Try reloading the folder or another format.") });
                    return;
                }

                const prompt = "Describe this image briefly. Mention the main objects, colors and setting.";

                setAnalyzingPhotoId(photoId);
                try {
                    const tags = await requestVisionTags(p.url, modelToUse, prompt);
                    setPhotos((prev) => prev.map((item) => {
                        if (item.id === photoId) {
                            return { ...item, aiData: { ...item.aiData, tags: [...new Set([...(item.aiData?.tags || []), ...tags])] } };
                        }
                        return item;
                    }));
                } catch (err) {
                    console.error(err);
                    setMessage({ title: t("Chyba vize", "Vision error"), text: err.message });
                }

                setAnalyzingPhotoId(null);
            };

            const startTinder = () => {
                const queue = filteredPhotos.filter(p => p.aiData?.category !== '🗑️ K vymazání');
                if (queue.length === 0) return;
                setTinderQueue(queue);
                setTinderIndex(0);
                setShowTinder(true);
            };

            const handleTinderSwipe = (keep) => {
                const current = tinderQueue[tinderIndex];
                if (!current) {
                    setShowTinder(false);
                    return;
                }
                if (!keep) {
                    setPhotos(prev => prev.map(p => p.id === current.id ? { 
                        ...p, aiData: { ...p.aiData, category: '🗑️ K vymazání', event_name: 'Vyřazeno' } 
                    } : p));
                }
                if (tinderIndex + 1 < tinderQueue.length) setTinderIndex(tinderIndex + 1);
                else setShowTinder(false);
            };

            // EXPORT NA DISK VČETNĚ ADOBE LIGHTROOM XMP SIDECAR SOUBORŮ
            const exportToDisk = async () => {
                if (!window.showDirectoryPicker) { setMessage({ title: "Chyba", text: "Prohlížeč nepodporuje export." }); return; }
                try {
                    const rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    const usedNamesByFolder = new Map();
                    let exportedCount = 0;

                    for (const p of photos) {
                        if (p.aiData?.category === '🗑️ K vymazání') continue;
                        if (!p.file) continue;

                        let folderPath = p.aiData?.event_name || p.hardData?.location || "Ostatní";
                        if (p.aiData?.category === 'Snímky obrazovky / Různé' || p.aiData?.tags?.includes('Screenshot')) {
                            folderPath = "Snímky obrazovky";
                        }

                        const folderParts = folderPath.split('/').map(sanitizeSegment).filter(Boolean);
                        if (folderParts.length === 0) folderParts.push('Ostatní');
                        folderPath = folderParts.join('/');

                        let currentHandle = rootHandle;
                        for (const part of folderParts) {
                            currentHandle = await currentHandle.getDirectoryHandle(part, { create: true });
                        }

                        if (!usedNamesByFolder.has(folderPath.toLowerCase())) {
                            usedNamesByFolder.set(folderPath.toLowerCase(), new Set());
                        }
                        const usedNames = usedNamesByFolder.get(folderPath.toLowerCase());

                        // 1. Uložení samotného obrázku (s ošetřením duplicitních názvů)
                        const safeFileName = makeUniqueFileName(sanitizeSegment(p.name), usedNames);
                        const fileHandle = await currentHandle.getFileHandle(safeFileName, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write(p.file);
                        await writable.close();

                        // 2. Vygenerování a uložení .XMP sidecar souboru pro Lightroom
                        const tags = [...new Set(p.aiData?.tags || [])];
                        const location = p.hardData?.location || '';
                        const eventName = p.aiData?.event_name || '';
                        const tagItems = tags.map(tag => `<rdf:li>${escapeXml(tag)}</rdf:li>`);
                        if (eventName) tagItems.push(`<rdf:li>${escapeXml(eventName)}</rdf:li>`);

                        const xmpContent = `<?xpacket begin="" id="W5M0MpCehiHzreSzNTczkc9d"?>
<x:xmpmeta xmlns:x="adobe:ns:meta/" x:xmptk="Adobe XMP Core 7.0-c000 1.000000, 2021/01/01-00:00:00">
 <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
  <rdf:Description rdf:about=""
    xmlns:dc="http://purl.org/dc/elements/1.1/"
    xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/">
   <dc:subject>
    <rdf:Bag>
     ${tagItems.join('\n     ')}
    </rdf:Bag>
   </dc:subject>
   <photoshop:City>${escapeXml(location)}</photoshop:City>
  </rdf:Description>
 </rdf:RDF>
</x:xmpmeta>
<?xpacket end="w"?>`;

                        const [baseName] = splitExtension(safeFileName);
                        const xmpFileName = makeUniqueFileName(`${baseName}.xmp`, usedNames);
                        const xmpHandle = await currentHandle.getFileHandle(xmpFileName, { create: true });
                        const xmpWritable = await xmpHandle.createWritable();
                        await xmpWritable.write(xmpContent);
                        await xmpWritable.close();
                        exportedCount += 1;
                    }

                    setShowExportModal(false);
                    setMessage({ title: "Export hotov!", text: `Uloženo ${exportedCount} fotek včetně Adobe Lightroom XMP souborů.` });
                } catch (e) { setMessage({ title: "Chyba exportu", text: e.message }); }
            };

            const handleRename = () => {
                const { oldName, newName, type } = renameModal;
                if (!newName.trim()) return;
                
                if (type === 'event') {
                    const oldPrefix = oldName + '/';
                    const parts = oldName.split('/');
                    parts[parts.length - 1] = newName.trim().replace(/\//g, '-');
                    const newFullPath = parts.join('/');
                    const newPrefix = newFullPath + '/';

                    setPhotos(prev => prev.map(p => {
                        const ev = p.aiData?.event_name || '';
                        if (ev === oldName) {
                            return { ...p, aiData: { ...p.aiData, event_name: newFullPath, eventNameSource: 'manual' } };
                        } else if (ev.startsWith(oldPrefix)) {
                            return { ...p, aiData: { ...p.aiData, event_name: newPrefix + ev.substring(oldPrefix.length), eventNameSource: 'manual' } };
                        }
                        return p;
                    }));
                    
                    setCustomFolders(prev => prev.map(f => {
                        if (f === oldName) return newFullPath;
                        if (f.startsWith(oldPrefix)) return newPrefix + f.substring(oldPrefix.length);
                        return f;
                    }));

                    setActiveFilters(prev => prev.map(f => {
                        if (f.startsWith('event-')) {
                            const ev = f.replace('event-', '');
                            if (ev === oldName) return `event-${newFullPath}`;
                            if (ev.startsWith(oldPrefix)) return `event-${newPrefix + ev.substring(oldPrefix.length)}`;
                        }
                        return f;
                    }));
                } else if (type === 'tag') {
                    setPhotos(prev => prev.map(p => {
                        if (p.aiData?.tags?.includes(oldName)) {
                            return { ...p, aiData: { ...p.aiData, tags: p.aiData.tags.map(t => t === oldName ? newName : t) } };
                        }
                        return p;
                    }));
                    setActiveFilters(prev => prev.map(f => f === `tag-${oldName}` ? `tag-${newName}` : f));
                }

                setRenameModal({ isOpen: false, oldName: '', newName: '', type: 'tag' });
            };

            const toggleSelection = (id, e) => {
                const newSel = new Set(selectedPhotos);
                
                if (e && e.shiftKey && lastSelectedId) {
                    const visibleIds = filteredPhotos.map(p => p.id);
                    const lastIdx = visibleIds.indexOf(lastSelectedId);
                    const currIdx = visibleIds.indexOf(id);
                    
                    if (lastIdx !== -1 && currIdx !== -1) {
                        const start = Math.min(lastIdx, currIdx);
                        const end = Math.max(lastIdx, currIdx);
                        for (let i = start; i <= end; i++) {
                            newSel.add(visibleIds[i]);
                        }
                    }
                } else {
                    if (newSel.has(id)) {
                        newSel.delete(id);
                    } else {
                        newSel.add(id);
                        setLastSelectedId(id);
                    }
                }
                setSelectedPhotos(newSel);
            };

            const toggleSelectAll = () => {
                if (selectedPhotos.size === filteredPhotos.length) {
                    setSelectedPhotos(new Set()); 
                } else {
                    setSelectedPhotos(new Set(filteredPhotos.map(p => p.id))); 
                }
            };

            const handleBulkEdit = () => {
                if (!bulkModal.value.trim()) return;
                const val = bulkModal.value.trim();
                const type = bulkModal.type;
                const selectedIds = new Set(selectedPhotos);
                const targetClusterIds = new Set(
                    photos
                        .filter((p) => selectedIds.has(p.id))
                        .map((p) => p.aiData?.clusterId)
                        .filter((clusterId) => clusterId && clusterId !== 'screenshots')
                );

                const idsToUpdate = new Set(selectedIds);
                if (type === 'event' || type === 'parent-event' || type === 'location') {
                    targetClusterIds.forEach((clusterId) => {
                        photos.forEach((p) => {
                            if (p.aiData?.clusterId === clusterId) idsToUpdate.add(p.id);
                        });
                    });
                }

                // Photos near the edited photo that have no location of their own inherit it.
                const inheritedIds = new Set();
                if (type === 'location') {
                    findLocationInheritanceTargets(photos, idsToUpdate).forEach((id) => {
                        idsToUpdate.add(id);
                        inheritedIds.add(id);
                    });
                }
                const count = idsToUpdate.size;

                setPhotos(prev => prev.map(p => {
                    if (!idsToUpdate.has(p.id)) return p;
                    const updated = { ...p };
                    if (!updated.aiData) updated.aiData = {};
                    if (!updated.hardData) updated.hardData = { location: 'Neznámé místo' };

                    if (type === 'event') {
                        updated.aiData.event_name = val;
                        updated.aiData.eventNameSource = 'manual';
                    } else if (type === 'parent-event') {
                        const current = updated.aiData.event_name || 'Nezařazeno';
                        const base = current.includes('/') ? current.split('/').pop() : current;
                        updated.aiData.event_name = `${val}/${base}`;
                    } else if (type === 'location') {
                        const isInherited = inheritedIds.has(p.id);
                        const oldLocation = updated.hardData.location;
                        updated.hardData.location = val;
                        updated.hardData.locationKey = normalizeLocationName(val);
                        updated.hardData.coords = null;
                        updated.hardData.locationSource = isInherited ? 'inherited' : 'manual';

                        let tags = (updated.aiData.tags || []).filter(t => t !== oldLocation && t !== 'Neznámé místo' && t !== '#Neznámé místo');
                        tags.push(val);
                        updated.aiData.tags = [...new Set(tags)];

                        // Only the explicitly edited cluster gets its placeholder folder renamed.
                        if (!isInherited && updated.aiData.eventNameSource === 'placeholder' && isPlaceholderEventName(updated.aiData.event_name || '')) {
                            const parentParts = (updated.aiData.event_name || '').split('/').slice(0, -1).map(cleanEventName).filter(Boolean);
                            const placeholder = buildPlaceholderEventName((updated.aiData.clusterNumber || 1) - 1, val);
                            updated.aiData.event_name = [...parentParts, placeholder].join('/');
                        }
                    } else if (type === 'tag') {
                        updated.aiData.tags = [...new Set([...(updated.aiData.tags || []), val])];
                    }
                    return updated;
                }));

                setSelectedPhotos(new Set());
                setBulkModal({ isOpen: false, type: '', value: '' });
                const inheritedNote = type === 'location' && inheritedIds.size > 0
                    ? t(`, z toho ${inheritedIds.size} blízkých fotek bez vlastní lokace`, `, including ${inheritedIds.size} nearby photos without their own location`)
                    : '';
                setMessage({
                    title: t("Hotovo", "Done"),
                    text: t(
                        `Hromadná úprava aplikována na ${count} fotek (včetně celých událostí)${inheritedNote}.`,
                        `Bulk edit applied to ${count} photos (including whole events)${inheritedNote}.`
                    )
                });
            };

            const filteredPhotos = useMemo(() => {
                let res = photos;
                const folderFilters = activeFilters.filter(f => f.startsWith('event-')).map(f => f.replace('event-', ''));
                const tagFilters = activeFilters.filter(f => f.startsWith('tag-')).map(f => f.replace('tag-', ''));
                const screenshotFilter = activeFilters.includes('screenshots');

                if (folderFilters.length > 0 || tagFilters.length > 0 || screenshotFilter) {
                    res = res.filter(p => {
                        let passFolder = folderFilters.length === 0;
                        if (folderFilters.length > 0) {
                            const pEvent = p.aiData?.event_name || '';
                            passFolder = folderFilters.some(event => pEvent === event || pEvent.startsWith(event + '/'));
                        }

                        // Sčítací OR logika pro Tagy (pokud je vybráno Noc a Švýcarsko, stačí aby fotka měla jedno z toho)
                        let passTag = tagFilters.length === 0;
                        if (tagFilters.length > 0) {
                            passTag = tagFilters.some(t => (p.aiData?.tags || []).includes(t) || p.hardData?.timelineLoc === t);
                        }

                        let passScreenshot = true;
                        if (screenshotFilter) {
                            passScreenshot = p.aiData?.category === 'Snímky obrazovky / Různé';
                        }

                        // Mezi kategoriemi (Složka vs Tag) platí AND
                        return passFolder && passTag && passScreenshot;
                    });
                }

                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    res = res.filter(p => p.name.toLowerCase().includes(q) || p.hardData?.location?.toLowerCase().includes(q) || p.aiData?.event_name?.toLowerCase().includes(q));
                }
                return res;
            }, [photos, activeFilters, searchQuery]);

            const allTags = useMemo(() => {
                const s = new Set();
                photos.forEach(p => {
                    if (p.aiData?.tags) p.aiData.tags.forEach(t => s.add(t));
                    if (p.hardData?.timelineLoc) s.add(p.hardData.timelineLoc);
                });
                return Array.from(s).sort();
            }, [photos]);

            const allEvents = useMemo(() => {
                const s = new Set(customFolders);
                photos.forEach(p => {
                    if (p.aiData?.event_name) s.add(p.aiData.event_name);
                });
                return Array.from(s).sort();
            }, [photos, customFolders]);

            // REKURZIVNÍ STROM (Podpora nekonečného zanoření)
            const nestedTree = useMemo(() => {
                const root = { children: {}, fullPath: '', name: 'root' };
                allEvents.forEach(path => {
                    if (!path) return;
                    const parts = path.split('/');
                    let current = root;
                    let currentPath = '';
                    parts.forEach(part => {
                        currentPath = currentPath ? `${currentPath}/${part}` : part;
                        if (!current.children[part]) {
                            current.children[part] = { name: part, fullPath: currentPath, children: {} };
                        }
                        current = current.children[part];
                    });
                });
                return root.children;
            }, [allEvents]);

            const renderFolderNode = (node) => {
                const isActive = activeFilters.includes(`event-${node.fullPath}`);
                const hasChildren = Object.keys(node.children).length > 0;
                return (
                    <div key={node.fullPath} className="pl-3 mt-1 text-xs">
                        <div 
                            draggable
                            onDragStart={(e) => handleFolderDragStart(e, node.fullPath)}
                            onDragOver={handleDragOver}
                            onDrop={(e) => handleDropOnEvent(e, node.fullPath)}
                            className={`group flex items-center justify-between p-1.5 rounded cursor-pointer transition-colors ${isActive ? 'bg-rose-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                        >
                            <div 
                                onClick={() => setActiveFilters(p => p.includes(`event-${node.fullPath}`) ? p.filter(f => f !== `event-${node.fullPath}`) : [...p, `event-${node.fullPath}`])}
                                className="flex items-center gap-1.5 truncate flex-1"
                            >
                                <span>{hasChildren ? '📂' : '📁'}</span> 
                                <span className={hasChildren ? "font-bold" : ""}>{node.name}</span>
                            </div>
                            <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100">
                                <button onClick={(e) => { e.stopPropagation(); handleWrapFolder(node.fullPath); }} className="text-[10px] px-1 hover:text-orange-400" title="Zabalit do nadřazené složky (Vytvořit parent)">📦</button>
                                <button onClick={(e) => { e.stopPropagation(); handleAddFolder(node.fullPath); }} className="text-[10px] px-1 hover:text-emerald-400" title="Přidat podsložku (Vytvořit child)">➕</button>
                                <button onClick={(e) => { e.stopPropagation(); setRenameModal({ isOpen: true, oldName: node.fullPath, newName: node.name, type: 'event' }); }} className="text-[10px] px-1 hover:text-blue-400" title="Přejmenovat">✏️</button>
                            </div>
                        </div>
                        {hasChildren && (
                            <div className="border-l border-slate-700/50 ml-2">
                                {Object.values(node.children).map(child => renderFolderNode(child))}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    <div className="w-80 bg-slate-900 border-r border-slate-800 flex flex-col">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold text-orange-400">⚡ Clustr</h1>
                            <p className="text-[10px] text-slate-500 uppercase tracking-wider">{t("AI třídění fotek", "AI Photo Sorter")}</p>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-6 custom-scrollbar">
                            <div className="space-y-2">
                                <input type="file" ref={fileInputRef} webkitdirectory="" directory="" multiple className="hidden" onChange={handleFolder} />
                                <button onClick={() => fileInputRef.current.click()} className="w-full bg-slate-800 p-2 rounded text-sm text-white hover:bg-slate-700">{t("📂 Nahrát složku", "📂 Upload Folder")}</button>
                                <input type="file" ref={timelineInputRef} accept=".json" className="hidden" onChange={handleTimeline} />
                                <button onClick={() => timelineInputRef.current.click()} disabled={isTimelineLoading} className="w-full bg-emerald-900/40 p-2 rounded text-sm text-emerald-200 hover:bg-emerald-800/50 disabled:opacity-50 transition-opacity">
                                    {isTimelineLoading ? t("⏳ Zpracovávám JSON...", "⏳ Processing JSON...") : (timelineData ? t(`🌍 Timeline (${timelineData.length})`, `🌍 Timeline (${timelineData.length})`) : t("🌍 Timeline JSON", "🌍 Timeline JSON"))}
                                </button>
                            </div>
                            
                            {photos.length > 0 && (
                                <div className="space-y-4">
                                    <div className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                                        <div className="text-[10px] text-slate-500 mb-2 uppercase font-bold">{t("1. EXIF metadata (volitelné)", "1. EXIF metadata (optional)")}</div>
                                        <button onClick={runPhase1} disabled={isExtracting} className="w-full bg-blue-600 p-2 rounded text-xs text-white hover:bg-blue-500 disabled:bg-slate-700">
                                            {isExtracting ? (progress || t('Zpracovávám...', 'Processing...')) : t('📍 Načíst EXIF', '📍 Extract EXIF')}
                                        </button>
                                    </div>

                                    <div className="p-3 bg-slate-950 rounded-lg border border-slate-800 space-y-2">
                                        <div className="text-[10px] text-slate-500 mb-1 uppercase font-bold">{t("2. Seskupení podle času a místa", "2. Group by Time & Location")}</div>
                                        <div className="text-[10px] text-slate-500 leading-relaxed">
                                            {t("Načte EXIF, přiřadí lokaci z Timeline podle času, vytvoří složky událostí a dočasné názvy. Fáze 3 je volitelná – složky můžete přejmenovat ručně.", "Reads EXIF, assigns a location from Timeline by time, creates event folders and temporary names. Phase 3 is optional – you can rename folders manually.")}
                                        </div>
                                        <button onClick={runPhase2} disabled={isGrouping} className="w-full bg-rose-600 p-2 rounded text-xs text-white hover:bg-rose-500 disabled:bg-slate-700 disabled:cursor-wait">
                                            {isGrouping ? (progress || t('⏳ Seskupuji...', '⏳ Grouping...')) : t('📸 Seskupit fotky', '📸 Group Photos')}
                                        </button>
                                    </div>

                                    <div className="p-3 bg-slate-950 rounded-lg border border-slate-800 space-y-2">
                                        <div className="text-[10px] text-slate-500 mb-1 uppercase font-bold">{t("3. AI názvy událostí (volitelné)", "3. AI Event Names (optional)")}</div>

                                        <select value={textModel} onChange={e => setTextModel(e.target.value)} className="w-full bg-slate-800 text-xs p-1 rounded border border-slate-700 text-white">
                                            <option value="llama3.2">Ollama: Llama 3.2</option>

                                    <section>
                                        <h3 className="text-lg font-bold text-white mb-2">{t('4. Timeline a export do Lightroomu', '4. Timeline and Lightroom Export')}</h3>
                                        <p>{t('Timeline JSON přiřadí lokace podle času z EXIF. Export uloží složky a XMP soubory; v Lightroomu použijte Import → Include Subfolders → Add.', 'Timeline JSON assigns locations based on EXIF time. Export writes folders and XMP files; in Lightroom use Import → Include Subfolders → Add.')}</p>
                                    </section>
                                </div>
                            </div>
                        </div>
                    )}

                    {renameModal.isOpen && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-900 p-6 rounded-xl border border-slate-700 w-full max-w-xs">
                                <div className="font-bold mb-4">{t("Přejmenovat", "Rename")} {renameModal.type === 'event' ? t('událost / složku', 'event / folder') : t('tag', 'tag')}</div>
                                <input type="text" value={renameModal.newName} onChange={e => setRenameModal({...renameModal, newName: e.target.value})} className="w-full bg-slate-800 p-2 rounded text-white mb-4 border border-slate-700" autoFocus />
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setRenameModal({ isOpen: false })} className="px-3 py-1 text-sm text-slate-400">{t("Zrušit", "Cancel")}</button>
                                    <button onClick={handleRename} className="px-3 py-1 bg-blue-600 rounded text-sm text-white">{t("Uložit", "Save")}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {message && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[200]">
                            <div className="bg-slate-900 p-6 rounded-xl border border-slate-700 text-center max-w-sm whitespace-pre-wrap">
                                <div className="font-bold mb-2">{message.title}</div>
                                <div className="text-sm text-slate-400 mb-4">{message.text}</div>
                                <button onClick={() => setMessage(null)} className="bg-blue-600 px-4 py-2 rounded text-white font-bold hover:bg-blue-500">OK</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((error) => {
                    console.warn('Service worker registration failed', error);
                });
            });
        }
    </script>
</body>
</html>
