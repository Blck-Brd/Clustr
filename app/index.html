                const resolvedModel = textModel === 'custom'
                    ? textModelCustom
                    : textModel === 'gemini-custom'
                        ? geminiModelCustom
                        : textModel;
                const modelToUse = (legacyGeminiModels[resolvedModel] || resolvedModel || '').trim();

                if (!modelToUse) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model nebo zadejte jeho název.", "Select a model or enter its name.") });
                    return;
                }
                if (isGeminiModel) {
                    if (!geminiApiKey) {
                        setMessage({ title: t("Chyba", "Error"), text: t("Pro Gemini je potřeba zadat API klíč.", "A Gemini API key is required.") });
                        return;
                    }
                } else {
                    const modelError = await ensureOllamaModel(modelToUse);
                    if (modelError) {
                        setMessage({ title: t("Chyba modelu", "Model error"), text: modelError });
                        return;
                    }
                }

                setIsAnalyzing(true);
                setAnalyzingProgress(0);
                setProgress(t('Připravuji události pro AI...', 'Preparing events for AI...'));

                const updated = photos.map((p) => ({
                    ...p,
                    hardData: p.hardData ? { ...p.hardData } : { dateStr: p.date.toLocaleDateString('cs-CZ'), location: 'Neznámé místo', camera: 'Neznámý fotoaparát' },
                    aiData: p.aiData ? { ...p.aiData, tags: [...(p.aiData.tags || [])] } : { tags: [] }
                }));

                try {
                    const namingTrips = namingLevel === 'trips';
                    const groups = new Map();

                    updated.forEach((photo) => {
                        const clusterId = photo.aiData?.clusterId;
                        if (!clusterId || clusterId === 'screenshots') return;
                        if (isScreenshotCategory(photo.aiData?.category)) return;
                        const groupKey = namingTrips ? (photo.aiData?.tripId || clusterId) : clusterId;
                        if (!groups.has(groupKey)) groups.set(groupKey, []);
                        groups.get(groupKey).push(photo);
                    });

                    const isManualForLevel = (photo) => {
                        if (namingTrips) {
                            return photo.aiData?.tripNameSource === 'manual'
                                || (photo.aiData?.tripNameSource === undefined && photo.aiData?.eventNameSource === 'manual');
                        }
                        if (photo.aiData?.eventKind === 'trip-stop') {
                            return photo.aiData?.stopNameSource === 'manual'
                                || (photo.aiData?.stopNameSource === undefined && photo.aiData?.eventNameSource === 'manual');
                        }
                        return photo.aiData?.tripNameSource === 'manual'
                            || (photo.aiData?.tripNameSource === undefined && photo.aiData?.eventNameSource === 'manual');
                    };

                    const clusters = [...groups.values()].filter((items) => items.some((photo) => !isManualForLevel(photo)));
                    if (clusters.length === 0) {
                        setMessage({ title: t("Nic k pojmenování", "Nothing to name"), text: t("Všechny události už mají ruční název.", "All events already have manual names.") });
                        setIsAnalyzing(false);
                        setAnalyzingProgress(0);
                        setProgress('');
                        return;
                    }

                    const clusterSummaries = clusters.map((cluster, index) => {
                        const locations = [...new Set(cluster.map((p) => p.hardData?.location).filter((location) => location && location !== 'Neznámé místo'))];
                        const tags = [...new Set(cluster.flatMap((p) => p.aiData?.tags || []))].filter((tag) => !AUTO_TAG_VALUES.has(tag));

                        return {
                            id: index.toString(),
                            pocet_fotek: cluster.length,
                            datum: `${cluster[0].hardData.dateStr} - ${cluster[cluster.length - 1].hardData.dateStr}`,
                            cas: `${cluster[0].hardData.timeStr || ''} - ${cluster[cluster.length - 1].hardData.timeStr || ''}`,
                            lokace: locations.slice(0, 3).join(', '),
                            tagy: tags.slice(0, 8).join(', ')
                        };
                    });

                    const homeContext = homeLocation ? `\n\nDŮLEŽITÉ: Uživatel má domov v lokaci: "${homeLocation}". Pokud je hlavní lokací fotek tento domov, NEPOUŽÍVEJ názvy jako "Výlet" nebo "Dovolená". Místo toho událost pojmenuj "Doma", "Běžný den" nebo "Oslava doma".` : '';

                    const askTextModel = async (promptText) => {
                        if (isGeminiModel) {
                            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiApiKey },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: promptText }] }],
                                    generationConfig: { response_mime_type: "application/json", maxOutputTokens: 8192 }
                                })
                            });
                            const result = await res.json().catch(() => ({}));
                            if (!res.ok || result.error) throw new Error(result?.error?.message || `Gemini HTTP ${res.status}`);

                            const candidate = result?.candidates?.[0];
                            const text = (candidate?.content?.parts || [])
                                .filter((part) => !part.thought)
                                .map((part) => part.text || '')
                                .join('')
                                .trim();
                            if (!text) {
                                const reason = candidate?.finishReason || result?.promptFeedback?.blockReason;
                                throw new Error(`Gemini nevrátil text${reason ? ` (${reason})` : ''}.`);
                            }
                            return text;
                        }

                        const res = await fetch('http://localhost:11434/api/generate', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                model: modelToUse, prompt: promptText, stream: false, format: 'json',
                                options: { temperature: 0.2, num_predict: 1024 }
                            })
                        });
                        const result = await res.json().catch(() => ({}));
                        if (!res.ok || result.error) throw new Error(result?.error || `Ollama HTTP ${res.status}`);
                        return result?.response || "";
                    };

                    const buildPrompt = (batch, ids = null) => {
                        const effectiveIds = ids || batch.map((_, index) => index);
                        const keys = effectiveIds.map((id) => `"${id}"`).join(', ');
                        const data = batch.map((summary, index) => ({ ...summary, id: String(effectiveIds[index]) }));
                        const example = effectiveIds.slice(0, 2).map((id, index) => `"${id}": "${index === 0 ? 'Dovolená Itálie' : 'Oslava narozenin'}"`).join(', ');

                        return `Jsi profesionální archivář. Vytvoř krátký a výstižný název pro každou složku s fotkami.${homeContext}
PRAVIDLA:
- Vrať POUZE validní JSON objekt, žádný text před ním ani po něm.
- Objekt musí mít přesně ${batch.length} klíčů: ${keys}.
- Hodnotou každého klíče je název složky v češtině, maximálně 6 slov.
- Pokud je známá lokace, použij ji v názvu (např. "Výlet Kutná Hora").
- Názvy musí být vzájemně různé.
- Nepoužívej obecné názvy jako "Archiv", "Událost" nebo "Fotky".

PŘÍKLAD ODPOVĚDI: {${example}}

DATA: ${JSON.stringify(data)}`;
                    };

                    const BATCH_SIZE = 20;
                    const finalNames = {};
                    for (let start = 0; start < clusterSummaries.length; start += BATCH_SIZE) {
                        const batch = clusterSummaries.slice(start, start + BATCH_SIZE);
                        setProgress(t(
                            `Pojmenovávám události ${start + 1}-${Math.min(start + batch.length, clusterSummaries.length)} z ${clusterSummaries.length}...`,
                            `Naming events ${start + 1}-${Math.min(start + batch.length, clusterSummaries.length)} of ${clusterSummaries.length}...`
                        ));

                        let names = {};
                        try {
                            names = normalizeNameMap(extractJson(await askTextModel(buildPrompt(batch))), batch.length);
                        } catch (e) {
                            console.warn('AI naming batch failed', e);
                        }

                        const missing = batch.map((_, index) => index).filter((index) => !names[String(index)]);
                        if (missing.length > 0) {
                            try {
                                const retryBatch = missing.map((index) => batch[index]);
                                const retryNames = normalizeNameMap(
                                    extractJson(await askTextModel(buildPrompt(retryBatch, missing))),
                                    batch.length,
                                    missing
                                );
                                names = { ...names, ...retryNames };
                            } catch (e) {
                                console.warn('AI naming retry failed', e);
                            }
                        }

                        batch.forEach((summary, localIndex) => {
                            const name = names[String(localIndex)];
                            if (name) finalNames[summary.id] = name;
                        });
                    }

                    if (Object.keys(finalNames).length === 0) {
                        throw new Error(t(
                            'AI nevrátila žádné použitelné názvy událostí. Zkuste jiný model nebo zkontrolujte, že Ollama běží.',
                            'The AI returned no usable event names. Try another model or make sure Ollama is running.'
                        ));
                    }

                    setAnalyzingProgress(80);
                    setProgress(t('Aplikuji názvy na fotky...', 'Applying names to photos...'));

                    const indexById = new Map(updated.map((photo, photoIndex) => [photo.id, photoIndex]));
                    let changesCount = 0;
                    let fallbackCount = 0;
                    const usedBaseNames = new Set();

                    clusters.forEach((cluster, index) => {
                        const aiName = finalNames[index.toString()];
                        if (!aiName) fallbackCount += 1;
                        let baseName = cleanEventName(aiName || buildFallbackEventName(cluster)) || 'Nezařazená událost';
                        baseName = cleanEventName(baseName.split('/').pop());

                        let uniqueName = baseName;
                        if (usedBaseNames.has(uniqueName)) {
                            let counter = 2;
                            while (usedBaseNames.has(`${baseName} (${counter})`)) counter += 1;
                            uniqueName = `${baseName} (${counter})`;
                        }
                        usedBaseNames.add(uniqueName);

                        cluster.forEach((photo) => {
                            if (isManualForLevel(photo)) return;
                            const idx = indexById.get(photo.id) ?? -1;
                            if (idx === -1) return;

                            const currentName = updated[idx].aiData?.event_name || '';
                            const eventName = buildEventNameForNaming(currentName, uniqueName, namingTrips ? 'trips' : 'stops');

                            const sourceValue = aiName ? 'ai' : 'placeholder';
                            const nextAiData = {
                                ...updated[idx].aiData,
                                event_name: eventName,
                                eventNameSource: sourceValue,
                                category: 'Událost'
                            };
                            if (namingTrips) {
                                nextAiData.tripNameSource = sourceValue;
                            } else if (updated[idx].aiData?.eventKind === 'trip-stop') {
                                nextAiData.stopNameSource = sourceValue;
                            } else {
                                nextAiData.tripNameSource = sourceValue;
                            }
                            updated[idx].aiData = nextAiData;
                            changesCount += 1;
                        });
                    });

                    setAnalyzingProgress(100);
                    applyPhotoSnapshot(updated);
                    const fallbackNote = fallbackCount > 0
                        ? t(` ${fallbackCount} událostí dostalo náhradní název podle místa a data.`, ` ${fallbackCount} events received fallback names based on location and date.`)
                        : '';
                    const levelLabel = namingTrips ? t('cest', 'trips') : t('zastávek/událostí', 'stops/events');
                    setMessage({
                        title: t("Události pojmenovány", "Events named"),
                        text: t(
                            `AI pojmenovala ${clusters.length - fallbackCount} ${levelLabel}. Aktualizováno ${changesCount} fotek.${fallbackNote}`,
                            `AI named ${clusters.length - fallbackCount} ${levelLabel}. Updated ${changesCount} photos.${fallbackNote}`
                        )
                    });
                    setCompletedSteps((previous) => ({ ...previous, 3: true }));
                } catch (e) {
                    setMessage({ title: t("Chyba AI", "AI Error"), text: e.message });
                }

                setIsAnalyzing(false);
                setAnalyzingProgress(0);
                setProgress('');
            };

            const runPhase4 = async () => {
                if (photos.length === 0) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Nejprve nahrajte složku s fotkami.", "Please load a photo folder first.") });
                    return;
                }

                const modelToUse = visionModel === 'custom' ? visionModelCustom.trim() : visionModel;
                if (!modelToUse) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model pro vizi.", "Select a vision model.") });
                    return;
                }

                const modelError = await ensureOllamaModel(modelToUse);
                if (modelError) {
                    setMessage({ title: t("Chyba modelu", "Model error"), text: modelError });
                    return;
                }

                setIsMoondreaming(true);
                setProgress(t('Analyzuji fotky...', 'Analyzing photos...'));

                const updated = photos.map((p) => ({
                    ...p,
                    aiData: p.aiData ? { ...p.aiData, tags: [...(p.aiData.tags || [])] } : { tags: [] }
                }));

                const prompt = "Describe this image briefly. Mention the main objects, colors and setting.";

                let processed = 0;
                let failed = 0;
                let skipped = 0;
                let lastError = null;

                for (let i = 0; i < updated.length; i++) {
                    const p = updated[i];
                    if (!p.url || p.aiData?.category === '🗑️ K vymazání') {
                        skipped += 1;
                        continue;
                    }

                    setProgress(t(`Analyzuji ${i + 1}/${updated.length}...`, `Analyzing ${i + 1}/${updated.length}...`));

                    try {
                        const tags = await requestVisionTags(p.url, modelToUse, prompt);
                        updated[i].aiData = {
                            ...updated[i].aiData,
                            tags: [...new Set([...(updated[i].aiData?.tags || []), ...tags])]
                        };
                        processed += 1;
                    } catch (e) {
                        failed += 1;
                        console.warn(`Vision tagging failed for ${p.name}:`, e);
                    }

                    if (i % 5 === 0) applyPhotoSnapshot(updated);
                }

                applyPhotoSnapshot(updated);
                setIsMoondreaming(false);
                setProgress('');
                setCompletedSteps((previous) => ({ ...previous, 4: true }));
                setMessage({
                    title: t("Vizuální tagy", "Visual Tags"),
                    text: t(
                        `Otagováno ${processed} fotek. Selhalo ${failed}, přeskočeno ${skipped}.`,
                        `Tagged ${processed} photos. Failed ${failed}, skipped ${skipped}.`
                    )
                });
            };

            const runSingleMoondream = async (e, photoId) => {
                e.stopPropagation();

                const modelToUse = visionModel === 'custom' ? visionModelCustom.trim() : visionModel;
                if (!modelToUse) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model pro vizi.", "Select a vision model.") });
                    return;
                }

                const p = photos.find((x) => x.id === photoId);
                if (!p || !p.url) {
                    setMessage({ title: t("Chyba", "Error"), text: t("Pro tuto fotku není dostupný náhled. Zkuste nejprve načíst složku nebo použít jiný formát.", "No preview is available for this photo. Try reloading the folder or another format.") });
                    return;
                }

                const prompt = "Describe this image briefly. Mention the main objects, colors and setting.";

                setAnalyzingPhotoId(photoId);
                try {
                    const tags = await requestVisionTags(p.url, modelToUse, prompt);
                    setPhotos((prev) => prev.map((item) => {
                        if (item.id === photoId) {
                            return { ...item, aiData: { ...item.aiData, tags: [...new Set([...(item.aiData?.tags || []), ...tags])] } };
                        }
                        return item;
                    }));
                } catch (err) {
                    console.error(err);
                    setMessage({ title: t("Chyba vize", "Vision error"), text: err.message });
                }

                setAnalyzingPhotoId(null);
            };

            const startTinder = () => {
                const queue = filteredPhotos.filter(p => p.aiData?.category !== '🗑️ K vymazání');
                if (queue.length === 0) return;
                setTinderQueue(queue);
                setTinderIndex(0);
                setShowTinder(true);
            };

            const handleTinderSwipe = (keep) => {
                const current = tinderQueue[tinderIndex];
                if (!current) {
                    setShowTinder(false);
                    return;
                }
                if (!keep) {
                    setPhotos(prev => prev.map(p => p.id === current.id ? { 
                        ...p, aiData: { ...p.aiData, category: '🗑️ K vymazání', event_name: 'Vyřazeno' } 
                    } : p));
                }
                if (tinderIndex + 1 < tinderQueue.length) setTinderIndex(tinderIndex + 1);
                else setShowTinder(false);
            };

            const closeTour = () => {
                setShowTour(false);
                try { localStorage.setItem('clustr-tour-seen', '1'); } catch (e) {}
            };

            // Phase 5: walk photos that still lack a location, one at a time.
            const startDataFill = () => {
                const seenDays = new Set();
                const queue = [];
                photos
                    .filter(photoNeedsLocation)
                    .sort((a, b) => a.date - b.date)
                    .forEach((photo) => {
                        const key = dateKey(photo.date) || photo.id;
                        if (seenDays.has(key)) return;
                        seenDays.add(key);
                        queue.push(photo.id);
                    });

                if (queue.length === 0) {
                    setCompletedSteps((previous) => ({ ...previous, 5: true }));
                    setMessage({ title: t('Vše doplněno', 'All filled'), text: t('Všechny fotky už mají lokaci.', 'All photos already have a location.') });
                    return;
                }
                setDataFillQueue(queue);
                setDataFillIndex(0);
                setDataFillLocation('');
                setDataFillApplied(0);
                setShowDataFill(true);
            };

            const advanceDataFill = () => {
                if (dataFillIndex + 1 < dataFillQueue.length) {
                    setDataFillIndex(dataFillIndex + 1);
                    setDataFillLocation('');
                } else {
                    setShowDataFill(false);
                }
            };

            const skipDataFill = () => advanceDataFill();

            const applyDataFill = () => {
                const currentId = dataFillQueue[dataFillIndex];
                const value = dataFillLocation.trim();
                if (!currentId || !value) return;

                const anchor = photos.find((photo) => photo.id === currentId);
                if (!anchor) return;
                const nearby = findNeighborsMissingLocation(photos, anchor, dataFillWindowHours * 3600000);
                const targetIds = new Set([currentId, ...nearby]);
                setDataFillApplied((previous) => previous + targetIds.size);
                setCompletedSteps((previous) => ({ ...previous, 5: true }));

                setPhotos((previous) => previous.map((photo) => {
                    if (!targetIds.has(photo.id)) return photo;
                    const updated = {
                        ...photo,
                        hardData: { ...(photo.hardData || {}) },
                        aiData: { ...(photo.aiData || {}) }
                    };
                    const oldLocation = updated.hardData.location;
                    updated.hardData.location = value;
                    updated.hardData.locationKey = normalizeLocationName(value);
                    updated.hardData.locationSource = photo.id === currentId ? 'manual' : 'inherited';
                    updated.hardData.coords = null;
                    const tags = (updated.aiData.tags || []).filter((tag) => tag !== oldLocation && tag !== 'Neznámé místo' && tag !== '#Neznámé místo');
                    tags.push(value);
                    updated.aiData.tags = [...new Set(tags)];

                    if (updated.aiData.eventNameSource === 'placeholder' && isPlaceholderEventName(updated.aiData.event_name || '')) {
                        const parentParts = (updated.aiData.event_name || '').split('/').slice(0, -1).map(cleanEventName).filter(Boolean);
                        if (updated.aiData.eventKind === 'trip') {
                            updated.aiData.event_name = `Trip ${updated.aiData.tripNumber || 1} - ${value}`;
                        } else if (updated.aiData.eventKind === 'trip-stop') {
                            updated.aiData.event_name = [...parentParts, buildPlaceholderStopName((updated.aiData.stopNumber || 1) - 1, value)].join('/');
                        } else if (updated.aiData.eventKind !== 'home') {
                            updated.aiData.event_name = [...parentParts, buildPlaceholderEventName(placeholderEventIndex(updated.aiData), value)].join('/');
                        }
                    }

                    return updated;
                }));

                advanceDataFill();
            };

            // EXPORT NA DISK VČETNĚ ADOBE LIGHTROOM XMP SIDECAR SOUBORŮ
            const buildExportEntries = (exportPhotos) => {
                const usedNamesByFolder = new Map();

                return exportPhotos.map((p) => {
                    let folderPath = p.aiData?.event_name || p.hardData?.location || "Ostatní";
                    if (isScreenshotCategory(p.aiData?.category) || p.aiData?.tags?.includes('Screenshot')) {
                        folderPath = SCREENSHOT_FOLDER;
                    }

                    const folderParts = folderPath.split('/').map(sanitizeSegment).filter(Boolean);
                    if (folderParts.length === 0) folderParts.push('Ostatní');
                    folderPath = folderParts.join('/');

                    if (!usedNamesByFolder.has(folderPath.toLowerCase())) {
                        usedNamesByFolder.set(folderPath.toLowerCase(), new Set());
                    }
                    const usedNames = usedNamesByFolder.get(folderPath.toLowerCase());
                    const safeFileName = makeUniqueFileName(sanitizeSegment(p.name), usedNames);

                    const location = p.hardData?.location || '';
                    const eventName = p.aiData?.event_name || '';
                    const eventLeaf = eventName.split('/').filter(Boolean).pop() || '';
                    const keywords = new Set(p.aiData?.tags || []);
                    if (eventLeaf) keywords.add(eventLeaf);
                    if (location) keywords.add(location);

                    const keywordItems = [...keywords].map(tag => `<rdf:li>${escapeXml(tag)}</rdf:li>`);
                    const hierarchyItems = eventName
                        ? [`<rdf:li>${escapeXml(eventName.split('/').filter(Boolean).join('|'))}</rdf:li>`]
                        : [];

                    const xmpContent = `<?xpacket begin="" id="W5M0MpCehiHzreSzNTczkc9d"?>
<x:xmpmeta xmlns:x="adobe:ns:meta/" x:xmptk="Adobe XMP Core 7.0-c000 1.000000, 2021/01/01-00:00:00">
 <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
  <rdf:Description rdf:about=""
    xmlns:dc="http://purl.org/dc/elements/1.1/"
    xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/"
    xmlns:lr="http://ns.adobe.com/lightroom/1.0/"
    xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/">
   <dc:subject>
    <rdf:Bag>
     ${keywordItems.join('\n     ')}
    </rdf:Bag>
   </dc:subject>${hierarchyItems.length ? `
   <lr:hierarchicalSubject>
    <rdf:Bag>
     ${hierarchyItems.join('\n     ')}
    </rdf:Bag>
   </lr:hierarchicalSubject>` : ''}
   <photoshop:City>${escapeXml(location)}</photoshop:City>
   <Iptc4xmpCore:Location>${escapeXml(location)}</Iptc4xmpCore:Location>
  </rdf:Description>
 </rdf:RDF>
</x:xmpmeta>
<?xpacket end="w"?>`;

                    const [baseName] = splitExtension(safeFileName);
                    const xmpFileName = makeUniqueFileName(`${baseName}.xmp`, usedNames);

                    return { photo: p, folderParts, folderPath, fileName: safeFileName, xmpFileName, xmpContent };
                });
            };

            const finishExport = (exportedCount, mobile) => {
                setShowExportModal(false);
                setExportProgress(null);
                setMessage({
                    title: t('Export hotov!', 'Export done!'),
                    text: mobile
                        ? t(`Uloženo ${exportedCount} fotek včetně XMP do ZIPu.`, `Saved ${exportedCount} photos with XMP sidecars in a ZIP.`)
                        : t(`Uloženo ${exportedCount} fotek včetně Adobe Lightroom XMP souborů.`, `Saved ${exportedCount} photos including Adobe Lightroom XMP sidecars.`)
                });
            };

            const exportToFolder = async (entries) => {
                let rootHandle;
                try {
                    rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                } catch (e) {
                    if (e?.name !== 'AbortError') setMessage({ title: t('Chyba exportu', 'Export error'), text: e.message });
                    return;
                }

                try {
                    let exportedCount = 0;
                    for (let index = 0; index < entries.length; index += 1) {
                        const entry = entries[index];
                        setExportProgress({ done: index, total: entries.length, current: entry.fileName });

                        let currentHandle = rootHandle;
                        for (const part of entry.folderParts) {
                            currentHandle = await currentHandle.getDirectoryHandle(part, { create: true });
                        }

                        const fileHandle = await currentHandle.getFileHandle(entry.fileName, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write(entry.photo.file);
                        await writable.close();

                        const xmpHandle = await currentHandle.getFileHandle(entry.xmpFileName, { create: true });
                        const xmpWritable = await xmpHandle.createWritable();
                        await xmpWritable.write(entry.xmpContent);
                        await xmpWritable.close();
                        exportedCount += 1;

                        await new Promise((resolve) => setTimeout(resolve, 0));
                    }

                    setExportProgress({ done: entries.length, total: entries.length, current: '' });
                    await new Promise((resolve) => setTimeout(resolve, 350));
                    finishExport(exportedCount, false);
                } catch (e) {
                    setExportProgress(null);
                    setMessage({ title: t('Chyba exportu', 'Export error'), text: e.message });
                }
            };

            const exportAsZip = async (entries) => {
                const totalBytes = entries.reduce((sum, entry) => sum + (entry.photo.file?.size || 0), 0);
                if (totalBytes > 1.2 * 1024 * 1024 * 1024) {
                    setExportProgress(null);
                    setMessage({
                        title: t('Export je příliš velký', 'Export is too large'),
                        text: t('ZIP se na mobilu skládá v paměti. Vyberte méně fotek (do cca 1 GB) nebo export spusťte na PC.', 'The ZIP is built in memory on mobile. Select fewer photos (about 1 GB max) or export on a desktop.')
                    });
                    return;
                }

                try {
                    const fflate = window.fflate;
                    if (!fflate?.Zip || !fflate?.ZipPassThrough) throw new Error(t('ZIP podpora není dostupná.', 'ZIP support is not available.'));

                    const chunks = [];
                    let exportedCount = 0;
                    const zipBlob = await new Promise((resolve, reject) => {
                        const zip = new fflate.Zip((error, chunk, final) => {
                            if (error) { reject(error); return; }
                            chunks.push(chunk);
                            if (final) resolve(new Blob(chunks, { type: 'application/zip' }));
                        });

                        (async () => {
                            try {
                                for (let index = 0; index < entries.length; index += 1) {
                                    const entry = entries[index];
                                    setExportProgress({ done: index, total: entries.length, current: entry.fileName });

                                    const imageData = new Uint8Array(await entry.photo.file.arrayBuffer());
                                    const imageEntry = new fflate.ZipPassThrough([...entry.folderParts, entry.fileName].join('/'));
                                    zip.add(imageEntry);
                                    imageEntry.push(imageData, true);

                                    const xmpData = new TextEncoder().encode(entry.xmpContent);
                                    const xmpEntry = new fflate.ZipPassThrough([...entry.folderParts, entry.xmpFileName].join('/'));
                                    zip.add(xmpEntry);
                                    xmpEntry.push(xmpData, true);

                                    exportedCount += 1;
                                    await new Promise((resolveTick) => setTimeout(resolveTick, 0));
                                }
                                zip.end();
                            } catch (e) {
                                reject(e);
                            }
                        })();
                    });

                    setExportProgress({ done: entries.length, total: entries.length, current: '' });
                    const fileName = `clustr-export-${new Date().toISOString().slice(0, 10)}.zip`;
                    const shareFile = new File([zipBlob], fileName, { type: 'application/zip' });

                    let shared = false;
                    try {
                        if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
                            await navigator.share({ files: [shareFile], title: 'Clustr export' });
                            shared = true;
                        }
                    } catch (e) {
                        if (e?.name === 'AbortError') shared = true;
                    }

                    if (!shared) {
                        const url = URL.createObjectURL(zipBlob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = fileName;
                        document.body.appendChild(link);
                        link.click();
                        link.remove();
                        window.setTimeout(() => URL.revokeObjectURL(url), 60000);
                    }

                    finishExport(exportedCount, true);
                } catch (e) {
                    setExportProgress(null);
                    setMessage({ title: t('Chyba exportu', 'Export error'), text: e.message });
                }
            };

            const exportToDisk = async () => {
                const exportPhotos = photos.filter((p) => p.aiData?.category !== '🗑️ K vymazání' && p.file);
                if (exportPhotos.length === 0) {
                    setMessage({ title: t('Nic k exportu', 'Nothing to export'), text: t('Nejsou vybrány žádné fotky k exportu.', 'There are no photos to export.') });
                    return;
                }

                const entries = buildExportEntries(exportPhotos);
                setExportProgress({ done: 0, total: entries.length, current: '' });
                supportShownRef.current = true;
                try { localStorage.setItem('clustr-support-last', String(Date.now())); } catch (e) {}
                setSupportReason('export');
                if (!isMobileLayout) setShowSupport(true);

                if (isMobileLayout || !window.showDirectoryPicker) {
                    await exportAsZip(entries);
                    return;
                }

                await exportToFolder(entries);
            };

            const handleRename = () => {
                const { oldName, newName, type } = renameModal;
                if (!newName.trim()) return;
                
                if (type === 'event') {
                    const oldPrefix = oldName + '/';
                    const parts = oldName.split('/');
                    parts[parts.length - 1] = newName.trim().replace(/\//g, '-');
                    const newFullPath = parts.join('/');
                    const newPrefix = newFullPath + '/';
                    const isTopLevelRename = !oldName.includes('/');

                    setPhotos(prev => prev.map(p => {
                        const ev = p.aiData?.event_name || '';
                        if (ev === oldName) {
                            return {
                                ...p,
                                aiData: {
                                    ...p.aiData,
                                    event_name: newFullPath,
                                    eventNameSource: 'manual',
                                    tripNameSource: isTopLevelRename ? 'manual' : (p.aiData?.tripNameSource || 'placeholder'),
                                    stopNameSource: isTopLevelRename ? (p.aiData?.stopNameSource || 'placeholder') : 'manual'
                                }
                            };
                        } else if (ev.startsWith(oldPrefix)) {
                            return {
                                ...p,
                                aiData: {
                                    ...p.aiData,
                                    event_name: newPrefix + ev.substring(oldPrefix.length),
                                    eventNameSource: 'manual',
                                    tripNameSource: isTopLevelRename ? 'manual' : (p.aiData?.tripNameSource || 'placeholder'),
                                    stopNameSource: isTopLevelRename ? (p.aiData?.stopNameSource || 'placeholder') : 'manual'
                                }
                            };
                        }
                        return p;
                    }));
                    
                    setCustomFolders(prev => prev.map(f => {
                        if (f === oldName) return newFullPath;
                        if (f.startsWith(oldPrefix)) return newPrefix + f.substring(oldPrefix.length);
                        return f;
                    }));

                    setActiveFilters(prev => prev.map(f => {
                        if (f.startsWith('event-')) {
                            const ev = f.replace('event-', '');
                            if (ev === oldName) return `event-${newFullPath}`;
                            if (ev.startsWith(oldPrefix)) return `event-${newPrefix + ev.substring(oldPrefix.length)}`;
                        }
                        return f;
                    }));
                } else if (type === 'tag') {
                    setPhotos(prev => prev.map(p => {
                        if (p.aiData?.tags?.includes(oldName)) {
                            return { ...p, aiData: { ...p.aiData, tags: p.aiData.tags.map(t => t === oldName ? newName : t) } };
                        }
                        return p;
                    }));
                    setActiveFilters(prev => prev.map(f => f === `tag-${oldName}` ? `tag-${newName}` : f));
                }

                setRenameModal({ isOpen: false, oldName: '', newName: '', type: 'tag' });
            };

            const toggleSelection = (id, e) => {
                const newSel = new Set(selectedPhotos);
                
                if (e && e.shiftKey && lastSelectedId) {
                    const visibleIds = filteredPhotos.map(p => p.id);
                    const lastIdx = visibleIds.indexOf(lastSelectedId);
                    const currIdx = visibleIds.indexOf(id);
                    
                    if (lastIdx !== -1 && currIdx !== -1) {
                        const start = Math.min(lastIdx, currIdx);
                        const end = Math.max(lastIdx, currIdx);
                        for (let i = start; i <= end; i++) {
                            newSel.add(visibleIds[i]);
                        }
                    }
                } else {
                    if (newSel.has(id)) {
                        newSel.delete(id);
                    } else {
                        newSel.add(id);
                        setLastSelectedId(id);
                    }
                }
                setSelectedPhotos(newSel);
            };

            const toggleSelectAll = () => {
                if (selectedPhotos.size === filteredPhotos.length) {
                    setSelectedPhotos(new Set()); 
                } else {
                    setSelectedPhotos(new Set(filteredPhotos.map(p => p.id))); 
                }
            };

            const handleBulkEdit = () => {
                if (!bulkModal.value.trim()) return;
                const val = bulkModal.value.trim();
                const type = bulkModal.type;
                const selectedIds = new Set(selectedPhotos);
                const targetClusterIds = new Set(
                    photos
                        .filter((p) => selectedIds.has(p.id))
                        .map((p) => p.aiData?.clusterId)
                        .filter((clusterId) => clusterId && clusterId !== 'screenshots')
                );

                const targetTripIds = new Set(
                    photos
                        .filter((p) => selectedIds.has(p.id))
                        .map((p) => p.aiData?.tripId)
                        .filter(Boolean)
                );

                const idsToUpdate = new Set(selectedIds);
                if (type === 'event' || type === 'parent-event' || type === 'location') {
                    targetClusterIds.forEach((clusterId) => {
                        photos.forEach((p) => {
                            if (p.aiData?.clusterId === clusterId) idsToUpdate.add(p.id);
                        });
                    });
                }

                // A manual location applies to the whole trip window (all stops included).
                if (type === 'location') {
                    targetTripIds.forEach((tripId) => {
                        photos.forEach((p) => {
                            if (p.aiData?.tripId === tripId) idsToUpdate.add(p.id);
                        });
                    });
                }

                // Photos near the edited photo that have no location of their own inherit it.
                const inheritedIds = new Set();
                if (type === 'location') {
                    findLocationInheritanceTargets(photos, idsToUpdate).forEach((id) => {
                        idsToUpdate.add(id);
                        inheritedIds.add(id);
                    });
                }
                const count = idsToUpdate.size;
                const mergedClusterId = type === 'event' && targetClusterIds.size > 1 ? `evt-merged-${Date.now()}` : null;
                const splitClusterId = type === 'split' ? `evt-split-${Date.now()}` : null;
                const nextClusterNumber = photos.reduce((max, photo) => Math.max(max, photo.aiData?.clusterNumber || 0), 0) + 1;

                setPhotos(prev => prev.map(p => {
                    if (!idsToUpdate.has(p.id)) return p;
                    const updated = { ...p };
                    if (!updated.aiData) updated.aiData = {};
                    if (!updated.hardData) updated.hardData = { location: 'Neznámé místo' };

                    if (type === 'event') {
                        // A single event keeps its place in the trip hierarchy; selecting
                        // multiple events merges them into one standalone event.
                        updated.aiData = buildManualEventAiData(updated.aiData, val, mergedClusterId, nextClusterNumber);
                        updated.aiData.category = 'Událost';
                    } else if (type === 'split') {
                        updated.aiData = buildManualEventAiData(updated.aiData, val, splitClusterId, nextClusterNumber);
                        updated.aiData.category = 'Událost';
                    } else if (type === 'parent-event') {
                        const current = updated.aiData.event_name || 'Nezařazeno';
                        const base = current.includes('/') ? current.split('/').pop() : current;
                        updated.aiData.event_name = `${val}/${base}`;
                    } else if (type === 'location') {
                        const isInherited = inheritedIds.has(p.id);
                        const oldLocation = updated.hardData.location;
                        updated.hardData.location = val;
                        updated.hardData.locationKey = normalizeLocationName(val);
                        updated.hardData.coords = null;
                        updated.hardData.locationSource = isInherited ? 'inherited' : 'manual';

                        let tags = (updated.aiData.tags || []).filter(t => t !== oldLocation && t !== 'Neznámé místo' && t !== '#Neznámé místo');
                        tags.push(val);
                        updated.aiData.tags = [...new Set(tags)];

                        // Only the explicitly edited cluster gets its placeholder folder renamed.
                        if (!isInherited && updated.aiData.eventNameSource === 'placeholder' && isPlaceholderEventName(updated.aiData.event_name || '')) {
                            const parentParts = (updated.aiData.event_name || '').split('/').slice(0, -1).map(cleanEventName).filter(Boolean);
                            let placeholder = null;
                            if (updated.aiData.eventKind === 'trip-stop') {
                                placeholder = buildPlaceholderStopName((updated.aiData.stopNumber || 1) - 1, val);
                            } else if (updated.aiData.eventKind === 'trip') {
                                placeholder = `Trip ${updated.aiData.tripNumber || 1} - ${val}`;
                            } else if (updated.aiData.eventKind !== 'home') {
                                placeholder = buildPlaceholderEventName(placeholderEventIndex(updated.aiData), val);
                            }
                            if (placeholder) {
                                updated.aiData.event_name = [...parentParts, placeholder].join('/');
                            }
                        }
                    } else if (type === 'tag') {
                        updated.aiData.tags = [...new Set([...(updated.aiData.tags || []), val])];
                    }
                    return updated;
                }));

                setSelectedPhotos(new Set());
                setBulkModal({ isOpen: false, type: '', value: '' });
                const inheritedNote = type === 'location' && inheritedIds.size > 0
                    ? t(`, z toho ${inheritedIds.size} blízkých fotek bez vlastní lokace`, `, including ${inheritedIds.size} nearby photos without their own location`)
                    : '';
                const mergeNote = mergedClusterId ? t(" Události byly sloučeny.", " Events were merged.") : '';
                setMessage({
                    title: t("Hotovo", "Done"),
                    text: type === 'split'
                        ? t(`Odděleno ${count} fotek do nové události „${val}“.`, `Split ${count} photos into new event "${val}".`)
                        : t(
                            `Hromadná úprava aplikována na ${count} fotek (včetně celých událostí)${inheritedNote}.${mergeNote}`,
                            `Bulk edit applied to ${count} photos (including whole events)${inheritedNote}.${mergeNote}`
                        )
                });
            };

            const applyClusterNames = (keys, value, level) => {
                const keySet = new Set(keys);
                const mergeSelected = keySet.size > 1;
                const mergedId = mergeSelected ? `evt-merged-${Date.now()}` : null;

                setPhotos((previous) => {
                    const nextClusterNumber = previous.reduce((max, photo) => Math.max(max, photo.aiData?.clusterNumber || 0), 0) + 1;
                    return previous.map((photo) => {
                        const key = level === 'trips'
                            ? (photo.aiData?.tripId || photo.aiData?.clusterId)
                            : photo.aiData?.clusterId;
                        if (!keySet.has(key)) return photo;

                        if (!mergedId) {
                            const currentName = photo.aiData?.event_name || '';
                            const eventName = buildEventNameForNaming(currentName, value, level === 'trips' ? 'trips' : 'stops');
                            const nextAiData = {
                                ...photo.aiData,
                                event_name: eventName,
                                eventNameSource: 'manual'
                            };
                            if (level === 'trips') nextAiData.tripNameSource = 'manual';
                            else if (photo.aiData?.eventKind === 'trip-stop') nextAiData.stopNameSource = 'manual';
                            else nextAiData.tripNameSource = 'manual';

                            return { ...photo, aiData: nextAiData };
                        }

                        if (level === 'trips') {
                            // Merging trips keeps their stop leaves but shares one parent trip id.
                            const currentName = photo.aiData?.event_name || '';
                            const nextAiData = {
                                ...photo.aiData,
                                event_name: buildEventNameForNaming(currentName, value, 'trips'),
                                eventNameSource: 'manual',
                                tripNameSource: 'manual',
                                tripId: mergedId
                            };
                            if (photo.aiData?.eventKind !== 'trip-stop') {
                                nextAiData.clusterId = mergedId;
                                nextAiData.eventKind = 'misc';
                                nextAiData.clusterNumber = nextClusterNumber;
                                nextAiData.tripNumber = 0;
                                nextAiData.stopNumber = 0;
                                nextAiData.tripStart = null;
                                nextAiData.tripEnd = null;
                            }
                            return { ...photo, aiData: nextAiData };
                        }

                        // Merging stops/events makes one real event, not just a shared name.
                        return { ...photo, aiData: buildManualEventAiData(photo.aiData, value, mergedId, nextClusterNumber) };
                    });
                });
            };

            const applyClusterLocation = (keys, value, level) => {
                const keySet = new Set(keys);
                setPhotos((previous) => previous.map((photo) => {
                    const key = level === 'trips'
                        ? (photo.aiData?.tripId || photo.aiData?.clusterId)
                        : photo.aiData?.clusterId;
                    if (!keySet.has(key)) return photo;

                    const oldLocation = photo.hardData?.location;
                    const nextHardData = {
                        ...(photo.hardData || {}),
                        location: value,
                        locationKey: normalizeLocationName(value),
                        locationSource: 'manual',
                        coords: null
                    };
                    const nextAiData = { ...photo.aiData };
                    let tags = (nextAiData.tags || []).filter((tag) => tag !== oldLocation && tag !== 'Neznámé místo' && tag !== '#Neznámé místo');
                    tags.push(value);
                    nextAiData.tags = [...new Set(tags)];

                    if (nextAiData.eventNameSource === 'placeholder' && isPlaceholderEventName(nextAiData.event_name || '')) {
                        const parentParts = (nextAiData.event_name || '').split('/').slice(0, -1).map(cleanEventName).filter(Boolean);
                        if (nextAiData.eventKind === 'trip') {
                            nextAiData.event_name = `Trip ${nextAiData.tripNumber || 1} - ${value}`;
                        } else if (nextAiData.eventKind === 'trip-stop') {
                            nextAiData.event_name = [...parentParts, buildPlaceholderStopName((nextAiData.stopNumber || 1) - 1, value)].join('/');
                        } else if (nextAiData.eventKind !== 'home') {
                            nextAiData.event_name = [...parentParts, buildPlaceholderEventName(placeholderEventIndex(nextAiData), value)].join('/');
                        }
                    }

                    return { ...photo, hardData: nextHardData, aiData: nextAiData };
                }));
            };

            // Creates a real folder/event from the photos selected on the heatmap.
            const createFolderFromHeatmap = (ids, value, location) => {
                const idSet = new Set(ids || []);
                const name = sanitizeFolderName(value);
                if (idSet.size === 0 || !name) return;

                const newId = `evt-heatmap-${Date.now()}`;
                const nextClusterNumber = photos.reduce((max, photo) => Math.max(max, photo.aiData?.clusterNumber || 0), 0) + 1;
                const locationName = String(location || '').trim();

                setPhotos((previous) => previous.map((photo) => {
                    if (!idSet.has(photo.id)) return photo;
                    const updated = {
                        ...photo,
                        hardData: { ...(photo.hardData || {}) },
                        aiData: { ...(photo.aiData || {}) }
                    };
                    updated.aiData.event_name = name;
                    updated.aiData.eventNameSource = 'manual';
                    updated.aiData.tripNameSource = 'manual';
                    updated.aiData.stopNameSource = 'manual';
                    updated.aiData.eventKind = 'misc';
                    updated.aiData.clusterId = newId;
                    updated.aiData.tripId = newId;
                    updated.aiData.clusterNumber = nextClusterNumber;
                    updated.aiData.tripNumber = 0;
                    updated.aiData.stopNumber = 0;
                    updated.aiData.tripStart = null;
                    updated.aiData.tripEnd = null;
                    updated.aiData.category = 'Událost';

                    if (locationName) {
                        const oldLocation = updated.hardData.location;
                        updated.hardData.location = locationName;
                        updated.hardData.locationKey = normalizeLocationName(locationName);
                        updated.hardData.locationSource = 'manual';
                        updated.hardData.coords = null;
                        const tags = (updated.aiData.tags || []).filter((tag) => tag !== oldLocation && tag !== 'Neznámé místo' && tag !== '#Neznámé místo');
                        tags.push(locationName);
                        updated.aiData.tags = [...new Set(tags)];
                    }

                    return updated;
                }));

                setHeatmapPhotoIds(new Set());
                setSelectedPhotos(new Set());
                setMessage({
                    title: t('Složka vytvořena', 'Folder created'),
                    text: t(`Vytvořena složka „${name}“ pro ${idSet.size} fotek.`, `Created folder "${name}" for ${idSet.size} photos.`)
                });
            };


            // Adds heatmap-selected photos to an existing folder/event without
            // creating a new one (e.g. a second Turnov cluster weeks later).
            const addPhotosToExistingFolder = (ids, eventName) => {
                const idSet = new Set(ids || []);
                const name = String(eventName || '').trim();
                if (idSet.size === 0 || !name) return;

                setPhotos((previous) => {
                    const target = previous.find((photo) =>
                        !isScreenshotCategory(photo.aiData?.category) && photo.aiData?.event_name === name
                    ) || previous.find((photo) => photo.aiData?.event_name === name);
                    const targetAi = target?.aiData || {};
                    const targetHard = target?.hardData || {};
                    const targetId = targetAi.clusterId || targetAi.tripId || null;
                    const newId = targetId ? null : `evt-heatmap-${Date.now()}`;
                    const nextClusterNumber = targetId ? 0 : previous.reduce((max, photo) => Math.max(max, photo.aiData?.clusterNumber || 0), 0) + 1;
                    const locationName = String(targetHard.location || '').trim();

                    return previous.map((photo) => {
                        if (!idSet.has(photo.id)) return photo;
                        const updated = {
                            ...photo,
                            hardData: { ...(photo.hardData || {}) },
                            aiData: { ...(photo.aiData || {}) }
                        };
                        updated.aiData.event_name = name;
                        updated.aiData.eventNameSource = 'manual';
                        updated.aiData.tripNameSource = 'manual';
                        updated.aiData.stopNameSource = 'manual';
                        updated.aiData.eventKind = targetAi.eventKind || 'misc';
                        updated.aiData.clusterId = targetAi.clusterId || newId;
                        updated.aiData.tripId = targetAi.tripId || targetAi.clusterId || newId;
                        updated.aiData.clusterNumber = targetAi.clusterNumber || nextClusterNumber;
                        updated.aiData.tripNumber = targetAi.tripNumber || 0;
                        updated.aiData.stopNumber = targetAi.stopNumber || 0;
                        updated.aiData.tripStart = targetAi.tripStart || null;
                        updated.aiData.tripEnd = targetAi.tripEnd || null;
                        updated.aiData.category = targetAi.category || 'Událost';

                        if (locationName) {
                            const oldLocation = updated.hardData.location;
                            updated.hardData.location = locationName;
                            updated.hardData.locationKey = targetHard.locationKey || normalizeLocationName(locationName);
                            updated.hardData.locationSource = 'manual';
                            updated.hardData.coords = null;
                            const tags = (updated.aiData.tags || []).filter((tag) => tag !== oldLocation && tag !== 'Neznámé místo' && tag !== '#Neznámé místo');
                            tags.push(locationName);
                            updated.aiData.tags = [...new Set(tags)];
                        }

                        return updated;
                    });
                });

                setHeatmapPhotoIds(new Set());
                setSelectedPhotos(new Set());
                setMessage({
                    title: t('Přidáno do složky', 'Added to folder'),
                    text: t(`Přidáno ${idSet.size} fotek do složky „${name}“.`, `Added ${idSet.size} photos to folder "${name}".`)
                });
            };


            const editTripWindowFromGroup = (group) => {
                const start = group.tripStart || new Date(group.first).getTime();
                const end = group.tripEnd || new Date(group.last).getTime();
                const format = (value) => {
                    const date = new Date(value);
                    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                };
                setTripModal({
                    isOpen: true,
                    start: format(start),
                    end: format(end),
                    name: group.name || '',
                    location: group.location || ''
                });
                setShowClusterReview(false);
            };

            const filteredPhotos = useMemo(() => {
                let res = photos;
                const folderFilters = activeFilters.filter(f => f.startsWith('event-')).map(f => f.replace('event-', ''));
                const tagFilters = activeFilters.filter(f => f.startsWith('tag-')).map(f => f.replace('tag-', ''));
                const screenshotFilter = activeFilters.includes('screenshots');

                if (folderFilters.length > 0 || tagFilters.length > 0 || screenshotFilter) {
                    res = res.filter(p => {
                        let passFolder = folderFilters.length === 0;
                        if (folderFilters.length > 0) {
                            const pEvent = p.aiData?.event_name || '';
                            passFolder = folderFilters.some(event => pEvent === event || pEvent.startsWith(event + '/'));
                        }

                        // Sčítací OR logika pro Tagy (pokud je vybráno Noc a Švýcarsko, stačí aby fotka měla jedno z toho)
                        let passTag = tagFilters.length === 0;
                        if (tagFilters.length > 0) {
                            passTag = tagFilters.some(t => (p.aiData?.tags || []).includes(t) || p.hardData?.timelineLoc === t);
                        }

                        let passScreenshot = true;
                        if (screenshotFilter) {
                            passScreenshot = isScreenshotCategory(p.aiData?.category);
                        }

                        // Mezi kategoriemi (Složka vs Tag) platí AND
                        return passFolder && passTag && passScreenshot;
                    });
                }

                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    res = res.filter(p => p.name.toLowerCase().includes(q) || p.hardData?.location?.toLowerCase().includes(q) || p.aiData?.event_name?.toLowerCase().includes(q));
                }

                if (heatmapPhotoIds.size > 0) {
                    res = res.filter(p => heatmapPhotoIds.has(p.id));
                }
                return res;
            }, [photos, activeFilters, searchQuery, heatmapPhotoIds]);

            const missingLocationCount = photos.filter(photoNeedsLocation).length;
            const dataFillPhoto = showDataFill ? photos.find((photo) => photo.id === dataFillQueue[dataFillIndex]) : null;
            const dataFillNearbyCount = dataFillPhoto ? findNeighborsMissingLocation(photos, dataFillPhoto, dataFillWindowHours * 3600000).size : 0;
            const activeFolderPaths = useMemo(() => {
                const paths = activeFilters
                    .filter((filter) => filter.startsWith('event-'))
                    .map((filter) => filter.slice('event-'.length));
                return [...new Set(paths)].sort(naturalCompare);
            }, [activeFilters]);

            const phaseDone = {
                1: Boolean(completedSteps[1]) || photos.some((photo) => photo.hardData?.dateStr),
                2: Boolean(completedSteps[2]) || photos.some((photo) => photo.aiData?.event_name),
                3: Boolean(completedSteps[3]),
                4: Boolean(completedSteps[4]),
                5: Boolean(completedSteps[5]) || (photos.length > 0 && missingLocationCount === 0)
            };

            const phaseHeader = (step, title, optional, isDone, isOpen, onToggle) => (
                <div className="flex items-center justify-between gap-2">
                    <span className="text-[10px] text-slate-400 uppercase font-bold flex items-center gap-1.5 min-w-0">
                        <span className={`inline-flex items-center justify-center w-4 h-4 rounded-full text-[10px] font-bold shrink-0 ${isDone ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-slate-500 border border-slate-700'}`}>
                            {isDone ? '✓' : step}
                        </span>
                        <span className="truncate">{title}</span>
                        {optional && <span className="text-[9px] text-slate-500 normal-case font-medium">({t('volitelné', 'optional')})</span>}
                    </span>
                    <button
                        onClick={onToggle}
                        title={t('Nastavení fáze', 'Phase settings')}
                        className={`text-xs px-1.5 py-0.5 rounded shrink-0 ${isOpen ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white'}`}
                    >⚙️</button>
                </div>
            );

            const tourSteps = useMemo(() => {
                const tr = (cs, en) => lang === 'cs' ? cs : en;
                const labels = {
                    skipLabel: tr('Přeskočit', 'Skip'),
                    backLabel: tr('Zpět', 'Back'),
                    nextLabel: tr('Další', 'Next'),
                    doneLabel: tr('Hotovo', 'Done')
                };
                const steps = [
                    {
                        title: tr('Vítejte v Clustru', 'Welcome to Clustr'),
                        body: tr('Krátká prohlídka na minutu. Kdykoli ji můžete přeskočit a později znovu spustit pomocí otazníku.', 'A one-minute tour. Skip it any time and replay it later from the question mark.')
                    },
                    {
                        target: '[data-tour="upload"]',
                        title: tr('Nahrát složku', 'Upload folder'),
                        body: tr('Tady začnete. Vyberte složku s fotkami; Clustr je přečte přímo v prohlížeči a nikam je nenahraje.', 'Start here. Choose your photo folder; Clustr reads it in the browser and never uploads it.')
                    },
                    {
                        target: '[data-tour="timeline"]',
                        title: tr('Timeline je volitelná', 'Timeline is optional'),
                        body: tr('Import Google Timeline přiřadí lokace podle času fotky. Bez něj Clustr použije GPS nebo ruční doplnění.', 'Import Google Timeline to assign places by photo time. Without it, Clustr uses GPS or manual filling.')
                    }
                ];
                if (photos.length > 0) {
                    steps.push(
                        {
                            target: '[data-tour="phase-1"]',
                            title: tr('Fáze 1 – EXIF metadata', 'Phase 1 - EXIF metadata'),
                            body: tr('Načte datum, fotoaparát a lokaci. Pod ozubeným kolem nastavíte domovské město.', 'Reads date, camera and location. Set your home city behind the cog.')
                        },
                        {
                            target: '[data-tour="phase-2"]',
                            title: tr('Fáze 2 – Clustering a heatmapy', 'Phase 2 - Clustering and heatmaps'),
                            body: tr('Hlavní třídění. Zvolte automatické clustery, nebo kreslete vlastní v heatmapě. Nastavení je pod ozubeným kolem.', 'The main sorting step. Use auto clustering or draw your own clusters in the heatmap. Settings live behind the cog.')
                        },
                        {
                            target: '[data-folder-tree]',
                            title: tr('Strom složek', 'Folder tree'),
                            body: tr('Kliknutím na složku filtrujete galerii. Nad fotkami se pak ukáže celá cesta, například Trip 1 → Stop 2.', 'Click a folder to filter the gallery. The full path appears above the photos, for example Trip 1 → Stop 2.')
                        },
                        {
                            target: '[data-tour="phase-3"]',
                            title: tr('Fáze 3 – Názvy (volitelné)', 'Phase 3 - Event names (optional)'),
                            body: tr('Nechá AI nebo model pojmenovat události. Ručně zadané názvy zůstanou nedotčené.', 'Let AI or a model name your events. Names you typed yourself stay untouched.')
                        },
                        {
                            target: '[data-tour="phase-4"]',
                            title: tr('Fáze 4 – Vizuální tagy (volitelné)', 'Phase 4 - Visual tags (optional)'),
                            body: tr('Přidá klíčová slova z obsahu fotek. Potřebuje Ollama; klidně tuto fázi přeskočte.', 'Adds keywords from photo content. It needs Ollama; feel free to skip it.')
                        },
                        {
                            target: '[data-tour="phase-5"]',
                            title: tr('Fáze 5 – Doplňování dat (volitelné)', 'Phase 5 - Data fill (optional)'),
                            body: tr('Ukazuje fotky bez lokace. Zadané místo aplikuje i na blízké fotky; okno nastavíte pod ozubeným kolem.', 'Shows photos without a location. A place you enter also applies to nearby photos; set the window behind the cog.')
                        },
                        {
                            target: '[data-gallery]',
                            title: tr('Galerie a drobečky', 'Gallery and breadcrumbs'),
                            body: tr('Nad fotkami vidíte Všechny fotky nebo vybrané cesty. Výběr fotek najdete v Heatmapě, Tinderu i hromadné úpravě.', 'Above the photos you see All photos or the selected paths. Select photos in the heatmap, Tinder or bulk edit.')
                        }
                    );
                } else {
                    steps.push({
                        title: tr('Fáze se objeví po nahrání', 'Phases appear after loading'),
                        body: tr('Po výběru složky se vlevo zobrazí fáze 1 až 5. Každá má fajfku po dokončení a ozubené kolo s nastavením.', 'After you choose a folder, phases 1 to 5 appear on the left. Each gets a checkmark when done and a cog for settings.')
                    });
                }
                steps.push(
                    {
                        target: '[data-tour="export"]',
                        title: tr('Export s průběhem', 'Export with progress'),
                        body: tr('Vyberte cílovou složku. Uvidíte ukazatel průběhu a Clustr zapíše fotky i XMP sidecary pro Lightroom.', 'Choose a destination. You will see a progress bar while Clustr writes photos and Lightroom XMP sidecars.')
                    },
                    {
                        target: '[data-tour="help"]',
                        title: tr('Prohlídku lze zopakovat', 'Replay the tour'),
                        body: tr('Tady kdykoli otevřete nápovědu a tlačítkem Spustit prohlídku si ji pustíte znovu.', 'Open help here any time and use Start tour to replay this walkthrough.')
                    }
                );
                return steps.map((step) => ({ ...labels, ...step }));
            }, [lang, photos.length]);

            const allTags = useMemo(() => {
                const s = new Set();
                photos.forEach(p => {
                    if (p.aiData?.tags) p.aiData.tags.forEach(t => s.add(t));
                    if (p.hardData?.timelineLoc) s.add(p.hardData.timelineLoc);
                });
                return Array.from(s).sort();
            }, [photos]);

            const allEvents = useMemo(() => {
                const s = new Set(customFolders);
                photos.forEach(p => {
                    if (p.aiData?.event_name) s.add(p.aiData.event_name);
                });
                return Array.from(s).sort(naturalCompare);
            }, [photos, customFolders]);

            // REKURZIVNÍ STROM (Podpora nekonečného zanoření)
            const nestedTree = useMemo(() => {
                const root = { children: {}, fullPath: '', name: 'root' };
                allEvents.forEach(path => {
                    if (!path) return;
                    const parts = path.split('/');
                    let current = root;
                    let currentPath = '';
                    parts.forEach(part => {
                        currentPath = currentPath ? `${currentPath}/${part}` : part;
                        if (!current.children[part]) {
                            current.children[part] = { name: part, fullPath: currentPath, children: {} };
                        }
                        current = current.children[part];
                    });
                });
                return root.children;
            }, [allEvents]);

            const renderFolderNode = (node) => {
                const isActive = activeFilters.includes(`event-${node.fullPath}`);
                const hasChildren = Object.keys(node.children).length > 0;
                return (
                    <div key={node.fullPath} className="pl-3 mt-1 text-xs">
                        <div 
                            draggable
                            onDragStart={(e) => handleFolderDragStart(e, node.fullPath)}
                            onDragOver={handleDragOver}
                            onDrop={(e) => handleDropOnEvent(e, node.fullPath)}
                            className={`group flex items-center justify-between p-1.5 rounded cursor-pointer transition-colors ${isActive ? 'bg-rose-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                        >
                            <div 
                                onClick={() => setActiveFilters(p => p.includes(`event-${node.fullPath}`) ? p.filter(f => f !== `event-${node.fullPath}`) : [...p, `event-${node.fullPath}`])}
                                className="flex items-center gap-1.5 truncate flex-1"
                            >
                                <span>{hasChildren ? '📂' : '📁'}</span> 
                                <span className={hasChildren ? "font-bold" : ""}>{node.name}</span>
                            </div>
                            <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100">
                                <button onClick={(e) => { e.stopPropagation(); handleWrapFolder(node.fullPath); }} className="text-[10px] px-1 hover:text-orange-400" title="Zabalit do nadřazené složky (Vytvořit parent)">📦</button>
