<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Správce Fotografií</title>
    
    <!-- Tailwind CSS pro vzhled -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React a ReactDOM pro uživatelské rozhraní -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel pro překlad JSX syntaxe v prohlížeči -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- exifr pro čtení EXIF dat (datumu pořízení) z fotek -->
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .photo-overlay { background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const App = () => {
            // Stavové proměnné
            const [photos, setPhotos] = useState([]);
            const [activeFilter, setActiveFilter] = useState('all');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [tagSearchQuery, setTagSearchQuery] = useState(''); // Nový stav pro hledání tagů
            const [apiKey, setApiKey] = useState('');
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            const [apiKeyInput, setApiKeyInput] = useState('');
            const [showOrganizerModal, setShowOrganizerModal] = useState(false);
            const [messageBox, setMessageBox] = useState(null); // Bezpečné nahrazení za alert()
            
            const fileInputRef = useRef(null);

            // Při startu zkontrolujeme, zda už máme API klíč uložený
            useEffect(() => {
                const storedKey = localStorage.getItem('gemini_api_key');
                if (storedKey) setApiKey(storedKey);
            }, []);

            const handleFolderSelect = async (e) => {
                const files = Array.from(e.target.files).filter(file => file.type.startsWith('image/'));
                if (files.length === 0) return;

                const loadedPhotos = [];
                const storedCache = JSON.parse(localStorage.getItem('ai_photo_cache') || '{}');

                for (let file of files) {
                    const url = URL.createObjectURL(file);
                    let date = new Date(file.lastModified);
                    
                    try {
                        const exifData = await exifr.parse(file, ['DateTimeOriginal']);
                        if (exifData && exifData.DateTimeOriginal) {
                            date = new Date(exifData.DateTimeOriginal);
                        }
                    } catch (err) {
                        console.warn("EXIF se nepodařilo přečíst pro", file.name);
                    }

                    const cacheId = `${file.name}_${file.size}`;
                    const cachedAiData = storedCache[cacheId] || null;

                    loadedPhotos.push({
                        id: Math.random().toString(36).substr(2, 9),
                        file: file, // Původní nezměněný originál v plné kvalitě
                        name: file.name,
                        url: url,
                        date: date,
                        aiData: cachedAiData,
                        isAnalyzing: false,
                        error: null,
                        cacheId: cacheId
                    });
                }
                
                loadedPhotos.sort((a, b) => b.date - a.date);
                setPhotos(loadedPhotos);
            };

            const resizeImage = (file, maxSize = 800) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onerror = (err) => reject(err);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onerror = (err) => reject(err);
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > maxSize) {
                                    height *= maxSize / width;
                                    width = maxSize;
                                }
                            } else {
                                if (height > maxSize) {
                                    width *= maxSize / height;
                                    height = maxSize;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                            resolve(base64);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const analyzePhotos = async () => {
                if (!apiKey) {
                    setShowApiKeyModal(true);
                    return;
                }

                setIsAnalyzing(true);
                const unanalyzed = photos.filter(p => !p.aiData && !p.error);
                let updatedPhotos = [...photos];
                
                const cleanApiKey = apiKey.trim();

                for (let i = 0; i < unanalyzed.length; i++) {
                    const targetPhoto = unanalyzed[i];
                    const photoIndex = updatedPhotos.findIndex(p => p.id === targetPhoto.id);
                    if (photoIndex === -1) continue;
                    
                    updatedPhotos[photoIndex] = { ...updatedPhotos[photoIndex], isAnalyzing: true, error: null };
                    setPhotos([...updatedPhotos]);

                    try {
                        const base64Data = await resizeImage(targetPhoto.file);
                        
                        const payload = {
                            contents: [{
                                parts: [
                                    { text: `Jsi profesionální správce fotografií. Analyzuj tuto fotku a buď velmi detailní. 
                                    Odpověz POUZE validním JSON objektem v tomto formátu (žádný markdown text okolo, žádné další znaky):
                                    {
                                        "category": "JEDNA_Z_KATEGORIÍ",
                                        "location_guess": "Odhad místa (např. 'interiér', 'les', 'město', 'hory', nebo konkrétní město/stát pokud je zřejmé)",
                                        "time_of_day": "Ráno/Den/Zlatá hodinka/Večer/Noc/Neznámé",
                                        "season": "Jaro/Léto/Podzim/Zima/Neznámé",
                                        "tags": ["tag1", "tag2", "tag3", "...", "tag15"],
                                        "description": "Jednovětý výstižný popis"
                                    }
                                    Kategorie MUSÍ BÝT přesně jedna z těchto: "Výlet/Dovolená", "Portrét/Lidé", "Krajina/Příroda", "Zvířata", "Architektura/Město", "Makro/Detail", "Textura/Odpad/Screenshot", "Dokumenty", "Jiné". Vygeneruj 10 až 15 velmi detailních tagů (zahrnující náladu, barvy, objekty, styl).` },
                                    { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                                ]
                            }]
                        };

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${cleanApiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const result = await response.json();
                        
                        if (!response.ok || result.error) {
                            const errMsg = result.error?.message || `HTTP Chyba ${response.status}`;
                            throw new Error(errMsg);
                        }

                        if (!result.candidates || result.candidates.length === 0) {
                             throw new Error("Model nevrátil žádná data.");
                        }

                        let jsonText = result.candidates[0].content.parts[0].text;
                        jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
                        
                        const parsedData = JSON.parse(jsonText);

                        updatedPhotos[photoIndex] = { 
                            ...updatedPhotos[photoIndex], 
                            aiData: parsedData, 
                            isAnalyzing: false 
                        };
                        
                        const storedCache = JSON.parse(localStorage.getItem('ai_photo_cache') || '{}');
                        storedCache[targetPhoto.cacheId] = parsedData;
                        localStorage.setItem('ai_photo_cache', JSON.stringify(storedCache));

                    } catch (error) {
                        console.error("Chyba analýzy pro", targetPhoto.name, error);
                        updatedPhotos[photoIndex] = { 
                            ...updatedPhotos[photoIndex], 
                            isAnalyzing: false, 
                            error: error.message || "Neznámá chyba" 
                        };
                    }
                    
                    setPhotos([...updatedPhotos]);
                    await new Promise(r => setTimeout(r, 800));
                }
                setIsAnalyzing(false);
            };

            const organizeToDisk = async (strategy) => {
                if (!window.showDirectoryPicker) {
                    setMessageBox({title: "Chyba", text: "Váš prohlížeč nepodporuje ukládání souborů na disk (File System Access API). Použijte Chrome nebo Edge."});
                    return;
                }

                try {
                    const rootDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    
                    for (const photo of photos) {
                        if (!photo.aiData) continue; 
                        
                        let folderName = 'Ostatní';
                        const dateStr = `${photo.date.getFullYear()}-${String(photo.date.getMonth() + 1).padStart(2, '0')}`;

                        if (strategy === 'category_date') {
                            folderName = `${photo.aiData.category.replace(/\//g, '_')} - ${dateStr}`;
                        } else if (strategy === 'year_month') {
                            folderName = dateStr;
                        } else if (strategy === 'location') {
                            const loc = photo.aiData.location_guess !== "Neznámé" ? photo.aiData.location_guess : "Neznámé Místo";
                            folderName = `${loc.replace(/[\/\\]/g, '_')}`;
                        }

                        const folderHandle = await rootDirHandle.getDirectoryHandle(folderName, { create: true });
                        const fileHandle = await folderHandle.getFileHandle(photo.name, { create: true });
                        const writable = await fileHandle.createWritable();
                        // Uložení absolutně nedotčeného původního souboru (žádná ztráta dat)
                        await writable.write(photo.file);
                        await writable.close();
                    }
                    
                    setShowOrganizerModal(false);
                    setMessageBox({title: "Hotovo! 🎉", text: "Fotky byly úspěšně zkopírovány a roztříděny na váš disk v plné originální kvalitě."});

                } catch (err) {
                    console.error("Chyba při ukládání", err);
                    if (err.name !== 'AbortError') {
                        setMessageBox({title: "Chyba ukládání", text: "Při ukládání došlo k chybě: " + err.message});
                    }
                }
            };

            const filteredPhotos = useMemo(() => {
                let result = photos;
                
                if (activeFilter.startsWith('cat-')) {
                    const cat = activeFilter.replace('cat-', '');
                    result = result.filter(p => p.aiData && p.aiData.category === cat);
                } else if (activeFilter.startsWith('year-')) {
                    const year = parseInt(activeFilter.replace('year-', ''));
                    result = result.filter(p => p.date.getFullYear() === year);
                } else if (activeFilter.startsWith('tag-')) {
                    const tag = activeFilter.replace('tag-', '');
                    result = result.filter(p => p.aiData && p.aiData.tags && p.aiData.tags.includes(tag));
                }

                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    result = result.filter(p => {
                        if (p.name.toLowerCase().includes(q)) return true;
                        if (!p.aiData) return false;
                        
                        return (
                            (p.aiData.tags && p.aiData.tags.some(t => t.toLowerCase().includes(q))) ||
                            (p.aiData.category && p.aiData.category.toLowerCase().includes(q)) ||
                            (p.aiData.description && p.aiData.description.toLowerCase().includes(q)) ||
                            (p.aiData.location_guess && p.aiData.location_guess.toLowerCase().includes(q)) ||
                            (p.aiData.time_of_day && p.aiData.time_of_day.toLowerCase().includes(q)) ||
                            (p.aiData.season && p.aiData.season.toLowerCase().includes(q))
                        );
                    });
                }

                return result;
            }, [photos, activeFilter, searchQuery]);

            const years = [...new Set(photos.map(p => p.date.getFullYear()))].sort((a, b) => b - a);
            const categories = [...new Set(photos.filter(p => p.aiData).map(p => p.aiData.category))];
            
            // Unikátní a abecedně seřazené tagy pro boční panel
            const allTags = useMemo(() => {
                const tagsSet = new Set();
                photos.forEach(p => {
                    if (p.aiData && p.aiData.tags) {
                        p.aiData.tags.forEach(t => tagsSet.add(t));
                    }
                });
                return Array.from(tagsSet).sort((a, b) => a.localeCompare(b, 'cs'));
            }, [photos]);

            const handleSaveApiKey = () => {
                const cleanKey = apiKeyInput.trim();
                localStorage.setItem('gemini_api_key', cleanKey);
                setApiKey(cleanKey);
                setShowApiKeyModal(false);
            };

            const handleResetApiKey = () => {
                localStorage.removeItem('gemini_api_key');
                setApiKey('');
                setApiKeyInput('');
                setMessageBox({title: "Reset", text: "API klíč byl vymazán z paměti."});
            };

            return (
                <>
                    <div className="flex h-screen overflow-hidden">
                        
                        {/* Boční panel */}
                        <div className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shadow-xl z-10 flex-shrink-0">
                            <div className="p-5 border-b border-slate-800">
                                <h1 className="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent flex items-center gap-2">
                                    <span>📸</span> AI Správce
                                </h1>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-6">
                                <div>
                                    <input 
                                        type="file"
                                        ref={fileInputRef}
                                        webkitdirectory="true" 
                                        directory="true" 
                                        multiple 
                                        className="hidden" 
                                        onChange={handleFolderSelect}
                                    />
                                    <div className="space-y-2">
                                        <button 
                                            onClick={() => fileInputRef.current.click()}
                                            className="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-sm py-2.5 px-4 rounded-lg transition-colors border border-slate-700 shadow-sm cursor-pointer"
                                        >
                                            <span>📂</span> Z lokálního disku
                                        </button>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-2 text-center">Vyberte složku. Fotky se nikam nenahrávají.</p>
                                </div>

                                {photos.length > 0 && (
                                    <div className="bg-indigo-900/20 rounded-xl p-3 border border-indigo-500/30">
                                        <p className="text-xs text-indigo-300 mb-2 flex justify-between">
                                            <span>Neanalyzováno:</span>
                                            <span className="font-bold">{photos.filter(p => !p.aiData).length}</span>
                                        </p>
                                        <button 
                                            onClick={analyzePhotos}
                                            disabled={isAnalyzing}
                                            className={`w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-sm font-medium transition-all shadow-lg ${isAnalyzing ? 'bg-indigo-800 text-indigo-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-900/50 cursor-pointer'}`}
                                        >
                                            {isAnalyzing ? (
                                                <><span className="animate-spin">🌀</span> Zpracovávám...</>
                                            ) : (
                                                <><span className="text-lg">✨</span> Auto-Třídění pomocí AI</>
                                            )}
                                        </button>
                                    </div>
                                )}

                                {photos.length > 0 && (
                                    <div className="space-y-4">
                                        <div>
                                            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Obecné</h3>
                                            <button 
                                                onClick={() => setActiveFilter('all')}
                                                className={`w-full text-left px-3 py-1.5 rounded text-sm transition-colors cursor-pointer ${activeFilter === 'all' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                                            >
                                                Všechny fotky ({photos.length})
                                            </button>
                                        </div>

                                        {categories.length > 0 && (
                                            <div>
                                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Chytré složky</h3>
                                                <div className="space-y-1">
                                                    {categories.map(cat => (
                                                        <button 
                                                            key={cat}
                                                            onClick={() => setActiveFilter(`cat-${cat}`)}
                                                            className={`w-full text-left px-3 py-1.5 rounded text-sm transition-colors truncate cursor-pointer ${activeFilter === `cat-${cat}` ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                                                        >
                                                            {cat}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* NOVÉ: Filtrování a vyhledávání tagů */}
                                        {allTags.length > 0 && (
                                            <div>
                                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Podle Tagů</h3>
                                                <div className="relative mb-2">
                                                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 text-xs">🔍</span>
                                                    <input 
                                                        type="text" 
                                                        placeholder="Vyhledat tag..." 
                                                        value={tagSearchQuery}
                                                        onChange={(e) => setTagSearchQuery(e.target.value)}
                                                        className="w-full bg-slate-950 border border-slate-700 text-xs rounded-lg px-2 py-1.5 pl-7 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-slate-200 transition-all"
                                                    />
                                                </div>
                                                <div className="flex flex-wrap gap-1 max-h-48 overflow-y-auto custom-scrollbar p-1">
                                                    {allTags
                                                        .filter(t => t.toLowerCase().includes(tagSearchQuery.toLowerCase()))
                                                        .map(tag => (
                                                        <button 
                                                            key={tag}
                                                            onClick={() => setActiveFilter(`tag-${tag}`)}
                                                            className={`text-[10px] px-2 py-1 rounded transition-colors cursor-pointer border ${activeFilter === `tag-${tag}` ? 'bg-indigo-600 border-indigo-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700 hover:border-slate-600'}`}
                                                        >
                                                            #{tag}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {years.length > 0 && (
                                            <div>
                                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Podle roku</h3>
                                                <div className="space-y-1">
                                                    {years.map(year => (
                                                        <button 
                                                            key={year}
                                                            onClick={() => setActiveFilter(`year-${year}`)}
                                                            className={`w-full text-left px-3 py-1.5 rounded text-sm transition-colors cursor-pointer ${activeFilter === `year-${year}` ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                                                        >
                                                            {year}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                            
                            <div className="p-4 border-t border-slate-800">
                                <button onClick={handleResetApiKey} className="text-xs text-slate-500 hover:text-red-400 w-full text-center transition-colors cursor-pointer">
                                    ⚙️ Smazat uložený API klíč
                                </button>
                            </div>
                        </div>

                        {/* Hlavní obsah */}
                        <div className="flex-1 bg-slate-950 flex flex-col relative h-full overflow-hidden">
                            <div className="h-16 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-900/50 backdrop-blur flex-shrink-0">
                                <div className="flex-1 max-w-xl">
                                    <div className="relative">
                                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">🔍</span>
                                        <input 
                                            type="text" 
                                            placeholder="Hledat fotky (např. 'les', 'hory', 'zima', 'zlatá hodinka')..." 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full bg-slate-800 border border-slate-700 text-sm rounded-full py-2 pl-10 pr-4 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-500"
                                        />
                                    </div>
                                </div>
                                <div className="ml-4 flex gap-2">
                                     {photos.filter(p => p.aiData).length > 0 && (
                                        <button 
                                            onClick={() => setShowOrganizerModal(true)}
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white text-sm py-2 px-4 rounded-full font-medium transition-colors shadow-lg shadow-emerald-900/20 flex items-center gap-2 cursor-pointer"
                                        >
                                            <span>💾</span> Organizovat na disk
                                        </button>
                                    )}
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto p-6 custom-scrollbar">
                                {photos.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-500">
                                        <div className="text-6xl mb-4 opacity-50">🖼️</div>
                                        <h2 className="text-xl font-medium text-slate-400 mb-2">Zatím tu nic není</h2>
                                        <p className="text-sm max-w-md text-center">Začněte výběrem složky z vašeho disku v levém panelu. Fotky zůstanou bezpečně ve vašem zařízení.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                                        {filteredPhotos.map(photo => (
                                            <div key={photo.id} className="group relative aspect-square rounded-xl overflow-hidden bg-slate-800 border border-slate-700/50 shadow-sm hover:shadow-xl hover:border-slate-600 transition-all cursor-pointer">
                                                <img src={photo.url} alt={photo.name} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy" />
                                                
                                                {photo.isAnalyzing && (
                                                    <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center">
                                                        <span className="animate-spin text-3xl mb-2">🌀</span>
                                                        <span className="text-xs font-medium text-blue-300">Analýza...</span>
                                                    </div>
                                                )}

                                                {photo.error && !photo.isAnalyzing && (
                                                    <div className="absolute top-2 right-2 bg-red-600/90 backdrop-blur-sm text-white text-[10px] px-2 py-1 rounded shadow-lg max-w-[85%] cursor-help z-20">
                                                        <div className="flex items-center gap-1 font-bold">
                                                            <span>⚠️</span> Chyba API
                                                        </div>
                                                        <div className="hidden group-hover:block absolute top-full right-0 mt-1 bg-black/95 text-red-200 p-2 rounded border border-red-900/50 text-[10px] w-48 break-words shadow-2xl">
                                                            {photo.error}
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="photo-overlay absolute bottom-0 left-0 right-0 p-3 pt-12 flex flex-col justify-end z-10 pointer-events-none">
                                                    {photo.aiData ? (
                                                        <>
                                                            <div className="flex gap-1 flex-wrap mb-1">
                                                                <span className="text-[10px] font-bold text-white bg-indigo-600 px-1.5 py-0.5 rounded truncate max-w-full shadow">
                                                                    {photo.aiData.category}
                                                                </span>
                                                                {photo.aiData.location_guess && photo.aiData.location_guess !== "Neznámé" && (
                                                                    <span className="text-[9px] font-medium text-blue-100 bg-blue-800/80 px-1.5 py-0.5 rounded truncate shadow">
                                                                        📍 {photo.aiData.location_guess}
                                                                    </span>
                                                                )}
                                                                {photo.aiData.time_of_day && photo.aiData.time_of_day !== "Neznámé" && (
                                                                    <span className="text-[9px] font-medium text-amber-100 bg-amber-800/80 px-1.5 py-0.5 rounded truncate shadow">
                                                                        ⏱ {photo.aiData.time_of_day}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            {/* NOVÉ: Klikací tagy na fotkách */}
                                                            <div className="flex gap-1 flex-wrap overflow-hidden max-h-12 mt-1">
                                                                {photo.aiData.tags && photo.aiData.tags.map((tag, idx) => (
                                                                    <span 
                                                                        key={idx} 
                                                                        onClick={(e) => { e.stopPropagation(); setActiveFilter(`tag-${tag}`); }}
                                                                        className="text-[9px] text-slate-200 bg-black/60 px-1.5 py-0.5 rounded-full whitespace-nowrap border border-slate-700/50 hover:bg-indigo-600 hover:border-indigo-500 transition-colors pointer-events-auto cursor-pointer"
                                                                    >
                                                                        #{tag}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        </>
                                                    ) : (
                                                        <span className="text-xs text-slate-400">{photo.error ? 'Selhalo' : 'Neanalyzováno'}</span>
                                                    )}
                                                    <span className="text-[10px] text-slate-400 mt-2 font-mono">
                                                        {photo.date.toLocaleDateString('cs-CZ')}
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Modální okna */}
                    {showApiKeyModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl">
                                <h2 className="text-xl font-bold mb-2">Vyžadován API Klíč</h2>
                                <p className="text-sm text-slate-400 mb-4">
                                    Pro použití AI analýzy lokálně potřebujete klíč k modelu Google Gemini.
                                    Získáte ho na <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-blue-400 hover:underline">Google AI Studio</a>.
                                </p>
                                <input 
                                    type="password" 
                                    placeholder="Vložte klíč (např. AIzaSy...)" 
                                    value={apiKeyInput}
                                    onChange={(e) => setApiKeyInput(e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                />
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-sm text-slate-400 hover:text-white cursor-pointer">Zrušit</button>
                                    <button onClick={handleSaveApiKey} className="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium text-white shadow-lg cursor-pointer">Uložit klíč</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showOrganizerModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-lg w-full shadow-2xl">
                                <h2 className="text-xl font-bold mb-2 flex items-center gap-2"><span>💾</span> Organizovat na disk</h2>
                                <p className="text-sm text-slate-400 mb-6">
                                    Tato funkce zkopíruje analyzované fotky do nové složky na vašem disku a automaticky je roztřídí do podsložek podle zvoleného pravidla. Původní fotky zůstanou zachovány.
                                </p>
                                
                                <div className="space-y-3 mb-6">
                                    <button onClick={() => organizeToDisk('category_date')} className="w-full flex items-center justify-between p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition-colors text-left group cursor-pointer">
                                        <div>
                                            <div className="font-bold text-slate-200 mb-1">✨ Podle příležitosti a data</div>
                                            <div className="text-xs text-slate-500 font-mono">/Výlet_Dovolená - 2024-08/fotka.jpg</div>
                                        </div>
                                        <span className="text-slate-500 group-hover:text-blue-400">→</span>
                                    </button>

                                    <button onClick={() => organizeToDisk('location')} className="w-full flex items-center justify-between p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition-colors text-left group cursor-pointer">
                                        <div>
                                            <div className="font-bold text-slate-200 mb-1">📍 Podle lokace (Odhad AI)</div>
                                            <div className="text-xs text-slate-500 font-mono">/Paříž/fotka.jpg</div>
                                        </div>
                                        <span className="text-slate-500 group-hover:text-blue-400">→</span>
                                    </button>

                                    <button onClick={() => organizeToDisk('year_month')} className="w-full flex items-center justify-between p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition-colors text-left group cursor-pointer">
                                        <div>
                                            <div className="font-bold text-slate-200 mb-1">📅 Klasicky podle času</div>
                                            <div className="text-xs text-slate-500 font-mono">/2024-08/fotka.jpg</div>
                                        </div>
                                        <span className="text-slate-500 group-hover:text-blue-400">→</span>
                                    </button>
                                </div>

                                <div className="flex justify-end">
                                    <button onClick={() => setShowOrganizerModal(false)} className="px-4 py-2 text-sm text-slate-400 hover:text-white transition-colors cursor-pointer">
                                        Zrušit
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Vlastní Message Box místo problémového systémového alert() */}
                    {messageBox && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center">
                                <h2 className="text-lg font-bold mb-3 text-slate-100">{messageBox.title}</h2>
                                <p className="text-sm text-slate-400 mb-6">{messageBox.text}</p>
                                <button 
                                    onClick={() => setMessageBox(null)} 
                                    className="w-full px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium text-white shadow-lg cursor-pointer transition-colors"
                                >
                                    Rozumím
                                </button>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
