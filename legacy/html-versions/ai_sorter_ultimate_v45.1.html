<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sorter - Ultimate Final s RAW/HEIC Konvertorem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- EXIFR full umí číst i zabudované náhledy v RAWu -->
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
    <!-- HEIC to JPEG konvertor -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <!-- UTIF dekodér pro složité TIFF/RAW (NEF, CR2, DNG) -->
    <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .photo-overlay { background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%); }
    </style>
</head>
<body class="bg-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- HELPERS (Mimo komponentu pro stabilitu) ---
        const geocodeCache = new Map();

        // Agresivnější záchrana poškozeného JSONu z AI
        const safeJsonParse = (str) => {
            if (!str) return null;
            try {
                return JSON.parse(str);
            } catch (e) {
                console.error("JSON Parse Error. Pokus o opravu a vyčištění řetězce...");
                try {
                    let cleaned = str.replace(/```json|```/g, '').trim();
                    if (cleaned.endsWith(',')) cleaned = cleaned.slice(0, -1);
                    if (!cleaned.endsWith(']')) {
                        const lastBrace = cleaned.lastIndexOf('}');
                        if (lastBrace !== -1) {
                            cleaned = cleaned.substring(0, lastBrace + 1) + ']';
                        } else {
                            cleaned += ']';
                        }
                    }
                    return JSON.parse(cleaned);
                } catch (e2) {
                    console.error("Kritické selhání zpracování JSON dat.");
                    return null; 
                }
            }
        };

        const getSeason = (date) => {
            const month = date.getMonth() + 1;
            if (month >= 3 && month <= 5) return 'Jaro';
            if (month >= 6 && month <= 8) return 'Léto';
            if (month >= 9 && month <= 11) return 'Podzim';
            return 'Zima';
        };

        const getTimeOfDay = (date) => {
            const hour = date.getHours();
            if (hour >= 5 && hour < 9) return 'Ráno';
            if (hour >= 9 && hour < 17) return 'Den';
            if (hour >= 17 && hour < 19) return 'Podvečer';
            if (hour >= 19 && hour < 22) return 'Večer';
            return 'Noc';
        };

        const reverseGeocode = async (latLon) => {
            if (!latLon) return null;
            if (geocodeCache.has(latLon)) return geocodeCache.get(latLon);
            try {
                const [lat, lon] = latLon.split(',');
                await new Promise(r => setTimeout(r, 1100));
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`, {
                    headers: { 'User-Agent': 'AI-Photo-Sorter-Pro/6.0' }
                });
                if (!res.ok) return null;
                const data = await res.json();
                const addr = data.address;
                if (!addr) return null;

                // Robust hierarchy to avoid "Unknown"
                const place = addr.city || addr.town || addr.village || addr.municipality || addr.county || addr.state || addr.country || 'Neznámé místo';

                geocodeCache.set(latLon, place);
                return place;
            } catch (e) { return null; }
        };

        const generatePreview = async (file) => {
            const ext = file.name.split('.').pop().toLowerCase();
            try {
                const thumbUrl = await exifr.thumbnailUrl(file);
                if (thumbUrl) return thumbUrl;
            } catch (e) {}

            if (ext === 'heic' || ext === 'heif') {
                try {
                    const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.7 });
                    const blob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                    return URL.createObjectURL(blob);
                } catch (e) { console.warn("HEIC konverze selhala"); }
            }

            if (['nef', 'cr2', 'dng', 'arw', 'tif', 'tiff'].includes(ext)) {
                try {
                    const buffer = await file.arrayBuffer();
                    const ifds = UTIF.decode(buffer);
                    if (ifds && ifds.length > 0) {
                        let ifd = ifds[0];
                        if (ifds.length > 1 && ifds[1].width && ifds[1].height) {
                            ifd = ifds[1]; 
                        }
                        UTIF.decodeImage(buffer, ifd);
                        const rgba = UTIF.toRGBA8(ifd);
                        const canvas = document.createElement('canvas');
                        canvas.width = ifd.width;
                        canvas.height = ifd.height;
                        const ctx = canvas.getContext('2d');
                        const imgData = new ImageData(new Uint8ClampedArray(rgba), ifd.width, ifd.height);
                        ctx.putImageData(imgData, 0, 0);
                        return canvas.toDataURL('image/jpeg', 0.8);
                    }
                } catch (e) {
                    console.warn("RAW UTIF konverze selhala", e);
                }
            }
            return null;
        };

        const App = () => {
            const [photos, setPhotos] = useState([]);
            const [timelineData, setTimelineData] = useState(null);
            const [activeFilters, setActiveFilters] = useState([]); 
            const [searchQuery, setSearchQuery] = useState('');
            const [tagSearchQuery, setTagSearchQuery] = useState('');
            const [isExtracting, setIsExtracting] = useState(false);
            const [isTimelineLoading, setIsTimelineLoading] = useState(false);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isMoondreaming, setIsMoondreaming] = useState(false);
            const [progress, setProgress] = useState('');
            const [analyzingProgress, setAnalyzingProgress] = useState(0);
            const [ollamaStatus, setOllamaStatus] = useState('checking');
            const [message, setMessage] = useState(null);
            const [showTinder, setShowTinder] = useState(false);
            const [tinderIndex, setTinderIndex] = useState(0);
            const [tinderQueue, setTinderQueue] = useState([]);
            const [renameModal, setRenameModal] = useState({ isOpen: false, oldName: '', newName: '', type: 'tag' });
            const [showExportModal, setShowExportModal] = useState(false);
            const [showHelpModal, setShowHelpModal] = useState(false);
            
            const [cloudDb, setCloudDb] = useState(null);
            const [cloudMetadata, setCloudMetadata] = useState(null);
            const [needsRelink, setNeedsRelink] = useState(false);
            const [isCloudSyncing, setIsCloudSyncing] = useState(false);
            
            const [selectedPhotos, setSelectedPhotos] = useState(new Set());
            const [bulkModal, setBulkModal] = useState({ isOpen: false, type: '', value: '' });
            
            const [lang, setLang] = useState('cs');
            const [analyzingPhotoId, setAnalyzingPhotoId] = useState(null);
            const t = (cs, en) => lang === 'cs' ? cs : en;

            const [textModel, setTextModel] = useState('llama3.2');
            const [textModelCustom, setTextModelCustom] = useState('');
            const [chunkSize, setChunkSize] = useState(150);
            const [geminiApiKey, setGeminiApiKey] = useState('');
            
            const [visionModel, setVisionModel] = useState('moondream');
            const [visionModelCustom, setVisionModelCustom] = useState('');
            
            const fileInputRef = useRef(null);
            const timelineInputRef = useRef(null);

            useEffect(() => {
                checkOllama();
                setInterval(checkOllama, 10000);
                const handleKeyDown = (e) => {
                    if (!showTinder) return;
                    if (e.key === 'ArrowLeft') handleTinderSwipe(false);
                    else if (e.key === 'ArrowRight') handleTinderSwipe(true);
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [showTinder, tinderIndex, tinderQueue]);

            useEffect(() => {
                const initCloud = async () => {
                    try {
                        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const { getFirestore, doc, getDoc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                        
                        if (!firebaseConfig || Object.keys(firebaseConfig).length === 0) return;

                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        
                        const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                        let user;
                        if (token) {
                            const cred = await signInWithCustomToken(auth, token);
                            user = cred.user;
                        } else {
                            const cred = await signInAnonymously(auth);
                            user = cred.user;
                        }

                        setCloudDb({ db, appId, uid: user.uid, doc, setDoc });

                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'workspace', 'current');
                        const snap = await getDoc(docRef);
                        if (snap.exists()) {
                            const data = snap.data();
                            if (data.geminiApiKey) setGeminiApiKey(data.geminiApiKey);
                            if (data.metadata) {
                                setCloudMetadata(data.metadata);
                                setNeedsRelink(true);
                            }
                        }
                    } catch (e) { console.error("Cloud init error", e); }
                };
                initCloud();
            }, []);

            useEffect(() => {
                if (!cloudDb) return;
                if (photos.length === 0 && !geminiApiKey) return;
                
                const timer = setTimeout(async () => {
                    setIsCloudSyncing(true);
                    try {
                        const { db, appId, uid, doc, setDoc } = cloudDb;
                        const simplifiedPhotos = photos.map(p => ({
                            name: p.name,
                            date: p.date.getTime(),
                            hardData: p.hardData || null,
                            aiData: p.aiData || null
                        }));
                        
                        const payload = { metadata: JSON.stringify(simplifiedPhotos) };
                        if (geminiApiKey) payload.geminiApiKey = geminiApiKey;
                        
                        await setDoc(doc(db, 'artifacts', appId, 'users', uid, 'workspace', 'current'), payload);
                    } catch(e) { console.error("Save error", e); }
                    setTimeout(() => setIsCloudSyncing(false), 800);
                }, 2000);
                return () => clearTimeout(timer);
            }, [photos, geminiApiKey, cloudDb]);

            const checkOllama = async () => {
                try {
                    const res = await fetch('http://localhost:11434/');
                    setOllamaStatus(res.ok ? 'online' : 'offline');
                } catch(e) { setOllamaStatus('offline'); }
            };

            const processThumbnails = async (loadedFiles) => {
                const CONCURRENCY_LIMIT = 6; 
                const queue = [...loadedFiles];
                
                const worker = async () => {
                    while (queue.length > 0) {
                        const p = queue.shift();
                        if (!p || !p.isRaw) continue;
                        
                        try {
                            const thumbUrl = await generatePreview(p.file);
                            setPhotos(prev => prev.map(item => 
                                item.id === p.id ? { ...item, url: thumbUrl, thumbLoading: false } : item
                            ));
                        } catch (err) {
                            console.warn(`Náhled selhal pro ${p.name}`);
                            setPhotos(prev => prev.map(item => 
                                item.id === p.id ? { ...item, thumbLoading: false } : item
                            ));
                        }
                    }
                };

                const workers = Array(CONCURRENCY_LIMIT).fill(null).map(() => worker());
                await Promise.all(workers);
            };

            const handleFolder = (e) => {
                const allowedExts = ['jpg','jpeg','png','webp','heic','heif','nef','cr2','arw','dng','orf','raf', 'tif', 'tiff'];
                const files = Array.from(e.target.files).filter(f => {
                    const ext = f.name.split('.').pop().toLowerCase();
                    return f.type.startsWith('image/') || allowedExts.includes(ext);
                });
                
                let parsedMeta = [];
                if (cloudMetadata) {
                    parsedMeta = safeJsonParse(cloudMetadata) || [];
                }

                const loaded = files.map(f => {
                    const existing = parsedMeta.find(m => m.name === f.name);
                    const ext = f.name.split('.').pop().toLowerCase();
                    const isRaw = ['nef', 'cr2', 'arw', 'dng', 'raf', 'orf', 'heic', 'heif', 'tif', 'tiff'].includes(ext);
                    
                    return {
                        id: Math.random().toString(36).substr(2, 9),
                        file: f, 
                        name: f.name, 
                        url: isRaw ? null : URL.createObjectURL(f), 
                        isRaw: isRaw,
                        thumbLoading: isRaw,
                        date: existing ? new Date(existing.date) : new Date(f.lastModified), 
                        hardData: existing?.hardData || null, 
                        aiData: existing?.aiData || null
                    };
                }).sort((a, b) => b.date - a.date);
                
                setPhotos(loaded);
                setNeedsRelink(false);
                processThumbnails(loaded);
            };

            const handleTimeline = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setIsTimelineLoading(true);
                const reader = new FileReader();
                reader.onload = (ev) => {
                    // Dáme UI čas překreslit tlačítko na "Zpracovávám...", než zablokujeme vlákno parsováním JSONu
                    setTimeout(() => {
                        try {
                            const raw = safeJsonParse(ev.target.result);
                            if (!raw) {
                                setMessage({ title: "Chyba", text: "JSON neplatný nebo poškozený." });
                                return;
                            }
                            
                            const items = Array.isArray(raw) ? raw : (raw.timelineObjects || raw.semanticSegments || []);
                            const places = items.map(item => {
                                const v = item.visit || item.placeVisit;
                                if (!v) return null;
                                let coords = null;
                                if (v.topCandidate?.placeLocation) coords = v.topCandidate.placeLocation.replace('geo:', '');
                                else if (v.location?.coordinates) coords = v.location.coordinates.join(',');
                                return {
                                    name: v.location?.name || "Timeline Lokace",
                                    coords: coords,
                                    start: (v.duration?.startTimestamp || item.startTime) ? new Date(v.duration?.startTimestamp || item.startTime).getTime() : 0,
                                    end: (v.duration?.endTimestamp || item.endTime) ? new Date(v.duration?.endTimestamp || item.endTime).getTime() : 0
                                };
                            }).filter(Boolean);
                            
                            setTimelineData(places);
                            setMessage({ title: "OK", text: `Timeline úspěšně nahráno: ${places.length} záznamů.` });
                        } catch(err) { 
                            setMessage({ title: "Chyba", text: "Chyba při zpracování Timeline dat." }); 
                        } finally {
                            setIsTimelineLoading(false);
                            if(e.target) e.target.value = ''; 
                        }
                    }, 50);
                };
                reader.readAsText(file);
            };

            const runPhase1 = async () => {
                setIsExtracting(true);
                const photosToProcess = [...photos];

                for (let i = 0; i < photosToProcess.length; i++) {
                    const p = photosToProcess[i];
                    if (p.hardData) continue;
                    let date = p.date;
                    let tags = [];
                    let location = 'Neznámé místo';
                    let camera = 'Neznámý fotoaparát';
                    let coordsToGeocode = null;
                    let semanticLocation = null;

                    try {
                        const exif = await exifr.parse(p.file, true);
                        if (exif?.DateTimeOriginal) {
                            date = new Date(exif.DateTimeOriginal);
                        }
                        if (exif?.Make || exif?.Model) {
                            camera = `${exif.Make || ''} ${exif.Model || ''}`.trim();
                        }
                        if (exif?.latitude && exif?.longitude) {
                            coordsToGeocode = `${exif.latitude},${exif.longitude}`;
                        }

                        if (timelineData) {
                            const t = date.getTime();
                            // Widened window to 3 hours (10800000ms) to capture transitions
                            const match = timelineData.find(m => t >= (m.start - 10800000) && t <= (m.end + 10800000));
                            if (match) {
                                if (match.name && match.name !== "Timeline Lokace" && match.name !== "Neznámé místo") {
                                    semanticLocation = match.name;
                                } else if (match.coords && !coordsToGeocode) {
                                    coordsToGeocode = match.coords;
                                }
                            }
                        }

                        if (!semanticLocation && coordsToGeocode) {
                            const resLoc = await reverseGeocode(coordsToGeocode);
                            if (resLoc) semanticLocation = resLoc;
                        }

                        if (semanticLocation) location = semanticLocation;

                        tags = [getSeason(date), getTimeOfDay(date)];
                        if (location !== 'Neznámé místo') tags.push(location);

                        if (camera === 'Neznámý fotoaparát') tags.push('Bez EXIFu');
                    } catch(e) { console.error("Chyba analýzy metadat fotky:", e) }

                    setPhotos(prev => prev.map(item => {
                        if (item.id === p.id) {
                            return {
                                ...item,
                                date: date,
                                hardData: { dateStr: date.toLocaleDateString('cs-CZ'), location, camera },
                                aiData: { ...item.aiData, tags: [...new Set([...(item.aiData?.tags || []), ...tags])] }
                            };
                        }
                        return item;
                    }));

                    if (i % 5 === 0) {
                        setProgress(`Zpracovávám ${i+1}/${photosToProcess.length}...`);
                    }
                }

                setIsExtracting(false);
                setProgress('');
            };

            const runPhase2 = async () => {
                setIsAnalyzing(true);
                setAnalyzingProgress(0);
                setProgress(t('Inteligentní analýza shluků (Weighted Scoring)...', 'Intelligent cluster analysis (Weighted Scoring)...'));
                let updated = [...photos];

                const modelToUse = textModel === 'custom' ? textModelCustom : textModel;
                if (!modelToUse) { setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model.", "Select a model.") }); setIsAnalyzing(false); return; }

                try {
                    let screenshots = [];
                    let normalPhotos = [];

                    updated.forEach(p => {
                        if (p.aiData?.tags?.includes('Screenshot') || p.hardData?.camera === 'Neznámý fotoaparát' || p.hardData?.camera === 'Možný Screenshot / Textura' || p.aiData?.category === 'Snímky obrazovky / Různé') {
                            screenshots.push(p);
                        } else {
                            normalPhotos.push(p);
                        }
                    });

                    normalPhotos.sort((a, b) => a.date - b.date);

                    let clusters = [];
                    let currentCluster = [];
                    const BREAK_THRESHOLD = 70;

                    for (let i = 0; i < normalPhotos.length; i++) {
                        const p = normalPhotos[i];
                        if (currentCluster.length === 0) {
                            currentCluster.push(p);
                        } else {
                            const lastP = currentCluster[currentCluster.length - 1];
                            let breakScore = 0;

                            // 1. Time Gap Scoring
                            const timeDiff = p.date.getTime() - lastP.date.getTime();
                            if (timeDiff > 2 * 24 * 60 * 60 * 1000) breakScore += 50; // > 48h
                            else if (timeDiff > 24 * 60 * 60 * 1000) breakScore += 20; // > 24h

                            // 2. Location Scoring
                            const locA = lastP.hardData?.location || 'Neznámé místo';
                            const locB = p.hardData?.location || 'Neznámé místo';
                            if (locA !== 'Neznámé místo' && locB !== 'Neznámé místo') {
                                if (locA !== locB) breakScore += 60; // Different city/region
                            }

                            // 3. Context Scoring
                            if (lastP.hardData?.camera !== p.hardData?.camera) breakScore += 10;

                            if (breakScore >= BREAK_THRESHOLD) {
                                clusters.push(currentCluster);
                                currentCluster = [p];
                            } else {
                                currentCluster.push(p);
                            }
                        }
                    }
                    if (currentCluster.length > 0) clusters.push(currentCluster);

                    // --- Post-Processing: Merge Phase ---
                    // Merge clusters that are very close in time and have the same location
                    let mergedClusters = [];
                    if (clusters.length > 0) {
                        let active = clusters[0];
                        for (let i = 1; i < clusters.length; i++) {
                            const next = clusters[i];
                            const lastPhotoOfActive = active[active.length - 1];
                            const firstPhotoOfNext = next[0];
                            const timeGap = firstPhotoOfNext.date.getTime() - lastPhotoOfActive.date.getTime();

                            const locA = lastPhotoOfActive.hardData?.location || 'Neznámé místo';
                            const locB = firstPhotoOfNext.hardData?.location || 'Neznámé místo';

                            // Merge if gap < 12h AND (locations are same OR one is unknown)
                            if (timeGap < 12 * 60 * 60 * 1000 && (locA === locB || locA === 'Neznámé místo' || locB === 'Neznámé místo')) {
                                active = [...active, ...next];
                            } else {
                                mergedClusters.push(active);
                                active = next;
                            }
                        }
                        mergedClusters.push(active);
                    }

                    setAnalyzingProgress(30);
                    setProgress(t(`Vytvořeno ${mergedClusters.length} bloků. Ptám se AI na názvy...`, `Created ${mergedClusters.length} blocks. Asking AI for names...`));

                    let clusterSummaries = mergedClusters.map((cluster, index) => {
                        let locations = [...new Set(cluster.map(p => p.hardData?.location).filter(l => l && l !== 'Neznámé místo'))];
                        let tags = [...new Set(cluster.flatMap(p => p.aiData?.tags || []))];
                        const isSparse = cluster.length < 3 && (cluster[cluster.length-1].date.getTime() - cluster[0].date.getTime() > 24 * 60 * 60 * 1000);
                        return {
                            id: index.toString(),
                            pocet_fotek: cluster.length,
                            datum: `${cluster[0].hardData.dateStr} - ${cluster[cluster.length - 1].hardData.dateStr}`,
                            lokace: locations.slice(0, 3).join(', '),
                            tagy: tags.slice(0, 5).join(', '),
                            typ: isSparse ? 'náhodné' : 'událost'
                        };
                    });

                    let finalNames = {};
                    if (clusterSummaries.length > 0) {
                        const prompt = `Jsi profesionální archivář. Mám zde seznam složek s fotkami (clusters).
                        Vymysli pro každou složku krátký, čistý a logický název.
                        - Pokud je typ 'událost', vymysli kreativní název (např. "Dovolená Itálie", "Výlet Praha", "Oslava narozenin").
                        - Pokud je typ 'náhodné', pojmenuj ho jako "Archiv [Měsíc/Rok]".
                        Vrať POUZE validní JSON objekt: {"id": "název"}.
                        DATA: ${JSON.stringify(clusterSummaries)}`;

                        let aiResponseText = "";
                        if (modelToUse.startsWith('gemini')) {
                            if (!geminiApiKey) throw new Error("Chybí Gemini API klíč!");
                            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent?key=${geminiApiKey}`, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { response_mime_type: "application/json", maxOutputTokens: 2048 } })
                            });
                            const result = await res.json();
                            aiResponseText = result.candidates[0].content.parts[0].text;
                        } else {
                            const res = await fetch('http://localhost:11434/api/generate', {
                                method: 'POST', headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({ model: modelToUse, prompt, stream: false, format: 'json', options: { num_predict: -1 } })
                            });
                            const result = await res.json();
                            aiResponseText = result.response;
                        }
                        const match = aiResponseText.match(/\{[\s\S]*\}/);
                        finalNames = safeJsonParse(match ? match[0] : aiResponseText) || {};
                    }

                    setAnalyzingProgress(80);
                    setProgress(t('Aplikuji názvy na fotky...', 'Applying names to photos...'));

                    let changesCount = 0;
                    mergedClusters.forEach((cluster, index) => {
                        let eventName = finalNames[index.toString()] || `Archiv ${cluster[0].hardData.dateStr}`;
                        cluster.forEach(p => {
                            const idx = updated.findIndex(u => u.id === p.id);
                            if (idx !== -1) {
                                updated[idx].aiData = { ...updated[idx].aiData, event_name: eventName, category: 'Událost' };
                                changesCount++;
                            }
                        });
                    });

                    screenshots.forEach(p => {
                        const idx = updated.findIndex(u => u.id === p.id);
                        if (idx !== -1) {
                            updated[idx].aiData = { ...updated[idx].aiData, event_name: 'Snímky obrazovky', category: 'Snímky obrazovky / Různé' };
                            changesCount++;
                        }
                    });

                    setAnalyzingProgress(100);
                    setPhotos([...updated]);
                    setMessage({ title: t("Fáze 2 hotovo", "Phase 2 Done"), text: t(`Zorganizováno ${changesCount} fotek. Vytvořeno ${mergedClusters.length} událostí.`, `Organized ${changesCount} photos. Created ${mergedClusters.length} events.`) });
                } catch (e) { setMessage({ title: t("Chyba AI", "AI Error"), text: e.message }); }
                setIsAnalyzing(false);
                setAnalyzingProgress(0);
                setProgress('');
            };length,
                            datum: `${cluster[0].hardData.dateStr} - ${cluster[cluster.length - 1].hardData.dateStr}`,
                            lokace: locations.slice(0, 3).join(', '),
                            tagy: tags.slice(0, 5).join(', '),
                            typ: isSparse ? 'náhodné' : 'událost'
                        };
                    });

                    // 3. AI POJMENUJE UDÁLOSTI (Malý úkol, který zvládne i slabý model)
                    let finalNames = {};
                    
                    if (clusterSummaries.length > 0) {
                        const prompt = `Jsi profesionální archivář. Mám zde seznam složek s fotkami (clusters).
                        Vymysli pro každou složku krátký, čistý a logický název.
                        - Pokud je typ 'událost', vymysli kreativní název (např. "Dovolená Itálie", "Výlet Praha", "Oslava narozenin").
                        - Pokud je typ 'náhodné', pojmenuj ho jako "Archiv [Měsíc/Rok]".
                        Vrať POUZE validní JSON objekt, kde klíč je "id" složky a hodnota je tvůj vymyšlený název.
                        PŘÍKLAD ODPOVĚDI: {"0": "Výlet do hor", "1": "Archiv srpen 2023"}

                        DATA K POJMENOVÁNÍ: ${JSON.stringify(clusterSummaries)}`;

                        let aiResponseText = "";

                        if (modelToUse.startsWith('gemini')) {
                            if (!geminiApiKey) throw new Error("Chybí Gemini API klíč!");
                            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent?key=${geminiApiKey}`, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { response_mime_type: "application/json", maxOutputTokens: 2048 } })
                            });
                            const result = await res.json();
                            if (result.error) throw new Error(result.error.message);
                            aiResponseText = result.candidates[0].content.parts[0].text;
                        } else {
                            const res = await fetch('http://localhost:11434/api/generate', {
                                method: 'POST', headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({ model: modelToUse, prompt, stream: false, format: 'json', options: { num_predict: -1 } })
                            });
                            const result = await res.json();
                            aiResponseText = result.response;
                        }

                        const match = aiResponseText.match(/\{[\s\S]*\}/);
                        const jsonString = match ? match[0] : aiResponseText;
                        finalNames = safeJsonParse(jsonString) || {};
                    }

                    setAnalyzingProgress(80);
                    setProgress(t('Aplikuji názvy na fotky...', 'Applying names to photos...'));

                    // 4. ZPĚTNÉ PŘIŘAZENÍ K FOTKÁM (Garantuje nevynechání jediné fotky)
                    let changesCount = 0;

                    clusters.forEach((cluster, index) => {
                        // Pokud AI selže a nepřiřadí název, použije se datum jako záloha
                        let eventName = finalNames[index.toString()] || `Archiv ${cluster[0].hardData.dateStr}`;
                        
                        cluster.forEach(p => {
                            const idx = updated.findIndex(u => u.id === p.id);
                            if (idx !== -1) {
                                updated[idx].aiData = { ...updated[idx].aiData, event_name: eventName, category: 'Událost' };
                                changesCount++;
                            }
                        });
                    });

                    screenshots.forEach(p => {
                        const idx = updated.findIndex(u => u.id === p.id);
                        if (idx !== -1) {
                            updated[idx].aiData = { ...updated[idx].aiData, event_name: 'Snímky obrazovky', category: 'Snímky obrazovky / Různé' };
                            changesCount++;
                        }
                    });

                    setAnalyzingProgress(100);
                    setPhotos([...updated]);
                    setMessage({ title: t("Fáze 2 hotovo", "Phase 2 Done"), text: t(`Zorganizováno ${changesCount} fotek. Vytvořeno ${clusters.length} událostí + Snímky obrazovky.`, `Organized ${changesCount} photos. Created ${clusters.length} events.`) });
                } catch (e) { setMessage({ title: t("Chyba AI", "AI Error"), text: e.message }); }
                
                setIsAnalyzing(false);
                setAnalyzingProgress(0);
                setProgress(''); 
            };

            const runPhase3 = async () => {
                if (ollamaStatus !== 'online') { setMessage({ title: t("Chyba", "Error"), text: t("Ollama není online.", "Ollama is not online.") }); return; }
                setIsMoondreaming(true);
                let updated = [...photos];
                const modelToUse = visionModel === 'custom' ? visionModelCustom : visionModel;
                if (!modelToUse) { setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model.", "Select a model.") }); setIsMoondreaming(false); return; }

                const prompt = t(
                    "What are the 5 main visual subjects in this image? Return ONLY 5 single-word keywords separated by commas, translated to Czech.", 
                    "What are the 5 main visual subjects in this image? Return ONLY 5 single-word keywords separated by commas."
                );

                for (let i = 0; i < updated.length; i++) {
                    const p = updated[i];
                    
                    if (!p.url) {
                        console.warn(`Přeskakuji vizuální tagy u ${p.name} - náhled není k dispozici.`);
                        continue;
                    }

                    try {
                        const imgRes = await fetch(p.url);
                        const imgBlob = await imgRes.blob();
                        const base64 = await new Promise(res => {
                            const reader = new FileReader();
                            reader.onload = () => res(reader.result.split(',')[1]);
                            reader.readAsDataURL(imgBlob);
                        });

                        const res = await fetch('http://localhost:11434/api/generate', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ model: modelToUse, prompt, images: [base64], stream: false })
                        });
                        const result = await res.json();
                        const tags = result.response.split(',').map(tg => tg.replace(/[^a-zA-Z0-9ěščřžýáíéúůťďňĚŠČŘŽÝÁÍÉÚŮŤĎŇ -]/g, '').trim()).filter(Boolean);
                        updated[i].aiData = { ...updated[i].aiData, tags: [...new Set([...(updated[i].aiData?.tags || []), ...tags])] };
                        if (i % 5 === 0) { setProgress(t(`Moondream ${i+1}/${updated.length}...`, `Moondream ${i+1}/${updated.length}...`)); setPhotos([...updated]); }
                    } catch(e) {}
                }
                setPhotos([...updated]);
                setIsMoondreaming(false);
                setProgress('');
            };

            const runSingleMoondream = async (e, photoId) => {
                e.stopPropagation(); 
                if (ollamaStatus !== 'online') { setMessage({ title: t("Chyba", "Error"), text: t("Ollama není online.", "Ollama is not online.") }); return; }

                if (!modelToUse) { setMessage({ title: t("Chyba", "Error"), text: t("Vyberte model pro vizi.", "Select a vision model.") }); return; }

                const p = photos.find(x => x.id === photoId);
                if (!p) return;
                if (!p.url) { setMessage({ title: t("Chyba", "Error"), text: t("Pro tuto fotku zatím nemáme náhled.", "Preview not available for this photo yet.") }); return; }

                setAnalyzingPhotoId(photoId);
                const prompt = t(
                    "What are the 5 main visual subjects in this image? Return ONLY 5 single-word keywords separated by commas, translated to Czech.", 
                    "What are the 5 main visual subjects in this image? Return ONLY 5 single-word keywords separated by commas."
                );
                
                try {
                    const imgRes = await fetch(p.url);
                    const imgBlob = await imgRes.blob();
                    const base64 = await new Promise(res => {
                        const reader = new FileReader();
                        reader.onload = () => res(reader.result.split(',')[1]);
                        reader.readAsDataURL(imgBlob);
                    });

                    const res = await fetch('http://localhost:11434/api/generate', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ model: modelToUse, prompt, images: [base64], stream: false })
                    });
                    const result = await res.json();
                    const tags = result.response.split(',').map(tg => tg.replace(/[^a-zA-Z0-9ěščřžýáíéúůťďňĚŠČŘŽÝÁÍÉÚŮŤĎŇ -]/g, '').trim()).filter(Boolean);
                    
                    setPhotos(prev => prev.map(item => {
                        if (item.id === photoId) {
                            return { ...item, aiData: { ...item.aiData, tags: [...new Set([...(item.aiData?.tags || []), ...tags])] } };
                        }
                        return item;
                    }));
                } catch(err) { console.error(err); }
                
                setAnalyzingPhotoId(null);
            };

            const startTinder = () => {
                const queue = filteredPhotos;
                if (queue.length === 0) return;
                setTinderQueue(queue);
                setTinderIndex(0);
                setShowTinder(true);
            };

            const handleTinderSwipe = (keep) => {
                if (!keep) {
                    setPhotos(prev => prev.map(p => p.id === tinderQueue[tinderIndex].id ? { 
                        ...p, aiData: { ...p.aiData, category: '🗑️ K vymazání', event_name: 'Vyřazeno' } 
                    } : p));
                }
                if (tinderIndex + 1 < tinderQueue.length) setTinderIndex(tinderIndex + 1);
                else setShowTinder(false);
            };

            const exportToDisk = async () => {
                if (!window.showDirectoryPicker) { setMessage({ title: "Chyba", text: "Prohlížeč nepodporuje export." }); return; }
                try {
                    const rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    for (const p of photos) {
                        if (p.aiData?.category === '🗑️ K vymazání') continue;
                        
                        let folderPath = p.aiData?.event_name || p.hardData?.location || "Ostatní";
                        
                        if (p.aiData?.category === 'Snímky obrazovky / Různé' || p.aiData?.tags?.includes('Screenshot')) {
                            folderPath = "Snímky obrazovky";
                        }
                        
                        folderPath = folderPath.replace(/[:*?"<>|]/g, '_');
                        let currentHandle = rootHandle;
                        const parts = folderPath.split('/');
                        for (const part of parts) {
                            currentHandle = await currentHandle.getDirectoryHandle(part, { create: true });
                        }
                        const safeFileName = p.name.replace(/[:*?"<>|]/g, '_');
                        const fileHandle = await currentHandle.getFileHandle(safeFileName, { create: true });
                        const writable = await fileHandle.createWritable();
                        
                        await writable.write(p.file);
                        await writable.close();
                    }
                    setShowExportModal(false);
                    setMessage({ title: "Export hotov!", text: "Originální fotky byly roztříděny a uloženy." });
                } catch (e) { setMessage({ title: "Chyba exportu", text: e.message }); }
            };

            const handleRename = () => {
                const { oldName, newName, type } = renameModal;
                if (!newName.trim()) return;
                
                setPhotos(prev => prev.map(p => {
                    if (type === 'tag' && p.aiData?.tags?.includes(oldName)) {
                        return { ...p, aiData: { ...p.aiData, tags: p.aiData.tags.map(t => t === oldName ? newName : t) } };
                    } else if (type === 'event' && p.aiData?.event_name === oldName) {
                        return { ...p, aiData: { ...p.aiData, event_name: newName } };
                    }
                    return p;
                }));

                setActiveFilters(prev => prev.map(f => {
                    if (type === 'tag' && f === `tag-${oldName}`) return `tag-${newName}`;
                    if (type === 'event' && f === `event-${oldName}`) return `event-${newName}`;
                    return f;
                }));

                setRenameModal({ isOpen: false, oldName: '', newName: '', type: 'tag' });
            };

            const toggleSelection = (id) => {
                const newSel = new Set(selectedPhotos);
                if (newSel.has(id)) newSel.delete(id);
                else newSel.add(id);
                setSelectedPhotos(newSel);
            };

            const toggleSelectAll = () => {
                if (selectedPhotos.size === filteredPhotos.length) {
                    setSelectedPhotos(new Set()); 
                } else {
                    setSelectedPhotos(new Set(filteredPhotos.map(p => p.id))); 
                }
            };

            const handleBulkEdit = () => {
                if (!bulkModal.value.trim()) return;
                const val = bulkModal.value.trim();
                let count = selectedPhotos.size;

                setPhotos(prev => prev.map(p => {
                    if (!selectedPhotos.has(p.id)) return p;
                    let updated = { ...p };
                    if (!updated.aiData) updated.aiData = {};
                    if (!updated.hardData) updated.hardData = { location: 'Neznámé místo' };

                    if (bulkModal.type === 'event') {
                        updated.aiData.event_name = val;
                    } else if (bulkModal.type === 'location') {
                        updated.hardData.location = val;
                    } else if (bulkModal.type === 'tag') {
                        updated.aiData.tags = [...new Set([...(updated.aiData.tags || []), val])];
                    }
                    return updated;
                }));

                setSelectedPhotos(new Set());
                setBulkModal({ isOpen: false, type: '', value: '' });
                setMessage({ title: "Hotovo", text: `Hromadná úprava úspěšně aplikována na ${count} fotek.`});
            };

            const filteredPhotos = useMemo(() => {
                let res = photos;
                if (activeFilters.length > 0) {
                    res = res.filter(p => activeFilters.every(f => {
                        if (f === 'screenshots') return p.aiData?.category === 'Snímky obrazovky / Různé';
                        if (f.startsWith('event-')) {
                            const event = f.replace('event-', '');
                            return p.aiData?.event_name === event;
                        }
                        if (f.startsWith('tag-')) {
                            const t = f.replace('tag-', '');
                            return (p.aiData?.tags?.includes(t)) || (p.hardData?.timelineLoc === t);
                        }
                        return true;
                    }));
                }
                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    res = res.filter(p => p.name.toLowerCase().includes(q) || p.hardData?.location?.toLowerCase().includes(q) || p.aiData?.event_name?.toLowerCase().includes(q));
                }
                return res;
            }, [photos, activeFilters, searchQuery]);

            const allTags = useMemo(() => {
                const s = new Set();
                photos.forEach(p => {
                    if (p.aiData?.tags) p.aiData.tags.forEach(t => s.add(t));
                    if (p.hardData?.timelineLoc) s.add(p.hardData.timelineLoc);
                });
                return Array.from(s).sort();
            }, [photos]);

            const allEvents = useMemo(() => {
                const s = new Set();
                photos.forEach(p => {
                    if (p.aiData?.event_name) s.add(p.aiData.event_name);
                });
                return Array.from(s).sort();
            }, [photos]);

            return (
                <div className="flex h-screen overflow-hidden">
                    <div className="w-80 bg-slate-900 border-r border-slate-800 flex flex-col">

                                <button onClick={() => fileInputRef.current.click()} className="w-full bg-slate-800 p-2 rounded text-sm text-white hover:bg-slate-700">{t("📂 Nahrát složku", "📂 Upload Folder")}</button>

                                    {isTimelineLoading ? t("⏳ Zpracovávám JSON...", "⏳ Processing JSON...") : (timelineData ? t(`🌍 Timeline (${timelineData.length})`, `🌍 Timeline (${timelineData.length})`) : t("🌍 Timeline JSON", "🌍 Timeline JSON"))}
                                </button>
                            </div>
                            
                            {photos.length > 0 && (
                                <div className="space-y-4">
                                    <div className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                                        <div className="text-[10px] text-slate-500 mb-2 uppercase font-bold">{t("1. Metadata & Tagy", "1. Metadata & Tags")}</div>
                                        <button onClick={runPhase1} disabled={isExtracting} className="w-full bg-blue-600 p-2 rounded text-xs text-white hover:bg-blue-500 disabled:bg-slate-700">
                                            {isExtracting ? (progress || t('Zpracovávám...', 'Processing...')) : t('📍 Zjistit EXIF', '📍 Extract EXIF')}
                                        </button>
                                    </div>

                                    <div className="p-3 bg-slate-950 rounded-lg border border-slate-800 space-y-2">
                                        <div className="text-[10px] text-slate-500 mb-1 uppercase font-bold">{t("2. AI Události (Clustering)", "2. AI Events (Clustering)")}</div>

                                        </select>
                                        
                                        <div className="flex gap-2">

                                            <select value={chunkSize} onChange={e => setChunkSize(e.target.value)} className="flex-1 bg-slate-800 text-xs p-1 rounded border border-slate-700 text-white">
